and UDP are transport layer protocols."},{"module":"Check Your Understanding - Protocol Suites","question":"Which two protocols belong in the TCP/IP model application layer?","options":["EIGRP","DNS","OSPF","ICMP","DHCP"],"answer":[1,4],"explanation":"DNS and DHCP belong to the TCP/IP application layer."},{"module":"Check Your Understanding - Protocol Suites","question":"Which protocol operates at the network access layer of the TCP/IP model?","options":["HTTP","IP","DNS","Ethernet"],"answer":[3],"explanation":"Ethernet operates at the TCP/IP network access layer."},{"module":"Check Your Understanding - Protocol Suites","question":"Which of the following are protocols that provide feedback from the destination host to the source host regarding errors in packet delivery? (Choose two.)","options":["IPv4","TCP","ICMPv4","IPv6","UDP","ICMPv6"],"answer":[2,5],"explanation":"ICMPv4 and ICMPv6 provide error feedback."},{"module":"Check Your Understanding - Protocol Suites","question":"A device receives a data link frame with data and processes and removes the Ethernet information. What information would be the next to be processed by the receiving device?","options":["HTTP at the application layer","HTML at the application layer","IP at the internet layer","UDP at the internet layer","TCP at the transport layer"],"answer":[2],"explanation":"After Ethernet de-encapsulation, the next processed information is IP at the internet layer."},{"module":"Check Your Understanding - Protocol Suites","question":"Which services are provided by the internet layer of the TCP/IP protocol suite? (Choose three.)","options":["File Transfer","Address Resolution","Routing Protocols","Messaging","Ethernet","Internet Protocol"],"answer":[2,3,5],"explanation":"The internet layer provides routing protocols, messaging through ICMP, and Internet Protocol."},{"module":"Check Your Understanding - Standards Organizations","question":"True or false. Standards organizations are usually vendor-neutral.","options":["True","False"],"answer":[0],"explanation":"Most standards organizations are vendor-neutral."},{"module":"Check Your Understanding - Standards Organizations","question":"This standards organization is concerned with the Request for Comments (RFC) documents that specify new protocols and update existing ones.","options":["Internet Society (ISOC)","Internet Engineering Task Force (IETF)","Internet Architecture Board (IAB)","Internet Research Task Force (IRTF)"],"answer":[1],"explanation":"The IETF develops and maintains RFC protocol specifications."},{"module":"Check Your Understanding - Standards Organizations","question":"This standards organization is responsible for IP address allocation and domain name management.","options":["Internet Society (ISOC)","Internet Engineering Task Force (IETF)","Internet Architecture Board (IAB)","Internet Assigned Numbers Authority (IANA)"],"answer":[3],"explanation":"IANA oversees IP address allocation and domain name management."},{"module":"Check Your Understanding - Standards Organizations","question":"What types of standards are developed by the Electronics Industries Alliance (EIA)?","options":["electric wiring and connectors","radio equipment and cell towers","video compression and broadband communications","Voice over IP (VoIP) and satellite communications"],"answer":[0],"explanation":"EIA develops standards related to electrical wiring and connectors."},{"module":"Check Your Understanding - Data Encapsulation","question":"What is the process of dividing a large data stream into smaller pieces prior to transmission?","options":["sequencing","duplexing","multiplexing","segmentation"],"answer":[3],"explanation":"Segmentation divides a large data stream into smaller pieces."},{"module":"Check Your Understanding - Data Encapsulation","question":"What is the PDU associated with the transport layer?","options":["segment","packet","bits","frame"],"answer":[0],"explanation":"The transport layer PDU is a segment."},{"module":"Check Your Understanding - Data Encapsulation","question":"Which protocol stack layer encapsulates data into frames?","options":["data link","transport","network","application"],"answer":[0],"explanation":"The data link layer encapsulates data into frames."},{"module":"Check Your Understanding - Data Encapsulation","question":"What is the name of the process of adding protocol information to data as it moves down the protocol stack?","options":["de-encapsulation","sequencing","segmentation","encapsulation"],"answer":[3],"explanation":"Encapsulation adds protocol information as data moves down the stack."},{"module":"Check Your Understanding - Data Access","question":"True or false? Frames exchanged between devices in different IP networks must be forwarded to a default gateway.","options":["True","False"],"answer":[0],"explanation":"Frames for devices on different IP networks must first be forwarded to the default gateway."},{"module":"Check Your Understanding - Data Access","question":"True or false? The right-most part of an IP address is used to identify the network that a device belongs to.","options":["True","False"],"answer":[1],"explanation":"The left-most portion identifies the network; the right-most portion identifies the host."},{"module":"Check Your Understanding - Data Access","question":"What is used to determine the network portion of an IPv4 address?","options":["subnet mask","MAC address","right-most part of the IP address","left-most part of the MAC address"],"answer":[0],"explanation":"The subnet mask determines the network portion of an IPv4 address."},{"module":"Check Your Understanding - Data Access","question":"Which of the following statements are true regarding network layer and data link layer addresses? (Choose three.)","options":["Data link layer addresses are logical and network layer addresses are physical.","Network layer addresses are expressed as 12 hexadecimal digits and data link layer addresses are decimal.","Network layer addresses are logical and data link addresses are expressed as 12 hexadecimal digits.","Data link layer addresses are physical and network layer addresses are logical.","Network layer addresses are either 32 or 128 bits in length.","Data link layer addresses are 32 bits in length."],"answer":[2,3,4],"explanation":"Network layer addresses are logical 32-bit IPv4 or 128-bit IPv6 addresses, while data link MAC addresses are physical 12-hex-digit addresses."},{"module":"Check Your Understanding - Data Access","question":"What is the order of the two addresses in the data link frame?","options":["source MAC, destination MAC","destination MAC, source IP","destination IP, source IP","destination MAC, source MAC","source IP, destination IP"],"answer":[3],"explanation":"The data link frame lists destination MAC address first, then source MAC address."},{"module":"Check Your Understanding - Data Access","question":"True or False? Data Link addresses are physical so they never change in the data link frame from source to destination.","options":["True","False"],"answer":[1],"explanation":"Data link addresses can change at each hop when traffic is routed between networks."},{"module":"Check Your Understanding - Purpose of the Physical Layer","question":"True or false? The physical layer is only concerned with wired network connections.","options":["true","false"],"answer":[1],"explanation":"The physical layer transports bits over wired and wireless media."},{"module":"Check Your Understanding - Purpose of the Physical Layer","question":"True or false? When a frame is encoded by the physical layer, all bits are sent over the media at the same time.","options":["true","false"],"answer":[1],"explanation":"Bits are transmitted over the media one at a time."},{"module":"Check Your Understanding - Purpose of the Physical Layer","question":"The physical layer of the receiving device passes bits up to which higher level layer?","options":["application","presentation","network","data link"],"answer":[3],"explanation":"The physical layer passes received bits up to the data link layer."},{"module":"Check Your Understanding - Purpose of the Physical Layer","question":"What PDU is received by the physical layer for encoding and transmission?","options":["frame","segment","packet"],"answer":[0],"explanation":"The physical layer receives a frame from the data link layer."},{"module":"Check Your Understanding - Physical Layer Characteristics","question":"Which media uses patterns of microwaves to represent bits?","options":["copper","wireless","fiber-optic"],"answer":[1],"explanation":"Wireless networks use microwave patterns to represent bits."},{"module":"Check Your Understanding - Physical Layer Characteristics","question":"Which media uses patterns of light to represent bits?","options":["copper","wireless","fiber-optic"],"answer":[2],"explanation":"Fiber-optic media uses patterns of light to represent bits."},{"module":"Check Your Understanding - Physical Layer Characteristics","question":"Which media uses electrical pulses to represent bits?","options":["copper","wireless","fiber-optic"],"answer":[0],"explanation":"Copper media uses electrical pulses to represent bits."},{"module":"Check Your Understanding - Physical Layer Characteristics","question":"Which of these is the name for the capacity of a medium to carry data?","options":["bandwidth","throughput","goodput"],"answer":[0],"explanation":"Bandwidth is the capacity of a medium to carry data."},{"module":"Check Your Understanding - Physical Layer Characteristics","question":"Which of these is a measure of the transfer of bits across the media?","options":["bandwidth","throughput","goodput"],"answer":[1],"explanation":"Throughput measures the transfer of bits across media over time."},{"module":"Check Your Understanding - Copper Cabling","question":"Which of the following attaches antennas to wireless devices? It can also be bundled with fiber-optic cabling for two-way data transmission.","options":["UTP","STP","coaxial"],"answer":[2],"explanation":"Coaxial cable can attach antennas to wireless devices."},{"module":"Check Your Understanding - Copper Cabling","question":"Which of the following counters EMI and RFI by using shielding techniques and special connectors?","options":["UTP","STP","coaxial"],"answer":[1],"explanation":"STP uses shielding and special connectors to reduce EMI and RFI."},{"module":"Check Your Understanding - Copper Cabling","question":"Which of the following is the most common network media?","options":["UTP","STP","coaxial"],"answer":[0],"explanation":"UTP is the most common wired network media."},{"module":"Check Your Understanding - Copper Cabling","question":"Which of the following terminates with BNC, N type and F type connectors?","options":["UTP","STP","coaxial"],"answer":[2],"explanation":"Coaxial cable uses connector types such as BNC, N type, and F type."},{"module":"Check Your Understanding - Fiber-Optic Cabling","question":"Which of the following fiber-optic cable types can help data travel approximately 500 meters?","options":["multimode","single-mode"],"answer":[0],"explanation":"Multimode fiber is commonly used for shorter distances such as a few hundred meters."},{"module":"Check Your Understanding - Fiber-Optic Cabling","question":"Which of the following fiber-optic cable types use light emitting diodes (LEDs) as a data light source transmitter?","options":["multimode","single-mode"],"answer":[0],"explanation":"Multimode fiber uses LEDs as a light source."},{"module":"Check Your Understanding - Fiber-Optic Cabling","question":"Which of the following fiber-optic cable types use lasers in a single stream as a data light source transmitter?","options":["multimode","single-mode"],"answer":[1],"explanation":"Single-mode fiber uses laser light in a single stream."},{"module":"Check Your Understanding - Fiber-Optic Cabling","question":"Which of the following fiber-optic cable types is used to connect long-distance telephony and cable TV applications?","options":["multimode","single-mode"],"answer":[1],"explanation":"Single-mode fiber is used for long-distance telephony and cable TV applications."},{"module":"Check Your Understanding - Fiber-Optic Cabling","question":"Which of the following fiber-optic cable types can travel approximately 100 km?","options":["multimode","single-mode"],"answer":[1],"explanation":"Single-mode fiber can be used for long-haul applications up to about 100 km."},{"module":"Check Your Understanding - Fiber-Optic Cabling","question":"Which of the following fiber-optic cable types is used within a campus network?","options":["multimode","single-mode"],"answer":[0],"explanation":"Multimode fiber is commonly used within campus networks."},{"module":"Check Your Understanding - Wireless Media","question":"True or false. Wireless is not well suited for enterprise networks.","options":["true","false"],"answer":[1],"explanation":"Wireless is widely used in enterprise networks."},{"module":"Check Your Understanding - Wireless Media","question":"True or false. Wireless LANs operate in full-duplex allowing all devices to send or receive data at the same time so the number of users does not impact performance.","options":["true","false"],"answer":[1],"explanation":"WLANs operate in half-duplex, so users share access to the medium."},{"module":"Check Your Understanding - Wireless Media","question":"Which of the following wireless standards is best suited for industrial and IoT environments?","options":["Zigbee","WiMAX","Wi-Fi","Bluetooth"],"answer":[0],"explanation":"Zigbee is suited for low-data-rate, low-power industrial and IoT applications."},{"module":"Check Your Understanding - Wireless Media","question":"Which of the following wireless standards is used for Personal Area Networks (PANs) and allows devices to communicate over distances of 1 to 100 meters?","options":["Zigbee","WiMAX","Wi-Fi","Bluetooth"],"answer":[3],"explanation":"Bluetooth is commonly used for PAN communication over short distances."},{"module":"Check Your Understanding - Binary Number System","question":"Which is the binary equivalent to the 192.168.11.10 IP address?","options":["11000000.11000000.00001011.00001010","11000000.10101000.00001011.00001010","11000000.10101000.00001010.00001011","11000000.10101000.00001011.00010010"],"answer":[1],"explanation":"192.168.11.10 converts to 11000000.10101000.00001011.00001010."},{"module":"Check Your Understanding - Binary Number System","question":"Which of the following is the binary equivalent to the 172.16.31.30 IP address?","options":["11000000.00010000.00011111.00011110","10101000.00010000.00011111.00011110","10101100.00010000.00011110.00011110","10101100.00010000.00011111.00011110"],"answer":[3],"explanation":"172.16.31.30 converts to 10101100.00010000.00011111.00011110."},{"module":"Check Your Understanding - Hexadecimal Number System","question":"Which is the hexadecimal equivalent of 202?","options":["B10","BA","C10","CA"],"answer":[3],"explanation":"Decimal 202 is hexadecimal CA."},{"module":"Check Your Understanding - Hexadecimal Number System","question":"Which is the hexadecimal equivalent of 254?","options":["EA","ED","FA","FE"],"answer":[3],"explanation":"Decimal 254 is hexadecimal FE."},{"module":"Check Your Understanding - Hexadecimal Number System","question":"Which is the decimal equivalent of A9?","options":["168","169","170","171"],"answer":[1],"explanation":"Hexadecimal A9 is decimal 169."},{"module":"Check Your Understanding - Hexadecimal Number System","question":"Which of the following is the decimal equivalent of 7D?","options":["124","125","126","127"],"answer":[1],"explanation":"Hexadecimal 7D is decimal 125."},{"module":"Check Your Understanding - Purpose of the Data Link Layer","question":"What is another name for the OSI data link layer?","options":["Layer 1","Layer 2","Layer 3","Layer 6"],"answer":[1],"explanation":"The data link layer is OSI Layer 2."},{"module":"Check Your Understanding - Purpose of the Data Link Layer","question":"The IEEE 802 LAN/MAN data link layer consists of which two sublayers? (Choose two.)","options":["Network Control Protocol","Logical Link Control","Media Access Control","Link Control Protocol"],"answer":[1,2],"explanation":"The data link layer consists of LLC and MAC sublayers."},{"module":"Check Your Understanding - Purpose of the Data Link Layer","question":"What is the responsibility of the MAC sublayer?","options":["Adds Layer 3 addresses to the frame","Communicates with the network layer (Layer 3)","Provides the method to get the frame on and off the media","Transmits the bits on the media"],"answer":[2],"explanation":"The MAC sublayer controls how frames are placed on and removed from the media."},{"module":"Check Your Understanding - Purpose of the Data Link Layer","question":"What Layer 2 function does a router perform? (Choose three.)","options":["Accepts a frame from a medium","De-encapsulates the frame","Refers to its Layer 3 routing table for a matching destination network","Re-encapsulates the packet into a new frame"],"answer":[0,1,3],"explanation":"At Layer 2, a router accepts a frame, de-encapsulates it, and re-encapsulates the packet into a new frame."},{"module":"Check Your Understanding - Purpose of the Data Link Layer","question":"The media access control method used depends on which two criteria?","options":["Layer 3 IP protocol","Media sharing","Topology","Transport layer protocol","Type of data"],"answer":[1,2],"explanation":"Media access control depends on media sharing and topology."},{"module":"Check Your Understanding - Purpose of the Data Link Layer","question":"Which organization defines standards for the network access layer (i.e., the OSI physical and data link layers)?","options":["Cisco","IANA","IEEE","IETF"],"answer":[2],"explanation":"IEEE defines standards for the network access layer."},{"module":"Check Your Understanding - Topologies","question":"Which topology displays networking device layer IP addresses?","options":["aerial topology","IP address topology","logical topology","physical topology"],"answer":[2],"explanation":"A logical topology shows IP addresses assigned to device interfaces."},{"module":"Check Your Understanding - Topologies","question":"What kind of network would use point-to-point, hub and spoke, or mesh topologies?","options":["PAN","LAN","WLAN","WAN"],"answer":[3],"explanation":"WANs commonly use point-to-point, hub-and-spoke, and mesh topologies."},{"module":"Check Your Understanding - Topologies","question":"Which LAN topology is a hybrid topology?","options":["bus","extended star","ring","star"],"answer":[1],"explanation":"An extended star is a hybrid topology made of multiple star topologies."},{"module":"Check Your Understanding - Topologies","question":"Which duplex communication method is used in WLANs?","options":["full-duplex","half-duplex","simplex"],"answer":[1],"explanation":"WLANs use half-duplex communication."},{"module":"Check Your Understanding - Topologies","question":"Which media access control method is used in legacy Ethernet LANs?","options":["carrier sense multiple access/collision annoyance","carrier sense multiple access/collision avoidance","carrier sense multiple access/collision destruction","carrier sense multiple access/collision detection"],"answer":[3],"explanation":"Legacy Ethernet LANs use CSMA/CD."},{"module":"Check Your Understanding - Topologies","question":"What kind of physical networks are commonly used in WANs? (Choose three.)","options":["hub and spoke","bus","point-to-point","ring","extended star","mesh"],"answer":[0,2,5],"explanation":"WANs commonly use hub-and-spoke, point-to-point, and mesh topologies."},{"module":"Check Your Understanding - Topologies","question":"Which LAN topology has all end systems chained to each other and terminated at the end?","options":["extended star","ring","bus","star"],"answer":[2],"explanation":"A bus topology chains end systems together and terminates the ends."},{"module":"Check Your Understanding - Data Link Frame","question":"What does the data link layer add to a Layer 3 packet to create a frame? (Choose two.)","options":["flags","sequence number","header","trailer"],"answer":[2,3],"explanation":"The data link layer adds a header and trailer to create a frame."},{"module":"Check Your Understanding - Data Link Frame","question":"What is the function of the last field in a data link layer frame?","options":["To determine whether the frame experienced transmission errors","To identify special flow control services such as quality of service (QoS)","To identify the beginning and end limits of the frame","To identify the Layer 3 protocol in the data field"],"answer":[0],"explanation":"The last field is the FCS, which detects transmission errors."},{"module":"Check Your Understanding - Data Link Frame","question":"Which lists the Layer 2 and Layer 3 address fields in the correct order?","options":["destination NIC address, source NIC address, source IP address, destination IP address","source NIC address, destination NIC address, source IP address, destination IP address","destination NIC address, source NIC address, destination IP address, source IP address","source NIC address, destination NIC address, destination IP address, source IP address"],"answer":[0],"explanation":"The order is destination MAC, source MAC, source IP, destination IP."},{"module":"Check Your Understanding - Data Link Frame","question":"Which of the following are data link layer protocols? (Choose three)","options":["802.11","Ethernet","IP","PPP","UDP"],"answer":[0,1,3],"explanation":"802.11, Ethernet, and PPP are data link layer protocols."},{"module":"Check Your Understanding - Ethernet Switching","question":"Which part of an Ethernet Frame uses a pad to increase the frame field to at least 64 bytes?","options":["EtherType","Preamble","Start of Frame Delimiter","Data field"],"answer":[3],"explanation":"The data field may include padding so the Ethernet frame reaches the minimum size."},{"module":"Check Your Understanding - Ethernet Switching","question":"Which part of an Ethernet frame detects errors in the frame?","options":["Preamble","Start of Frame Delimiter","Frame Check Sequence"],"answer":[2],"explanation":"The Frame Check Sequence detects errors."},{"module":"Check Your Understanding - Ethernet Switching","question":"Which part of an Ethernet Frame describes the higher-layer protocol that is encapsulated?","options":["EtherType","Preamble","Start of Frame Delimiter","Frame Check Sequence"],"answer":[0],"explanation":"The EtherType field identifies the encapsulated higher-layer protocol."},{"module":"Check Your Understanding - Ethernet Switching","question":"Which part of an Ethernet Frame notifies the receiver to get ready for a new frame?","options":["Start of Frame Delimiter","Frame Check Sequence","Preamble","Data field"],"answer":[2],"explanation":"The preamble tells the receiver that a new frame is arriving."},{"module":"Check Your Understanding - Ethernet Switching","question":"Which data link sublayer controls the network interface through software drivers?","options":["MAC","LLC"],"answer":[1],"explanation":"The LLC sublayer controls the network interface through software drivers."},{"module":"Check Your Understanding - Ethernet Switching","question":"Which data link sublayer works with the upper layers to add application information for delivery of data to higher level protocols?","options":["MAC","LLC"],"answer":[1],"explanation":"The LLC sublayer works with upper layers to support higher-level protocols."},{"module":"Check Your Understanding - Ethernet Switching","question":"What is a function of the MAC sublayer? (Choose three.)","options":["controls access to the media","checks for errors in received bits","uses CSMA/CD or CSMA/CA to support Ethernet technology","communicates between software at the upper layers and the device hardware at the lower layers","allows multiple Layer 3 protocols to use the same network interface and media"],"answer":[0,1,2],"explanation":"The MAC sublayer controls media access, checks for bit errors, and supports Ethernet access methods."},{"module":"Check Your Understanding - Switch Speeds and Forwarding Methods","question":"What are two methods for switching data between ports on a switch? (Choose two.)","options":["cut-off switching","cut-through switching","store-and-forward switching","store-and-supply switching","store-and-restore switching"],"answer":[1,2],"explanation":"Switching methods include cut-through switching and store-and-forward switching."},{"module":"Check Your Understanding - Switch Speeds and Forwarding Methods","question":"Which switching method can be implemented using fast-forward switching or fragment-free switching?","options":["cut-off switching","cut-through switching","store-and-forward switching","store-and-restore switching"],"answer":[1],"explanation":"Cut-through switching includes fast-forward and fragment-free methods."},{"module":"Check Your Understanding - Switch Speeds and Forwarding Methods","question":"Which two types of memory buffering techniques are used by switches? (Choose two.)","options":["long-term memory buffering","port-based memory buffering","shared memory buffering","short-term memory buffering"],"answer":[1,2],"explanation":"Switches use port-based and shared memory buffering."},{"module":"Check Your Understanding - Switch Speeds and Forwarding Methods","question":"What feature automatically negotiates the best speed and duplex setting between interconnecting devices?","options":["auto-MDIX","autobots","autonegotiation","autotune"],"answer":[2],"explanation":"Autonegotiation negotiates speed and duplex between connected devices."},{"module":"Check Your Understanding - IP Characteristics","question":"Which OSI layer sends segments to be encapsulated in an IPv4 or IPv6 packet?","options":["data link layer","network layer","transport layer","session layer"],"answer":[2],"explanation":"The transport layer sends segments that are encapsulated into IP packets."},{"module":"Check Your Understanding - IP Characteristics","question":"Which layer is responsible for taking an IP packet and preparing it for transmission over the communications medium?","options":["physical layer","network layer","data link layer","transport layer"],"answer":[2],"explanation":"The data link layer prepares IP packets for transmission over the medium."},{"module":"Check Your Understanding - IP Characteristics","question":"What is the term for splitting up an IP packet when forwarding it from one medium to another medium with a smaller MTU?","options":["encapsulation","fragmentation","segmentation","serialization"],"answer":[1],"explanation":"Fragmentation splits an IP packet so it can traverse a medium with a smaller MTU."},{"module":"Check Your Understanding - IP Characteristics","question":"Which delivery method does not guarantee that the packet will be delivered fully without errors?","options":["connectionless","best effort","media independent"],"answer":[1],"explanation":"Best-effort delivery does not guarantee successful delivery."},{"module":"Check Your Understanding - IPv4 Packet","question":"What are the two most commonly referenced fields in an IPv4 packet header that indicate where the packet is coming from and where it is going? (Choose two.)","options":["destination IP address","protocol","Time to Live","source IP address","Differentiated Services (DS)"],"answer":[0,3],"explanation":"The source IP address and destination IP address indicate where the packet originated and where it is going."},{"module":"Check Your Understanding - IPv4 Packet","question":"Which statement is correct about IPv4 packet header fields?","options":["The source and destination IPv4 addresses remain the same while travelling from source to destination.","The Time to Live field is used to determine the priority of each packet.","The Total Length and Header Checksum fields are used to reorder a fragmented packet.","The Version field identifies the next level protocol."],"answer":[0],"explanation":"The source and destination IPv4 addresses normally remain the same from source to destination."},{"module":"Check Your Understanding - IPv4 Packet","question":"Which field is used to detect corruption in the IPv4 header?","options":["Header Checksum","Time to Live","Protocol","Differentiated Services (DS)"],"answer":[0],"explanation":"The Header Checksum field detects corruption in the IPv4 header."},{"module":"Check Your Understanding - IPv4 Packet","question":"Which field includes common values such as ICMP (1), TCP (6), and UDP (17)?","options":["Header Checksum","Time to Live","Protocol","Differentiated Services (DS)"],"answer":[2],"explanation":"The Protocol field identifies the upper-layer protocol carried in the IPv4 packet."},{"module":"Check Your Understanding - IPv6 Packet","question":"Which three options are major issues associated with IPv4? (Choose three.)","options":["IP address depletion","increased network complexity and Internet routing table expansion","always on connections","lack of end-to-end connectivity","global and political boundaries","too many IPv4 addresses available"],"answer":[0,1,3],"explanation":"IPv4 issues include address depletion, increased network complexity and routing table growth, and lack of end-to-end connectivity."},{"module":"Check Your Understanding - IPv6 Packet","question":"Which two options are improvements provided by IPv6 as compared to IPv4? (Choose two.)","options":["header supports additional fields for complex packets","increased the IP address space","standardizes the use of NAT","supports class-based networks","uses a simpler header to provide improved packet handling"],"answer":[1,4],"explanation":"IPv6 provides a much larger address space and a simpler header."},{"module":"Check Your Understanding - IPv6 Packet","question":"Which is true of the IPv6 header?","options":["it consists of 20 octets.","it consists of 40 octets.","it contains 8 header fields.","it contains 12 header fields."],"answer":[1],"explanation":"The IPv6 header is fixed at 40 octets."},{"module":"Check Your Understanding - IPv6 Packet","question":"Which is true of the IPv6 packet header?","options":["The Hop Limit field replaces the IPv4 Time to Live field.","The Source and Destination IPv6 addresses change while travelling from source to destination.","The Time to Live field replaces the DiffServ field.","The Version field identifies the next header."],"answer":[0],"explanation":"IPv6 uses the Hop Limit field instead of the IPv4 Time to Live field."},{"module":"Check Your Understanding - How a Host Routes","question":"Which statement about host forwarding decisions is true?","options":["A host cannot ping itself.","A remote destination host is on the same local network as the sending host.","Local hosts can reach each other without the need of a router.","Routing is enabled on switches to discover the best path to a destination."],"answer":[2],"explanation":"Hosts on the same local network can communicate without a router."},{"module":"Check Your Understanding - How a Host Routes","question":"Which default gateway statement is true?","options":["A default gateway is required to send packets to other hosts on the local network.","The default gateway address is the IP address of a switch on a remote network.","The default gateway address is the IP address of the router on the local network.","Traffic can only be forwarded outside the local network if there is no default gateway."],"answer":[2],"explanation":"The default gateway is the IP address of the router interface on the local network."},{"module":"Check Your Understanding - How a Host Routes","question":"Which two commands could be entered on a Windows host to view its IPv4 and IPv6 routing table? (Choose two.)","options":["netroute -l","netstat -r","print route","route print","print net"],"answer":[1,3],"explanation":"Windows hosts can display the routing table with netstat -r and route print."},{"module":"Check Your Understanding - Introduction to Routing","question":"What is the command used on a Cisco IOS router to view the routing table?","options":["netstart -r","route print","show ip route","show routing table"],"answer":[2],"explanation":"show ip route displays the routing table on a Cisco IOS router."},{"module":"Check Your Understanding - Introduction to Routing","question":"What does a code of \"O\" indicate next to a route in the routing table?","options":["a directly connected route","a route with an administrative distance of 0","a gateway of last resort","a route learned dynamically from OSPF"],"answer":[3],"explanation":"A route code of O indicates a route learned through OSPF."},{"module":"Check Your Understanding - Introduction to Routing","question":"This type of route is also known as a gateway of last resort.","options":["static route","remote route","default route","directly connected route"],"answer":[2],"explanation":"A default route is also called a gateway of last resort."},{"module":"Check Your Understanding - Introduction to Routing","question":"Which is a characteristic of static routes?","options":["They are manually configured.","They are advertised to directly connected neighbors.","They are appropriate when there are many redundant links.","They automatically adjust to a change in network topology."],"answer":[0],"explanation":"Static routes are manually configured."},{"module":"Check Your Understanding - Introduction to Routing","question":"True or False? A router can be configured with a combination of both static routes and a dynamic routing protocol.","options":["True","False"],"answer":[0],"explanation":"Routers can use both static routes and dynamic routing protocols."},{"module":"Check Your Understanding - Neighbor Discovery","question":"Which two ICMPv6 messages are used in SLAAC?","options":["Neighbor Advertisement","Neighbor Solicitation","Router Advertisement","Router Solicitation"],"answer":[2,3],"explanation":"SLAAC uses Router Solicitation and Router Advertisement messages."},{"module":"Check Your Understanding - Neighbor Discovery","question":"Which two ICMPv6 messages are used in to determine the MAC address of a known IPv6 address?","options":["Neighbor Advertisement","Neighbor Solicitation","Router Advertisement","Router Solicitation"],"answer":[0,1],"explanation":"IPv6 address resolution uses Neighbor Solicitation and Neighbor Advertisement."},{"module":"Check Your Understanding - Neighbor Discovery","question":"To what type of address are ICMPv6 neighbor solicitation messages sent?","options":["unicast","multicast","broadcast"],"answer":[1],"explanation":"ICMPv6 Neighbor Solicitation messages are sent to multicast addresses."},{"module":"Check Your Understanding - IPv4 Address Structure","question":"Host-A has the IPv4 address and subnet mask 10.5.4.100 255.255.255.0. What is the network address of Host-A?","options":["10.0.0.0","10.5.0.0","10.5.4.0","10.5.4.100"],"answer":[2],"explanation":"With a 255.255.255.0 mask, 10.5.4.100 belongs to network 10.5.4.0."},{"module":"Check Your Understanding - IPv4 Address Structure","question":"Host-A has the IPv4 address and subnet mask 172.16.4.100 255.255.0.0. What is the network address of Host-A?","options":["172.0.0.0","172.16.0.0","172.16.4.0","172.16.4.100"],"answer":[1],"explanation":"With a 255.255.0.0 mask, 172.16.4.100 belongs to network 172.16.0.0."},{"module":"Check Your Understanding - IPv4 Address Structure","question":"Host-A has the IPv4 address and subnet mask 10.5.4.100 255.255.255.0. Which of the following IPv4 addresses would be on the same network as Host-A? (Choose all that apply)","options":["10.5.4.1","10.5.0.1","10.5.4.99","10.0.0.98","10.5.100.4"],"answer":[0,2],"explanation":"The same /24 network is 10.5.4.0, so 10.5.4.1 and 10.5.4.99 match."},{"module":"Check Your Understanding - IPv4 Address Structure","question":"Host-A has the IPv4 address and subnet mask 172.16.4.100 255.255.0.0. Which of the following IPv4 addresses would be on the same network as Host-A? (Choose all that apply)","options":["172.16.4.99","172.16.0.1","172.17.4.99","172.17.4.1","172.18.4.1"],"answer":[0,1],"explanation":"The same /16 network is 172.16.0.0, so 172.16.4.99 and 172.16.0.1 match."},{"module":"Check Your Understanding - IPv4 Address Structure","question":"Host-A has the IPv4 address and subnet mask 192.168.1.50 255.255.255.0. Which of the following IPv4 addresses would be on the same network as Host-A? (Choose all that apply)","options":["192.168.0.1","192.168.0.100","192.168.1.1","192.168.1.100","192.168.2.1"],"answer":[2,3],"explanation":"The same /24 network is 192.168.1.0, so 192.168.1.1 and 192.168.1.100 match."},{"module":"Check Your Understanding - Types of IPv4 Addresses","question":"Which two statements are correct about private IPv4 addresses? (Choose two.)","options":["Private IPv4 addresses are assigned to devices within an organization's intranet (internal network).","Internet routers will typically forward any packet with a destination address that is a private IPv4 address.","172.99.1.1 is a private IPv4 address.","Any organization (home, school, office, company) can use the 10.0.0.0/8 address."],"answer":[0,3],"explanation":"Private IPv4 addresses are used internally, and 10.0.0.0/8 is available for private use by any organization."},{"module":"Check Your Understanding - Types of IPv4 Addresses","question":"Which two statements are correct about public IPv4 addresses? (Choose two.)","options":["Public IPv4 addresses are allowed to be assigned to devices within an organization's intranet (internal network).","To access a device over the internet, the destination IPv4 address must be a public address.","192.168.1.10 is a public IPv4 address.","Public IPv4 address exhaustion is a reason why there are private IPv4 addresses and why organizations are transitioning to IPv6."],"answer":[1,3],"explanation":"Internet-reachable devices need public IPv4 addresses, and public IPv4 exhaustion drove private addressing and IPv6 transition."},{"module":"Check Your Understanding - Types of IPv4 Addresses","question":"Which organization or group of organizations receives IP addresses from IANA and is responsible for allocating these addresses to ISPs and some organizations?","options":["IETF","IEEE","RIRs","Tier 1 ISPs"],"answer":[2],"explanation":"Regional Internet Registries receive addresses from IANA and allocate them to ISPs and organizations."},{"module":"Check Your Understanding - Network Segmentation","question":"Which devices will not forward an IPv4 broadcast packet by default?","options":["Ethernet switch","router","Windows PC","None of the above. All devices forward IPv4 broadcast packets by default."],"answer":[1],"explanation":"Routers do not forward IPv4 broadcast packets by default."},{"module":"Check Your Understanding - Network Segmentation","question":"Which two situations are the result of excessive broadcast traffic? (Choose two)","options":["slow network operations","slow device operations","when devices on all adjacent networks are affected","when the router has to forward an excessive number of packets"],"answer":[0,1],"explanation":"Excessive broadcast traffic can slow network operations and device operations."},{"module":"Check Your Understanding - IPv4 Issues","question":"What is the most important motivating factor for moving to IPv6?","options":["better performance with IPv6","IPv6 addresses that are easier to work with","better security with IPv6","depletion of IPv4 addresses"],"answer":[3],"explanation":"IPv4 address depletion is the main motivation for moving to IPv6."},{"module":"Check Your Understanding - IPv4 Issues","question":"True or False: 4 out of 5 RIRs no longer have enough IPv4 addresses to allocate to customers on a regular basis.","options":["True","False"],"answer":[0],"explanation":"Four of the five RIRs have exhausted their regular IPv4 address pools."},{"module":"Check Your Understanding - IPv4 Issues","question":"Which of the following techniques use native IPv6 connectivity?","options":["dual stack","tunneling","translation","all of the above"],"answer":[0],"explanation":"Dual stack uses native IPv6 connectivity."},{"module":"Check Your Understanding - IPv6 Address Types","question":"What is the recommended prefix length for most IPv6 subnets?","options":["/32","/48","/64","/128"],"answer":[2],"explanation":"Most IPv6 subnets use a /64 prefix length."},{"module":"Check Your Understanding - IPv6 Address Types","question":"Which part of a GUA is assigned by the ISP?","options":["Global Routing Prefix","Global Routing Prefix and Subnet ID","Prefix","RIR Prefix"],"answer":[0],"explanation":"The ISP assigns the global routing prefix of an IPv6 GUA."},{"module":"Check Your Understanding - IPv6 Address Types","question":"Which type of IPv6 unicast address is not routable between networks?","options":["unique local address","GUA","embedded IPv4 address","LLA"],"answer":[3],"explanation":"Link-local addresses are not routable between networks."},{"module":"Check Your Understanding - IPv6 Address Types","question":"True or False: The Subnet ID field in an GUA must borrow bits from the interface ID.","options":["True","False"],"answer":[1],"explanation":"IPv6 GUAs have a subnet ID field and do not need to borrow bits from the interface ID."},{"module":"Check Your Understanding - IPv6 Address Types","question":"What type of IPv6 address begins with fe80?","options":["GUA","LLA","multicast address","None. An IPv6 address must begin with 2001"],"answer":[1],"explanation":"IPv6 addresses beginning with fe80 are link-local addresses."},{"module":"Check Your Understanding - Dynamic Addressing for IPv6 GUAs","question":"True or False. RA messages are sent to all IPv6 routers by hosts requesting addressing information.","options":["True","False"],"answer":[1],"explanation":"Router Advertisement messages are sent to all IPv6 nodes, not only routers."},{"module":"Check Your Understanding - Dynamic Addressing for IPv6 GUAs","question":"Which dynamic addressing method for GUAs is the one where devices rely solely on the contents of the RA message for their addressing information?","options":["Method 1: SLAAC","Method 2: SLAAC and Stateless DHCPv6","Method 3: Stateful DHCPv6"],"answer":[0],"explanation":"SLAAC uses router advertisements for addressing information without DHCPv6."},{"module":"Check Your Understanding - Dynamic Addressing for IPv6 GUAs","question":"Which dynamic addressing method for GUAs is the one where devices rely solely on a DHCPv6 server for their addressing information?","options":["Method 1: SLAAC","Method 2: SLAAC and Stateless DHCPv6","Method 3: Stateful DHCPv6"],"answer":[2],"explanation":"Stateful DHCPv6 provides IPv6 addressing information from a DHCPv6 server."},{"module":"Check Your Understanding - Dynamic Addressing for IPv6 GUAs","question":"Which dynamic addressing method for GUAs is the one where devices get their IPv6 configuration in a RA message and request DNS information from a DHCPv6 server?","options":["Method 1: SLAAC","Method 2: SLAAC and Stateless DHCPv6","Method 3: Stateful DHCPv6"],"answer":[1],"explanation":"SLAAC with stateless DHCPv6 uses RA for addressing and DHCPv6 for DNS information."},{"module":"Check Your Understanding - Dynamic Addressing for IPv6 GUAs","question":"What are the two methods a device can use to generate its own IPv6 interface ID? (Select two)","options":["SLAAC","stateless DHCPv6","stateful DHCPv6","EUI-64","randomly generated"],"answer":[3,4],"explanation":"A device can generate an IPv6 interface ID using EUI-64 or a randomly generated value."},{"module":"Check Your Understanding - Subnet an IPv6 Network","question":"True or False? IPv6 was designed with subnetting in mind.","options":["True","False"],"answer":[0],"explanation":"IPv6 includes a subnet ID field that can be used for subnetting."},{"module":"Check Your Understanding - Subnet an IPv6 Network","question":"Which field in an IPv6 GUA is used for subnetting?","options":["Prefix","Network","Global Routing Prefix","Subnet ID","Interface ID"],"answer":[3],"explanation":"The Subnet ID field is used for subnetting an IPv6 GUA."},{"module":"Check Your Understanding - Subnet an IPv6 Network","question":"Given a /48 Global Routing Prefix and a /64 prefix, what is the subnet portion of the following address: 2001:db8:cafe:1111:2222:3333:4444:5555","options":["cafe","1111","2222","3333","4444"],"answer":[1],"explanation":"With a /48 global routing prefix and /64 prefix, the fourth hextet 1111 is the subnet portion."},{"module":"Check Your Understanding - Subnet an IPv6 Network","question":"Given a /32 Global Routing Prefix and a /64 prefix, how many bits would be allocated for the Subnet ID?","options":["8","16","32","48","64"],"answer":[2],"explanation":"The subnet ID is the 32 bits between the /32 global routing prefix and /64 prefix."},{"module":"Check Your Understanding - ICMP Messages","question":"Which two types of ICMP messages are common to both ICMPv4 and ICMPv6? (Choose two.)","options":["Destination or Service Unreachable","Hostname resolution","IP configuration","Source Unreachable","Time exceeded"],"answer":[0,4],"explanation":"Destination or Service Unreachable and Time Exceeded messages are common to ICMPv4 and ICMPv6."},{"module":"Check Your Understanding - ICMP Messages","question":"Which type of ICMPv6 message would a host send to acquire an IPv6 configuration when booting up?","options":["Neighbor Advertisement (NA) message","Neighbor Solicitation (NS) message","Router Advertisement (RA) message","Router Solicitation (RS) message"],"answer":[3],"explanation":"An IPv6 host sends a Router Solicitation message to request configuration information."},{"module":"Check Your Understanding - Transportation of Data","question":"Which layer is responsible for establishing a temporary communication session between the source and destination host applications?","options":["application layer","data link layer","network layer","physical layer","transport layer"],"answer":[4],"explanation":"The transport layer establishes temporary communication sessions between applications."},{"module":"Check Your Understanding - Transportation of Data","question":"Which three are transport layer responsibilities? (Choose three.)","options":["conversation multiplexing","identifying frames","identifying routing information","segmenting data and reassembling segments","tracking individual conversations"],"answer":[0,3,4],"explanation":"The transport layer multiplexes conversations, segments and reassembles data, and tracks individual conversations."},{"module":"Check Your Understanding - Transportation of Data","question":"Which transport layer protocol statement is true?","options":["TCP has fewer fields than UDP.","TCP is faster than UDP.","UDP is a best-effort delivery protocol.","UDP provides reliability."],"answer":[2],"explanation":"UDP is a best-effort delivery protocol."},{"module":"Check Your Understanding - Transportation of Data","question":"Which transport layer protocol would be used for VoIP applications?","options":["Session Information Protocol (SIP)","Transmission Control Protocol (TCP)","User Datagram Protocol (UDP)","VoIP Transfer Protocol"],"answer":[2],"explanation":"VoIP commonly uses UDP for time-sensitive traffic."},{"module":"Check Your Understanding - TCP Overview","question":"Which transport layer protocol ensures reliable same-order delivery?","options":["ICMP","IP","TCP","UDP"],"answer":[2],"explanation":"TCP provides reliable same-order delivery."},{"module":"Check Your Understanding - TCP Overview","question":"Which TCP header statement is true?","options":["It consists of 4 fields in an 8-byte header.","It consists of 8 fields in a 10-byte header.","It consists of 10 fields in a 20-byte header.","It consists of 20 fields in a 40-byte header."],"answer":[2],"explanation":"The TCP header has 10 fields in a 20-byte header."},{"module":"Check Your Understanding - TCP Overview","question":"Which two applications would use the TCP transport layer protocol? (Choose two.)","options":["FTP","HTTP","ICMP","TFTP","VoIP"],"answer":[0,1],"explanation":"FTP and HTTP use TCP."},{"module":"Check Your Understanding - UDP Overview","question":"Which of the following is a stateless best-effort delivery transport layer protocol?","options":["ICMP","IP","TCP","UDP"],"answer":[3],"explanation":"UDP is a stateless best-effort transport protocol."},{"module":"Check Your Understanding - UDP Overview","question":"Which UDP header statement is true?","options":["It consists of 4 fields in an 8-byte header.","It consists of 8 fields in a 10-byte header.","It consists of 10 fields in a 20-byte header.","It consists of 20 fields in a 40-byte header."],"answer":[0],"explanation":"The UDP header has 4 fields in an 8-byte header."},{"module":"Check Your Understanding - UDP Overview","question":"Which two applications would use the UDP transport layer protocol? (Choose two.)","options":["FTP","HTTP","ICMP","TFTP","VoIP"],"answer":[3,4],"explanation":"TFTP and VoIP use UDP."},{"module":"Check Your Understanding - UDP Overview","question":"Which two fields are the same in a TCP and UDP header? (Choose two.)","options":["Control bits","Destination port number","Sequence number","Source port number","Well-known port number"],"answer":[1,3],"explanation":"TCP and UDP headers both include source and destination port numbers."},{"module":"Check Your Understanding - Devices in a Small Network","question":"Which statement correctly relates to a small network?","options":["Small networks are complex.","Small networks require an IT department to maintain.","The majority of businesses are small."],"answer":[2],"explanation":"The majority of businesses are small."},{"module":"Check Your Understanding - Devices in a Small Network","question":"Which factor must be considered when selecting network devices?","options":["color","console connections","cost","elasticity"],"answer":[2],"explanation":"Cost is an important factor when selecting network devices."},{"module":"Check Your Understanding - Devices in a Small Network","question":"What is necessary to plan and use when implementing a network?","options":["device names","IP addressing scheme","MAC addressing scheme","printer location"],"answer":[1],"explanation":"A network implementation requires planning and using an IP addressing scheme."},{"module":"Check Your Understanding - Devices in a Small Network","question":"What is required to maintain a high degree of reliability and eliminate single points of failure?","options":["accessibility","expandability","integrity","redundancy"],"answer":[3],"explanation":"Redundancy helps maintain reliability and eliminate single points of failure."},{"module":"Check Your Understanding - Devices in a Small Network","question":"What is required to classify traffic according to priority?","options":["IP addressing scheme","quality of service (QoS)","routing","switching"],"answer":[1],"explanation":"QoS classifies traffic according to priority."},{"module":"Check Your Understanding - Small Network Applications and Protocols","question":"What are two forms of software programs or processes that provide access to the network? (Choose two.)","options":["antivirus software","application layer services","gaming software","network applications","productivity software","virtual machine software"],"answer":[1,3],"explanation":"Application layer services and network applications provide access to the network."},{"module":"Check Your Understanding - Small Network Applications and Protocols","question":"Which two network protocols are used to establish a remote access network connection to a device? (Choose two.)","options":["File Transfer Protocol (FTP)","Hypertext Transfer Protocol (HTTP).","Remote Connect (RC)","Secure Shell (SSH)","Simple Mail Transfer Protocol (SMTP)","Telnet"],"answer":[3,5],"explanation":"SSH and Telnet provide remote access network connections to devices."},{"module":"Check Your Understanding - Scale to Larger Networks","question":"Which elements are required to scale to a larger network? (Choose two.)","options":["budget","device configurations","increased bandwidth","network documentation","windows hosts"],"answer":[0,3],"explanation":"Budget and network documentation are required when scaling to larger networks."},{"module":"Check Your Understanding - Scale to Larger Networks","question":"Which software installed on key hosts can reveal the types of network traffic flowing through the network?","options":["Linux","MacOS","SSH","Windows","Wireshark"],"answer":[4],"explanation":"Wireshark can reveal the types of network traffic flowing through a network."},{"module":"Check Your Understanding - Scale to Larger Networks","question":"What Windows 10 tool is useful to determine which applications are using network services on a host?","options":["Control panel","Data Usage","File Manager","Windows Defender Firewall","Windows Explorer"],"answer":[1],"explanation":"The Windows 10 Data Usage tool can show which applications are using network services."}];

// ── State ─────────────────────────────────────────────────────────────────────
const WRONG_KEY = 'rc_quiz_wrong_ids_v2';
let WRONG_IDS = loadWrongIds();
let SESSION = null;

function loadWrongIds() {
  try {
    const raw = localStorage.getItem(WRONG_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch { return new Set(); }
}

function saveWrongIds() {
  try {
    localStorage.setItem(WRONG_KEY, JSON.stringify([...WRONG_IDS]));
  } catch {}
}

// ── Module categorization ─────────────────────────────────────────────────────
const seenMods = new Set();
const ORDERED_MODS = [];
for (const q of ALL_QUESTIONS) {
  const m = q.module || '';
  if (m && !seenMods.has(m)) { seenMods.add(m); ORDERED_MODS.push(m); }
}

const MODULE_QUIZZES = ORDERED_MODS.filter(m => !m.includes('Exam') && !m.includes('Check Your Understanding') && m !== 'Practice Final Exam' && m !== 'Course Final Exam');
const EXAM_MODS = ORDERED_MODS.filter(m => m.includes('Exam') || m === 'Practice Final Exam' || m === 'Course Final Exam');
const CYU_MODS = ORDERED_MODS.filter(m => m.includes('Check Your Understanding'));

function countFor(mod) { return ALL_QUESTIONS.filter(q => q.module === mod).length; }

// ── Build menu ─────────────────────────────────────────────────────────────────
function buildMenu() {
  // Stats
  const statsEl = document.getElementById('stat-row');
  const wrongCount = ALL_QUESTIONS.filter((_,i) => WRONG_IDS.has(i)).length;
  statsEl.innerHTML = `
    <div class="stat-chip"><strong>${ALL_QUESTIONS.length}</strong> total questions</div>
    <div class="stat-chip"><strong>${ORDERED_MODS.length}</strong> topics</div>
    <div class="stat-chip"><strong>${wrongCount}</strong> marked wrong</div>
  `;

  // Wrong button
  const wrongBtn = document.getElementById('wrong-btn');
  wrongBtn.innerHTML = `Wrong Answers <span class="badge wrong">${wrongCount}</span>`;
  if (!wrongCount) wrongBtn.classList.add('disabled');
  else wrongBtn.classList.remove('disabled');

  // Module quizzes
  const modGrid = document.getElementById('module-btns');
  modGrid.innerHTML = MODULE_QUIZZES.map(m => `
    <button class="btn" data-mode="mod:${encodeURIComponent(m)}">${m} <span class="badge">${countFor(m)}</span></button>
  `).join('');

  // Exams
  const examGrid = document.getElementById('exam-btns');
  examGrid.innerHTML = EXAM_MODS.map(m => `
    <button class="btn" data-mode="mod:${encodeURIComponent(m)}">${m} <span class="badge">${countFor(m)}</span></button>
  `).join('');

  // CYU
  const cyuGrid = document.getElementById('cyu-btns');
  cyuGrid.innerHTML = CYU_MODS.map(m => `
    <button class="btn" data-mode="mod:${encodeURIComponent(m)}">${m.replace('Check Your Understanding - ', '')} <span class="badge">${countFor(m)}</span></button>
  `).join('');

  // Delegates
  document.getElementById('menu-screen').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]');
    if (b && !b.classList.contains('disabled')) startMode(b.dataset.mode);
  });
}

function showNotice(msg) {
  const el = document.getElementById('menu-notice');
  el.textContent = msg;
  el.classList.toggle('visible', !!msg);
}

// ── Pool ──────────────────────────────────────────────────────────────────────
function poolFor(mode) {
  if (mode === 'all') return ALL_QUESTIONS.map((q, i) => ({...q, __idx: i}));
  if (mode === '20') return shuffleArr(ALL_QUESTIONS.map((q, i) => ({...q, __idx: i}))).slice(0, 20);
  if (mode === '50') return shuffleArr(ALL_QUESTIONS.map((q, i) => ({...q, __idx: i}))).slice(0, 50);
  if (mode === 'wrong') return ALL_QUESTIONS.map((q, i) => ({...q, __idx: i})).filter(q => WRONG_IDS.has(q.__idx));
  if (mode.startsWith('mod:')) {
    const mod = decodeURIComponent(mode.slice(4));
    return ALL_QUESTIONS.map((q, i) => ({...q, __idx: i})).filter(q => q.module === mod);
  }
  return [];
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleOptions(q) {
  const indexed = q.options.map((opt, i) => [i, opt]);
  shuffleArr(indexed).forEach((item, ni) => { indexed[ni] = item; });
  const arr = shuffleArr(q.options.map((opt, i) => [i, opt]));
  const oldToNew = {};
  arr.forEach(([old], ni) => { oldToNew[old] = ni; });
  return {
    ...q,
    options: arr.map(([, opt]) => opt),
    answer: q.answer.map(i => oldToNew[i]).sort((a,b) => a-b),
  };
}

// ── Start ─────────────────────────────────────────────────────────────────────
function startMode(mode) {
  showNotice('');
  let pool = poolFor(mode);
  if (!pool.length) {
    showNotice(mode === 'wrong' ? 'No wrong answers saved yet. Complete a quiz first.' : 'No questions for this selection.');
    return;
  }
  pool = shuffleArr(pool).map(q => shuffleOptions(q));
  SESSION = { mode, questions: pool, index: 0, score: 0, history: [] };
  renderQuestion();
  show('question-screen');
}

// ── Render question ───────────────────────────────────────────────────────────
function renderQuestion() {
  const s = SESSION;
  const q = s.questions[s.index];
  const total = s.questions.length;
  const multi = q.answer.length > 1;

  document.getElementById('q-counter').textContent = `Q ${s.index + 1} / ${total}`;
  document.getElementById('q-score-live').textContent = `${s.score} pts`;
  document.getElementById('q-progress').style.width = ((s.index / total) * 100) + '%';
  document.getElementById('q-num').textContent = `Q${s.index + 1}`;
  document.getElementById('q-mod').textContent = q.module || '';
  document.getElementById('q-text').textContent = q.question;

  const hint = document.getElementById('q-multi-hint');
  if (multi) {
    hint.textContent = `Choose ${q.answer.length} correct answers`;
    hint.style.display = 'block';
  } else {
    hint.style.display = 'none';
  }

  const keys = 'ABCDEFGHIJKLMNOP';
  const container = document.getElementById('q-options');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.dataset.index = i;
    btn.innerHTML = `<span class="opt-key">${keys[i]}</span><span>${escHtml(opt)}</span>`;
    btn.addEventListener('click', () => toggleOpt(btn, i, multi));
    container.appendChild(btn);
  });

  // Reset feedback
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback';
  document.getElementById('btn-submit').className = 'btn-submit';
  document.getElementById('btn-next').className = 'btn-next';
  document.getElementById('btn-quit').className = 'btn-quit show';
}

function toggleOpt(el, idx, multi) {
  if (el.classList.contains('locked')) return;
  if (multi) {
    el.classList.toggle('selected');
  } else {
    document.querySelectorAll('#q-options .opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
  }
  updateSubmitBtn();
}

function updateSubmitBtn() {
  const any = !!document.querySelector('#q-options .opt.selected');
  const locked = !!document.querySelector('#q-options .opt.locked');
  document.getElementById('btn-submit').className = 'btn-submit' + (any && !locked ? ' show' : '');
}

// ── Check answer ───────────────────────────────────────────────────────────────
document.getElementById('btn-submit').addEventListener('click', checkAnswer);

function checkAnswer() {
  const s = SESSION;
  const q = s.questions[s.index];
  const selected = [...document.querySelectorAll('#q-options .opt.selected')]
    .map(el => +el.dataset.index).sort((a,b) => a-b);

  const correct = arrEq(selected, q.answer);

  document.querySelectorAll('#q-options .opt').forEach(el => {
    el.classList.add('locked');
    const i = +el.dataset.index;
    if (q.answer.includes(i) && selected.includes(i)) el.classList.add('correct');
    else if (!q.answer.includes(i) && selected.includes(i)) el.classList.add('wrong');
    else if (q.answer.includes(i) && !selected.includes(i)) el.classList.add('missed');
  });

  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback ' + (correct ? 'correct' : 'wrong');
  document.getElementById('q-fb-head').textContent = correct ? '✓ Correct!' : '✗ Incorrect';
  document.getElementById('q-explanation').textContent = q.explanation || '';

  if (correct) {
    s.score++;
    WRONG_IDS.delete(q.__idx);
  } else {
    if (typeof q.__idx === 'number') WRONG_IDS.add(q.__idx);
  }
  saveWrongIds();
  s.history.push({ q, selected, correct });

  document.getElementById('btn-submit').className = 'btn-submit';
  document.getElementById('btn-next').className = 'btn-next show';
}

document.getElementById('btn-next').addEventListener('click', () => {
  SESSION.index++;
  if (SESSION.index >= SESSION.questions.length) showResults();
  else renderQuestion();
});

document.getElementById('btn-quit').addEventListener('click', () => {
  if (SESSION && SESSION.history.length) showResults();
  else { show('menu-screen'); buildMenu(); }
});

// ── Results ───────────────────────────────────────────────────────────────────
function showResults() {
  const s = SESSION;
  const total = s.history.length;
  const correct = s.score;
  const wrong = total - correct;
  const pct = total ? Math.round(correct / total * 100) : 0;
  const cls = pct >= 80 ? 'great' : pct >= 55 ? 'ok' : 'bad';
  const labels = { great: 'Excellent result!', ok: 'Good progress.', bad: 'Keep studying.' };

  const ring = document.getElementById('pct-display');
  ring.textContent = pct + '%';
  ring.className = 'pct-display ' + cls;
  document.getElementById('pct-label').textContent = labels[cls] + '  ' + correct + ' / ' + total + ' correct';
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-total').textContent = total;

  const keys = 'ABCDEFGHIJKLMNOP';
  const list = document.getElementById('review-list');
  list.innerHTML = s.history.map(({ q, selected, correct: ok }) => {
    const selStr = selected.length ? selected.map(i => keys[i]).join(', ') : '—';
    const ansStr = q.answer.map(i => keys[i]).join(', ');
    return `<div class="review-item ${ok ? 'r-correct' : 'r-wrong'}">
      <div class="r-status">${ok ? '✓ correct' : '✗ wrong'}</div>
      <div class="r-q">${escHtml(q.question)}</div>
      <div class="r-ans">Your: <em>${selStr}</em> &nbsp;·&nbsp; Answer: <em>${ansStr}</em></div>
    </div>`;
  }).join('');

  buildMenu();
  show('results-screen');
}

document.getElementById('btn-retry').addEventListener('click', () => { startMode(SESSION.mode); });
document.getElementById('btn-menu').addEventListener('click', () => { show('menu-screen'); });

// ── Helpers ───────────────────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function arrEq(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
buildMenu();
</script>
