ing to access another part of the network","an unidentified individual who is trying to access the network equipment room","a device that is trying to inspect the traffic on a link"],"answer":[0],"explanation":"The command blocks login attempts after repeated failures, helping prevent password guessing."},{"module":"Practice Final Exam","question":"Which statement describes the characteristics of packet-filtering and stateful firewalls as they relate to the OSI model?","options":["Both stateful and packet-filtering firewalls can filter at the application layer.","A stateful firewall can filter application layer information, whereas a packet-filtering firewall cannot filter beyond the network layer.","A packet-filtering firewall typically can filter up to the transport layer, whereas a stateful firewall can filter up to the session layer.","A packet-filtering firewall uses session layer information to track the state of a connection, whereas a stateful firewall uses application layer information to track the state of a connection."],"answer":[2],"explanation":"Packet filtering commonly filters Layer 3 and sometimes Layer 4 content; stateful firewalls track connection state."},{"module":"Practice Final Exam","question":"What are two ways to protect a computer from malware? (Choose two.)","options":["Use antivirus software.","Empty the browser cache.","Keep software up to date.","Delete unused software.","Defragment the hard disk."],"answer":[0,2],"explanation":"Antivirus software and updated software help defend against malware."},{"module":"Practice Final Exam","question":"Only employees connected to IPv6 interfaces are having difficulty connecting to remote networks. The analyst wants to verify that IPv6 routing has been enabled. What is the best command to use?","options":["show running-config","show interfaces","copy running-config startup-config","show ip nat translations"],"answer":[0],"explanation":"show running-config can verify whether IPv6 routing is enabled in the configuration."},{"module":"Practice Final Exam","question":"Which two commands could be used to check if DNS name resolution is working properly on a Windows PC? (Choose two.)","options":["nslookup cisco.com","net cisco.com","ping cisco.com","nbtstat cisco.com","ipconfig /flushdns"],"answer":[0,2],"explanation":"nslookup tests DNS directly, and pinging a hostname also requires name resolution."},{"module":"Practice Final Exam","question":"A small advertising company has a critical web server and connects to the Internet through a leased line to an ISP. Which approach best provides cost-effective redundancy for the Internet connection?","options":["Add a second NIC to the web server.","Add another web server to prepare failover support.","Add a connection to the Internet via a DSL line to another ISP.","Add multiple connections between the switches and the edge router."],"answer":[2],"explanation":"A DSL connection to a different ISP provides redundant Internet access if the leased line fails."},{"module":"Course Final Exam","question":"A client packet is received by a server. The packet has a destination port number of 143. What service is the client requesting?","options":["Telnet","SSH","IMAP","FTP"],"answer":[2],"explanation":"IMAP uses TCP port 143."},{"module":"Course Final Exam","question":"What is the subnet ID associated with the IPv6 address 2001:DA48:FC5:A4:3D1B::1/64?","options":["2001:DA48::/64","2001::/64","2001:DA48:FC5:A4::/64","2001:DA48:FC5::A4:/64"],"answer":[2],"explanation":"With a /64 prefix, the subnet prefix is the first four hextets: 2001:DA48:FC5:A4::/64."},{"module":"Course Final Exam","question":"A client is using SLAAC to obtain an IPv6 address. After an address has been generated and applied to the interface, what must the client do before it can begin to use this IPv6 address?","options":["It must send an ICMPv6 Router Solicitation message to determine what default gateway it should use.","It must send a DHCPv6 INFORMATION-REQUEST message to request the address of the DNS server.","It must send a DHCPv6 REQUEST message to the DHCPv6 server to request permission to use this address.","It must send an ICMPv6 Neighbor Solicitation message to ensure that the address is not already in use on the network."],"answer":[3],"explanation":"After SLAAC address generation, Duplicate Address Detection uses ICMPv6 Neighbor Solicitation."},{"module":"Course Final Exam","question":"Which range of link-local addresses can be assigned to an IPv6-enabled interface?","options":["FE80::/10","FDEE::/7","FF00::/8","FEC0::/10"],"answer":[0],"explanation":"IPv6 link-local addresses use FE80::/10."},{"module":"Course Final Exam","question":"What mechanism is used by a router to prevent a received IPv4 packet from traveling endlessly on a network?","options":["It checks the value of the TTL field and if it is 100, it discards the packet and sends a Destination Unreachable message to the source host.","It increments the value of the TTL field by 1 and if the result is 100, it discards the packet and sends a Parameter Problem message to the source host.","It checks the value of the TTL field and if it is 0, it discards the packet and sends a Destination Unreachable message to the source host.","It decrements the value of the TTL field by 1 and if the result is 0, it discards the packet and sends a Time Exceeded message to the source host."],"answer":[3],"explanation":"Routers decrement TTL; if TTL reaches zero, the packet is dropped and an ICMP Time Exceeded message is sent."},{"module":"Course Final Exam","question":"A network administrator is designing a new wireless network. Which three areas of concern should be accounted for? (Choose three.)","options":["mobility options","security","interference","coverage area","packet collision","extensive cabling"],"answer":[1,2,3],"explanation":"Wireless design must account for security, interference, and coverage area."},{"module":"Course Final Exam","question":"What is wrong with the displayed RJ-45 cable termination?","options":["The untwisted length of each wire is too long.","The woven copper braid should not have been removed.","The wrong type of connector is being used.","The wires are too thick for the connector that is used."],"answer":[0],"explanation":"The source explanation identifies the untwisted wire length as too long."},{"module":"Course Final Exam","question":"New Ethernet cabling installed near fluorescent lights and electrical equipment is carrying corrupt and distorted data signals. Which two factors may interfere with the copper cabling? (Choose two.)","options":["EMI","signal attenuation","crosstalk","RFI","extended length of cabling"],"answer":[0,3],"explanation":"Electrical equipment and fluorescent lights can cause EMI and RFI that interfere with copper cabling."},{"module":"Course Final Exam","question":"Data is being sent from a source PC to a destination server. Which three statements correctly describe TCP or UDP in this situation? (Choose three.)","options":["TCP is the preferred protocol when a function requires lower network overhead.","The source port field identifies the running application or service that will handle data returning to the PC.","The TCP source port number identifies the sending host on the network.","UDP segments are encapsulated within IP packets for transport across the network.","The UDP destination port number identifies the application or service on the server which will handle the data.","The TCP process running on the PC randomly selects the destination port when establishing a session with the server."],"answer":[1,3,4],"explanation":"Layer 4 ports identify applications; UDP segments are encapsulated in IP packets; destination ports identify server services."},{"module":"Course Final Exam","question":"A group of Windows PCs in a new subnet can access local resources but not Internet resources. Which three Windows CLI commands and utilities can initially confirm IP/DNS configuration and verify connectivity to the local router? (Choose three.)","options":["netsh interface ipv6 show neighbor","arp -a","tracert","ping","ipconfig","nslookup","telnet"],"answer":[3,4,5],"explanation":"ipconfig checks IP settings, nslookup checks DNS, and ping verifies connectivity to the local router."},{"module":"Course Final Exam","question":"Host B on subnet Teachers sends a packet to host D on subnet Students. Which addresses are in the PDUs transmitted from host B to the router?","options":["Layer 2 destination = 00-00-0c-94-36-dd; Layer 2 source = 00-00-0c-94-36-bb; Layer 3 destination = 172.16.20.200; Layer 3 source = 172.16.10.200","Layer 2 destination = 00-00-0c-94-36-ab; Layer 2 source = 00-00-0c-94-36-bb; Layer 3 destination = 172.16.20.200; Layer 3 source = 172.16.100.200","Layer 2 destination = 00-00-0c-94-36-ab; Layer 2 source = 00-00-0c-94-36-bb; Layer 3 destination = 172.16.20.200; Layer 3 source = 172.16.10.200","Layer 2 destination = 00-00-0c-94-36-cd; Layer 2 source = 00-00-0c-94-36-bb; Layer 3 destination = 172.16.20.99; Layer 3 source = 172.16.10.200"],"answer":[2],"explanation":"For a remote subnet, Host B uses the router interface MAC as the Layer 2 destination while keeping Host D as the Layer 3 destination."},{"module":"Course Final Exam","question":"What are two problems that can be caused by a large number of ARP request and reply messages? (Choose two.)","options":["A large number of ARP request and reply messages may slow down the switching process, leading the switch to make many changes in its MAC table.","The ARP request is sent as a broadcast, and will flood the entire subnet.","Switches become overloaded because they concentrate all the traffic from the attached subnets.","All ARP request messages must be processed by all nodes on the local network.","The network may become overloaded because ARP reply messages have a very large payload due to the 48-bit MAC address and 32-bit IP address that they contain."],"answer":[1,3],"explanation":"ARP requests are broadcasts that flood the subnet and must be processed by all local nodes."},{"module":"Course Final Exam","question":"How does the service password-encryption command enhance password security on Cisco routers and switches?","options":["It requires encrypted passwords to be used when connecting remotely to a router or switch with Telnet.","It encrypts passwords that are stored in router or switch configuration files.","It requires that a user type encrypted passwords to gain console access to a router or switch.","It encrypts passwords as they are sent across the network."],"answer":[1],"explanation":"service password-encryption encrypts plaintext passwords in configuration files."},{"module":"Course Final Exam","question":"Which two statements are correct in a comparison of IPv4 and IPv6 packet headers? (Choose two.)","options":["The Destination Address field is new in IPv6.","The Source Address field name from IPv4 is kept in IPv6.","The Version field from IPv4 is not kept in IPv6.","The Time-to-Live field from IPv4 has been replaced by the Hop Limit field in IPv6.","The Header Checksum field name from IPv4 is kept in IPv6."],"answer":[1,3],"explanation":"IPv6 keeps the Source Address concept and replaces IPv4 TTL with Hop Limit."},{"module":"Course Final Exam","question":"Which two statements accurately describe an advantage or a disadvantage when deploying NAT for IPv4 in a network? (Choose two.)","options":["NAT will impact negatively on switch performance.","NAT causes routing tables to include more information.","NAT improves packet handling.","NAT adds authentication capability to IPv4.","NAT provides a solution to slow down the IPv4 address depletion.","NAT introduces problems for some applications that require end-to-end connectivity."],"answer":[4,5],"explanation":"NAT conserves public IPv4 addresses but can break applications that need end-to-end connectivity."},{"module":"Course Final Exam","question":"What service is provided by HTTP?","options":["An application that allows real-time chatting among remote users.","Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.","Allows for data transfers between a client and a file server.","A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web."],"answer":[3],"explanation":"HTTP defines rules for exchanging web content such as text, images, audio, video, and other multimedia."},{"module":"Course Final Exam","question":"A client packet is received by a server. The packet has a destination port number of 67. What service is the client requesting?","options":["Telnet","FTP","SSH","DHCP"],"answer":[3],"explanation":"DHCP servers use UDP port 67."},{"module":"Course Final Exam","question":"What are the two most effective ways to defend against malware? (Choose two.)","options":["Implement strong passwords.","Update the operating system and other application software.","Install and update antivirus software.","Implement RAID.","Implement a VPN.","Implement network firewalls."],"answer":[1,2],"explanation":"Keeping software patched and antivirus updated are core malware defenses."},{"module":"Course Final Exam","question":"An administrator defined a local user account with a secret password on router R1 for SSH. Which three additional steps are required to configure R1 to accept only encrypted SSH connections? (Choose three.)","options":["Configure the IP domain name on the router.","Enable inbound vty Telnet sessions.","Configure DNS on the router.","Generate the SSH keys.","Generate two-way pre-shared keys.","Enable inbound vty SSH sessions."],"answer":[0,3,5],"explanation":"SSH requires a domain name, RSA keys, and VTY lines configured for SSH."},{"module":"Course Final Exam","question":"A host is trying to send a packet to a device on a remote LAN segment, but there are no mappings in its ARP cache. How will the device obtain a destination MAC address?","options":["It will send the frame and use its own MAC address as the destination.","It will send the frame with a broadcast MAC address.","It will send an ARP request for the MAC address of the destination device.","It will send a request to the DNS server for the destination MAC address.","It will send an ARP request for the MAC address of the default gateway."],"answer":[4],"explanation":"For a remote destination, the host ARPs for the MAC address of its default gateway."},{"module":"Course Final Exam","question":"When a switch configuration includes a user-defined error threshold on a per-port basis, to which switching method will the switch revert when the error threshold is reached?","options":["fast-forward","cut-through","store-and-forward","fragment-free"],"answer":[2],"explanation":"When error thresholds are reached, the switch uses store-and-forward so it can check full frames before forwarding."},{"module":"Course Final Exam","question":"What are proprietary protocols?","options":["protocols that can be freely used by any organization or vendor","protocols developed by private organizations to operate on any vendor hardware","a collection of protocols known as the TCP/IP protocol suite","protocols developed by organizations who have control over their definition and operation"],"answer":[3],"explanation":"Proprietary protocols are controlled by the organization or vendor that defines and operates them."},{"module":"Course Final Exam","question":"What is an advantage to using a protocol that is defined by an open standard?","options":["An open standard protocol is not controlled or regulated by standards organizations.","A company can monopolize the market.","It encourages competition and promotes choices.","The protocol can only be run on equipment from a specific vendor."],"answer":[2],"explanation":"Open standards encourage vendor competition and give users more choices."},{"module":"Course Final Exam","question":"Which type of server relies on record types such as A, NS, AAAA, and MX in order to provide services?","options":["email","file","web","DNS"],"answer":[3],"explanation":"DNS servers use A, NS, AAAA, MX, and other record types for name resolution."},{"module":"Course Final Exam","question":"A small site has networks requiring 22, 20, 2, and 2 addresses. If the same mask must be used for all networks from 192.168.10.0/24, which single subnet mask makes the most efficient use of addresses?","options":["255.255.255.240","255.255.255.0","255.255.255.192","255.255.255.224","255.255.255.248","255.255.255.252"],"answer":[3],"explanation":"The largest network needs 22 hosts, requiring 5 host bits. That corresponds to /27, or 255.255.255.224."},{"module":"Course Final Exam","question":"A /29 subnetted 192.168.10.0 network uses the fifth subnet, with subnet zero counted as the first subnet. The router gets the first usable host address and the workgroup server gets the last usable host address. Which server configuration allows Internet connectivity?","options":["IP address: 192.168.10.38 subnet mask: 255.255.255.248, default gateway: 192.168.10.33","IP address: 192.168.10.38 subnet mask: 255.255.255.240, default gateway: 192.168.10.33","IP address: 192.168.10.254 subnet mask: 255.255.255.0, default gateway: 192.168.10.1","IP address: 192.168.10.41 subnet mask: 255.255.255.248, default gateway: 192.168.10.46","IP address: 192.168.10.65 subnet mask: 255.255.255.240, default gateway: 192.168.10.76"],"answer":[0],"explanation":"The fifth /29 subnet is 192.168.10.32/29. The first usable address is .33 and the last usable address is .38."},{"module":"Course Final Exam","question":"A network address of 192.168.99.0 with subnet mask 255.255.255.192 is used across four networks. How many total host addresses are unused across all four subnets?","options":["158","200","224","88","72"],"answer":[1],"explanation":"Each /26 subnet has 62 usable hosts; the unused totals are 32 + 60 + 60 + 48 = 200."},{"module":"Course Final Exam","question":"What would be the interface ID of an IPv6 enabled interface with MAC address 1C-6F-65-C2-BD-F8 when generated using EUI-64?","options":["1E6F:65FF:FEC2:BDF8","106F:65FF:FEC2:BDF8","C16F:65FF:FEC2:BDF8","0C6F:65FF:FEC2:BDF8"],"answer":[0],"explanation":"EUI-64 inserts FFFE in the middle of the MAC and flips the seventh bit of the first byte, changing 1C to 1E."},{"module":"Course Final Exam","question":"Which information does the show startup-config command display?","options":["the IOS image copied into RAM","the bootstrap program in the ROM","the contents of the saved configuration file in the NVRAM","the contents of the current running configuration file in the RAM"],"answer":[2],"explanation":"show startup-config displays the saved startup configuration stored in NVRAM."},{"module":"Course Final Exam","question":"What are two primary responsibilities of the Ethernet MAC sublayer? (Choose two.)","options":["accessing the media","data encapsulation","logical addressing","error detection","frame delimiting"],"answer":[0,1],"explanation":"The MAC sublayer handles media access and Ethernet data encapsulation."},{"module":"Course Final Exam","question":"Which switching method drops frames that fail the FCS check?","options":["store-and-forward switching","ingress port buffering","cut-through switching","borderless switching"],"answer":[0],"explanation":"Store-and-forward switching receives the full frame, checks FCS, and drops frames with errors."},{"module":"Course Final Exam","question":"What is an advantage for small organizations of adopting IMAP instead of POP?","options":["IMAP sends and retrieves email, but POP only retrieves email.","POP only allows the client to store messages in a centralized way, while IMAP allows distributed storage.","Messages are kept in the mail servers until they are manually deleted from the email client.","When the user connects to a POP server, copies of the messages are kept in the mail server for a short time, but IMAP keeps them for a long time."],"answer":[2],"explanation":"IMAP keeps messages on the mail server until the user deletes them."},{"module":"Course Final Exam","question":"A wired laser printer is attached to a home computer and shared so other home computers can use it. What networking model is in use?","options":["point-to-point","client-based","peer-to-peer (P2P)","master-slave"],"answer":[2],"explanation":"Sharing a printer from one home computer to others without a dedicated server is peer-to-peer."},{"module":"Course Final Exam","question":"A network administrator is adding a new LAN that must support 200 connected devices. What is the smallest network mask that can be used?","options":["255.255.255.224","255.255.255.240","255.255.255.192","255.255.255.0"],"answer":[3],"explanation":"A /24 mask provides 254 usable host addresses, enough for 200 devices."},{"module":"Course Final Exam","question":"Which wireless technology has low-power and data rate requirements making it popular in home automation applications?","options":["ZigBee","5G","Wi-Fi","LoRaWAN"],"answer":[0],"explanation":"ZigBee is designed for low-power, low-data-rate IoT and home automation uses."},{"module":"Course Final Exam","question":"What are two characteristics shared by TCP and UDP? (Choose two.)","options":["ability to carry digitized voice","3-way handshake","default window size","connectionless communication","port numbering","use of checksum"],"answer":[4,5],"explanation":"Both TCP and UDP use port numbers and checksums."},{"module":"Course Final Exam","question":"A client packet is received by a server. The packet has a destination port number of 69. What service is the client requesting?","options":["DHCP","SMTP","TFTP","DNS"],"answer":[2],"explanation":"TFTP uses port 69."},{"module":"Course Final Exam","question":"Which two statements are correct about MAC and IP addresses during data transmission if NAT is not involved? (Choose two.)","options":["Destination MAC addresses will never change in a frame that goes across seven routers.","A packet that has crossed four routers has changed the destination IP address four times.","Every time a frame is encapsulated with a new destination MAC address, a new destination IP address is needed.","Destination and source MAC addresses have local significance and change every time a frame goes from one LAN to another.","Destination IP addresses in a packet header remain constant along the entire path to a target host."],"answer":[3,4],"explanation":"MAC addresses change at each local segment, while the destination IP address stays constant without NAT."},{"module":"Course Final Exam","question":"What three facts can be determined from the show ip interface brief output on a switch? (Choose three.)","options":["Two devices are attached to the switch.","The default SVI has been configured.","The switch can be remotely managed.","Two physical interfaces have been configured.","Passwords have been configured on the switch.","One device is attached to a physical interface."],"answer":[1,2,5],"explanation":"The described output shows VLAN1 configured with an IP address for remote management and one physical interface up."},{"module":"Course Final Exam","question":"A user is executing a tracert to a remote device. At what point would a router in the path stop forwarding the packet?","options":["when the values of both the Echo Request and Echo Reply messages reach zero","when the value in the TTL field reaches zero","when the router receives an ICMP Time Exceeded message","when the host responds with an ICMP Echo Reply message","when the RTT value reaches zero"],"answer":[1],"explanation":"A router stops forwarding a packet when the TTL value reaches zero."},{"module":"Course Final Exam","question":"What are two functions that are provided by the network layer? (Choose two.)","options":["carrying data between processes that are running on source and destination hosts","directing data packets to destination hosts on other networks","providing dedicated end-to-end connections","placing data on the network medium","providing end devices with a unique network identifier"],"answer":[1,4],"explanation":"The network layer routes packets to remote networks and provides logical addressing."},{"module":"Course Final Exam","question":"A network administrator is adding a new LAN that must support 61 connected devices. What is the smallest network mask that can be used?","options":["255.255.255.224","255.255.255.240","255.255.255.192","255.255.255.128"],"answer":[2],"explanation":"A /26 mask, 255.255.255.192, provides 62 usable host addresses."},{"module":"Course Final Exam","question":"What characteristic describes spyware?","options":["a network device that filters access and traffic coming into a network","software that is installed on a user device and collects information about the user","an attack that slows or crashes a device or network service","the use of stolen credentials to access private data"],"answer":[1],"explanation":"Spyware is software that collects information about a user from the user's device."},{"module":"Course Final Exam","question":"What are three commonly followed standards for constructing and installing cabling? (Choose three.)","options":["pinouts","tensile strength of plastic insulator","cable lengths","connector types","cost per meter (foot)","connector color"],"answer":[0,2,3],"explanation":"Cabling standards include pinouts, cable lengths, and connector types."},{"module":"Course Final Exam","question":"What attribute of a NIC would place it at the data link layer of the OSI model?","options":["attached Ethernet cable","TCP/IP protocol stack","IP address","RJ-45 port","MAC address"],"answer":[4],"explanation":"The MAC address is the Layer 2 address associated with a NIC."},{"module":"Course Final Exam","question":"A network administrator needs to keep the user ID, password, and session contents private when establishing remote CLI connectivity with a switch. Which access method should be chosen?","options":["AUX","Telnet","SSH","Console"],"answer":[2],"explanation":"SSH encrypts remote CLI sessions, including credentials and session content."},{"module":"Course Final Exam","question":"A user sends an HTTP request to a web server on a remote network. During encapsulation, what is added to the frame address field to indicate the destination?","options":["the network domain of the destination host","the MAC address of the default gateway","the IP address of the default gateway","the MAC address of the destination host"],"answer":[1],"explanation":"For a remote destination, the frame is addressed to the MAC address of the default gateway."},{"module":"Course Final Exam","question":"Which two commands can be used on a Windows host to display the routing table? (Choose two.)","options":["route print","show ip route","netstat -r","netstat -s","tracert"],"answer":[0,2],"explanation":"On Windows, route print and netstat -r display the routing table."},{"module":"Course Final Exam","question":"A technician with a PC is using multiple applications while connected to the Internet. How does the PC keep track of the data flow so each application receives the correct packet flows?","options":["The data flow is being tracked based on the source port number that is used by each application.","The data flow is being tracked based on the destination IP address that is used by the PC of the technician.","The data flow is being tracked based on the source IP address that is used by the PC of the technician.","The data flow is being tracked based on the destination MAC address of the technician PC."],"answer":[0],"explanation":"Unique source port numbers help track simultaneous application sessions."},{"module":"Course Final Exam","question":"A client packet is received by a server. The packet has a destination port number of 80. What service is the client requesting?","options":["DNS","HTTP","DHCP","SMTP"],"answer":[1],"explanation":"HTTP uses port 80."},{"module":"Course Final Exam","question":"A user is attempting to access http://www.cisco.com/ without success. Which two configuration values must be set on the host to allow this access? (Choose two.)","options":["source port number","HTTP server","source MAC address","DNS server","default gateway"],"answer":[3,4],"explanation":"The host needs a DNS server to resolve the name and a default gateway to reach remote networks."},{"module":"Course Final Exam","question":"What method is used to manage contention-based access on a wireless network?","options":["CSMA/CD","priority ordering","CSMA/CA","token passing"],"answer":[2],"explanation":"Wireless networks use CSMA/CA to avoid collisions."},{"module":"Course Final Exam","question":"What are two ICMPv6 messages that are not present in ICMP for IPv4? (Choose two.)","options":["Router Advertisement","Destination Unreachable","Neighbor Solicitation","Route Redirection","Host Confirmation","Time Exceeded"],"answer":[0,2],"explanation":"Router Advertisement and Neighbor Solicitation are ICMPv6 Neighbor Discovery messages."},{"module":"Course Final Exam","question":"An organization is assigned an IPv6 address block of 2001:db8:0:ca00::/56. How many subnets can be created without using bits in the interface ID space?","options":["4096","256","512","1024"],"answer":[1],"explanation":"A /56 prefix leaves 8 subnet bits before the /64 interface ID boundary, allowing 2^8, or 256, subnets."},{"module":"Course Final Exam","question":"What subnet mask is needed if an IPv4 network has 40 devices that need IP addresses and address space is not to be wasted?","options":["255.255.255.224","255.255.255.128","255.255.255.240","255.255.255.192","255.255.255.0"],"answer":[3],"explanation":"A /26 mask provides 62 usable host addresses, which is the smallest listed mask that supports 40 devices."},{"module":"Course Final Exam","question":"A host is trying to send a packet to a device on a remote LAN segment, but there are currently no mappings in the ARP cache. How will the device obtain a destination MAC address?","options":["It will send an ARP request for the MAC address of the destination device.","It will send the frame with a broadcast MAC address.","It will send the frame and use the device MAC address as the destination.","It will send an ARP request for the MAC address of the default gateway.","It will send an ARP request to the DNS server for the destination MAC address."],"answer":[3],"explanation":"For a remote destination, the host resolves the MAC address of the default gateway and sends the frame to that gateway."},{"module":"Course Final Exam","question":"What characteristic describes a virus?","options":["the use of stolen credentials to access private data","a network device that filters access and traffic coming into a network","malicious software or code running on an end device","an attack that slows or crashes a device or network service"],"answer":[2],"explanation":"A virus is malicious software or code that runs on an end device."},{"module":"Course Final Exam","question":"A disgruntled employee is using some free wireless networking tools to determine information about the enterprise wireless networks. This person is planning on using this information to hack the wireless network. What type of attack is this?","options":["access","DoS","Trojan horse","reconnaissance"],"answer":[3],"explanation":"Reconnaissance is information gathering before an attempted attack."},{"module":"Course Final Exam","question":"What service is provided by POP3?","options":["Uses encryption to provide secure remote access to network devices and servers.","Retrieves email from the server by downloading the email to the local mail application of the client.","Allows remote access to network devices and servers.","An application that allows real-time chatting among remote users."],"answer":[1],"explanation":"POP3 retrieves email by downloading messages from a mail server to the client."},{"module":"Course Final Exam","question":"What command can be used on a Windows PC to see the IP configuration of that computer?","options":["ipconfig","show interfaces","ping","show ip interface brief"],"answer":[0],"explanation":"The Windows ipconfig command displays IP configuration information."},{"module":"Course Final Exam","question":"A client packet is received by a server. The packet has a destination port number of 110. What service is the client requesting?","options":["DNS","DHCP","POP3","SMTP"],"answer":[2],"explanation":"POP3 uses TCP port 110."},{"module":"Course Final Exam","question":"Which layer of the TCP/IP model provides a route to forward messages through an internetwork?","options":["transport","application","network access","internet"],"answer":[3],"explanation":"The TCP/IP internet layer provides logical addressing and routing through internetworks."},{"module":"Course Final Exam","question":"What characteristic describes identity theft?","options":["a tunneling protocol that provides remote users with secure access into the network of an organization","the use of stolen credentials to access private data","software that identifies fast-spreading threats","software on a router that filters traffic based on IP addresses or applications"],"answer":[1],"explanation":"Identity theft involves using stolen credentials or personal information to access private data."},{"module":"Course Final Exam","question":"What two security solutions are most likely to be used only in a corporate environment? (Choose two.)","options":["intrusion prevention systems","antivirus software","antispyware","strong passwords","virtual private networks"],"answer":[0,4],"explanation":"Intrusion prevention systems and VPNs are commonly deployed as corporate security solutions."},{"module":"Course Final Exam","question":"What service is provided by DNS?","options":["Allows for data transfers between a client and a file server.","Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.","A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web.","Resolves domain names, such as cisco.com, into IP addresses."],"answer":[3],"explanation":"DNS resolves domain names to IP addresses."},{"module":"Course Final Exam","question":"What characteristic describes a VPN?","options":["software on a router that filters traffic based on IP addresses or applications","a tunneling protocol that provides remote users with secure access into the network of an organization","a network device that filters access and traffic coming into a network","software that identifies fast-spreading threats"],"answer":[1],"explanation":"A VPN uses tunneling and encryption to provide secure remote access."},{"module":"Course Final Exam","question":"A network administrator is adding a new LAN to a branch office. The new LAN must support 4 connected devices. What is the smallest network mask that the network administrator can use for the new network?","options":["255.255.255.192","255.255.255.248","255.255.255.240","255.255.255.224"],"answer":[1],"explanation":"A /29 mask provides 6 usable addresses, enough for 4 connected devices."},{"module":"Course Final Exam","question":"During the process of forwarding traffic, what will the router do immediately after matching the destination IP address to a network on a directly connected routing table entry?","options":["switch the packet to the directly connected interface","discard the traffic after consulting the route table","look up the next-hop address for the packet","analyze the destination IP address"],"answer":[0],"explanation":"For a directly connected destination network, the router forwards the packet out the directly connected interface."},{"module":"Course Final Exam","question":"What service is provided by BOOTP?","options":["Allows for data transfers between a client and a file server.","Legacy application that enables a diskless workstation to discover its own IP address and find a BOOTP server on the network.","Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.","A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web."],"answer":[1],"explanation":"BOOTP is a legacy protocol used by diskless workstations to obtain IP information and locate a BOOTP server."},{"module":"Course Final Exam","question":"A client packet is received by a server. The packet has a destination port number of 21. What service is the client requesting?","options":["DHCP","FTP","TFTP","DNS"],"answer":[1],"explanation":"FTP control traffic uses TCP port 21."},{"module":"Course Final Exam","question":"A technician can ping the IP address of the web server of a remote company but cannot successfully ping the URL address of the same web server. Which software utility can the technician use to diagnose the problem?","options":["tracert","netstat","nslookup","ipconfig"],"answer":[2],"explanation":"Nslookup can be used to diagnose DNS name resolution problems."},{"module":"Course Final Exam","question":"What two ICMPv6 message types must be permitted through IPv6 access control lists to allow resolution of Layer 3 addresses to Layer 2 MAC addresses? (Choose two.)","options":["echo requests","router solicitations","router advertisements","neighbor advertisements","echo replies","neighbor solicitations"],"answer":[3,5],"explanation":"IPv6 address resolution uses Neighbor Solicitation and Neighbor Advertisement messages."},{"module":"Course Final Exam","question":"Which two functions are performed at the LLC sublayer of the OSI Data Link Layer to facilitate Ethernet communication? (Choose two.) (Option A)","options":["integrates Layer 2 flows between 10 Gigabit Ethernet over fiber and 1 Gigabit Ethernet over copper","places information in the Ethernet frame that identifies which network layer protocol is being encapsulated by the frame","implements trailer with frame check sequence for error detection","applies source and destination MAC addresses to Ethernet frame","enables IPv4 and IPv6 to utilize the same physical medium"],"answer":[1,4],"explanation":"The LLC sublayer identifies the encapsulated network layer protocol and allows multiple Layer 3 protocols to use the same medium."},{"module":"Course Final Exam","question":"Which two functions are performed at the LLC sublayer of the OSI Data Link Layer to facilitate Ethernet communication? (Choose two.) (Option B)","options":["applies source and destination MAC addresses to Ethernet frame","places information in the Ethernet frame that identifies which network layer protocol is being encapsulated by the frame","integrates Layer 2 flows between 10 Gigabit Ethernet over fiber and 1 Gigabit Ethernet over copper","implements CSMA/CD over legacy shared half-duplex media","adds Ethernet control information to network protocol data"],"answer":[1,4],"explanation":"The LLC sublayer adds control information and identifies the Layer 3 protocol carried in the Ethernet frame."},{"module":"Course Final Exam","question":"Two pings were issued from a host on a local network. The first ping was issued to the IP address of the default gateway of the host and it failed. The second ping was issued to the IP address of a host outside the local network and it was successful. What is a possible cause for the failed ping?","options":["The default gateway is not operational.","The default gateway device is configured with the wrong IP address.","The TCP/IP stack on the default gateway is not working properly.","Security rules are applied to the default gateway device, preventing it from processing ping requests."],"answer":[3],"explanation":"If outside connectivity works, the gateway may simply be configured to block ICMP echo requests."},{"module":"Course Final Exam","question":"What is a benefit of using cloud computing in networking?","options":["Technology is integrated into every-day appliances allowing them to interconnect with other devices, making them more 'smart' or automated.","Network capabilities are extended without requiring investment in new infrastructure, personnel, or software.","Home networking uses existing electrical wiring to connect devices to the network wherever there is an electrical outlet, saving the cost of installing data cables.","End users have the freedom to use personal tools to access information and communicate across a business network."],"answer":[1],"explanation":"Cloud computing can extend network and IT capabilities without new local infrastructure, personnel, or software investment."},{"module":"Course Final Exam","question":"What service is provided by SMTP?","options":["Allows remote access to network devices and servers.","Uses encryption to provide secure remote access to network devices and servers.","Allows clients to send email to a mail server and the servers to send email to other servers.","An application that allows real-time chatting among remote users."],"answer":[2],"explanation":"SMTP is used to send email from clients to mail servers and between mail servers."},{"module":"Course Final Exam","question":"A client packet is received by a server. The packet has a destination port number of 22. What service is the client requesting?","options":["SSH","DNS","DHCP","TFTP"],"answer":[0],"explanation":"SSH uses TCP port 22."},{"module":"Course Final Exam","question":"A network administrator is adding a new LAN to a branch office. The new LAN must support 10 connected devices. What is the smallest network mask that the network administrator can use for the new network?","options":["255.255.255.240","255.255.255.224","255.255.255.192","255.255.255.248"],"answer":[0],"explanation":"A /28 mask provides 14 usable addresses, enough for 10 connected devices."},{"module":"Course Final Exam","question":"Which two statements describe how to assess traffic flow patterns and network traffic types using a protocol analyzer? (Choose two.)","options":["Capture traffic on the weekends when most employees are off work.","Only capture traffic in the areas of the network that receive most of the traffic such as the data center.","Capture traffic during peak utilization times to get a good representation of the different traffic types.","Perform the capture on different network segments.","Only capture WAN traffic because traffic to the web is responsible for the largest amount of traffic on a network."],"answer":[2,3],"explanation":"Traffic analysis should sample peak utilization times and different network segments."},{"module":"Course Final Exam","question":"What characteristic describes a DoS attack?","options":["an attack that slows or crashes a device or network service","the use of stolen credentials to access private data","a network device that filters access and traffic coming into a network","software that is installed on a user device and collects information about the user"],"answer":[0],"explanation":"A denial-of-service attack attempts to slow, disrupt, or crash a device or network service."},{"module":"Course Final Exam","question":"A network administrator is adding a new LAN to a branch office. The new LAN must support 200 connected devices. What is the smallest network mask that the network administrator can use for the new network?","options":["255.255.255.0","255.255.255.224","255.255.255.248","255.255.255.240"],"answer":[0],"explanation":"A /24 mask provides 254 usable host addresses, enough for 200 connected devices."},{"module":"Course Final Exam","question":"What service is provided by DHCP?","options":["Dynamically assigns IP addresses to end and intermediary devices.","Allows remote access to network devices and servers.","Uses encryption to provide secure remote access to network devices and servers.","An application that allows real-time chatting among remote users."],"answer":[0],"explanation":"DHCP dynamically assigns IP addressing information."},{"module":"Course Final Exam","question":"What service is provided by FTP?","options":["Allows for data transfers between a client and a file server.","A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web.","Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.","An application that allows real-time chatting among remote users."],"answer":[0],"explanation":"FTP transfers files between clients and file servers."},{"module":"Course Final Exam","question":"Three bank employees are using the corporate network. The first employee uses a web browser to view a company web page in order to read some announcements. The second employee accesses the corporate database to perform some financial transactions. The third employee participates in an important live audio conference with other corporate managers in branch offices. If QoS is implemented on this network, what will be the priorities from highest to lowest of the different data types?","options":["audio conference, financial transactions, web page","financial transactions, web page, audio conference","audio conference, web page, financial transactions","financial transactions, audio conference, web page"],"answer":[0],"explanation":"Real-time audio has the highest QoS priority, then critical business transactions, then ordinary web traffic."},{"module":"Course Final Exam","question":"What characteristic describes an IPS?","options":["software that identifies fast-spreading threats","software on a router that filters traffic based on IP addresses or applications","a network device that filters access and traffic coming into a network","a tunneling protocol that provides remote users with secure access into the network of an organization"],"answer":[0],"explanation":"An IPS identifies and can stop fast-spreading threats."},{"module":"Networking Today","question":"During a routine inspection, a technician discovered that software that was installed on a computer was secretly collecting data about websites that were visited by users of the computer. Which type of threat is affecting this computer?","options":["spyware","zero-day attack","identity theft","DoS attack"],"answer":[0],"explanation":"Spyware collects information from a device without the user's knowledge."},{"module":"Networking Today","question":"Which term refers to a network that provides secure access to the corporate offices by suppliers, customers and collaborators?","options":["extendednet","Internet","extranet","intranet"],"answer":[2],"explanation":"An extranet provides secure access to selected internal resources for suppliers, customers, and collaborators."},{"module":"Networking Today","question":"A large corporation has modified its network to allow users to access network resources from their personal laptops and smart phones. Which networking trend does this describe?","options":["video conferencing","cloud computing","online collaboration","bring your own device"],"answer":[3],"explanation":"BYOD allows users to use personal devices to access corporate network resources."},{"module":"Networking Today","question":"What is an ISP?","options":["It is an organization that enables individuals and businesses to connect to the Internet.","It is a networking device that combines the functionality of several different networking devices in one.","It is a protocol that establishes how computers within a local network communicate.","It is a standards body that develops cabling and wiring standards for networking."],"answer":[0],"explanation":"An Internet Service Provider connects individuals and businesses to the Internet."},{"module":"Networking Today","question":"In which scenario would the use of a WISP be recommended?","options":["an apartment in a building with cable access to the Internet","a farm in a rural area without wired broadband access","any home with multiple wireless devices","an Internet cafe in a city"],"answer":[1],"explanation":"A WISP is useful in rural areas where wired broadband such as DSL or cable is unavailable."},{"module":"Networking Today","question":"What characteristic of a network enables it to quickly grow to support new users and applications without impacting the performance of the service being delivered to existing users?","options":["scalability","reliability","quality of service","accessibility"],"answer":[0],"explanation":"Scalability is the ability of a network to grow while continuing to support existing users and services."},{"module":"Networking Today","question":"A college is building a new dormitory on its campus. Workers are digging in the ground to install a new water pipe for the dormitory. A worker accidentally damages a fiber optic cable that connects two of the existing dormitories to the campus data center. Although the cable has been cut, students in the dormitories only experience a very short interruption of network services. What characteristic of the network is shown here?","options":["fault tolerance","security","scalability","quality of service (QoS)","integrity"],"answer":[0],"explanation":"Fault tolerance allows a network to continue operating or recover quickly after a failure."},{"module":"Networking Today","question":"What are two characteristics of a scalable network? (Choose two.)","options":["suitable for modular devices that allow for expansion","offers limited number of applications","grows in size without impacting existing users","easily overloaded with increased traffic","is not as reliable as a small network"],"answer":[0,2],"explanation":"Scalable networks can grow without disrupting existing users and often use modular expandable devices."},{"module":"Networking Today","question":"Which device performs the function of determining the path that messages should take through internetworks?","options":["a DSL modem","a router","a web server","a firewall"],"answer":[1],"explanation":"Routers determine paths for messages between networks."},{"module":"Networking Today","question":"Which two Internet connection options do not require that physical cables be run to the building? (Choose two.)","options":["cellular","dialup","dedicated leased line","satellite","DSL"],"answer":[0,3],"explanation":"Cellular and satellite Internet connections can be provided without running physical cables to the building."},{"module":"Networking Today","question":"What type of network must a home user access in order to do online shopping?","options":["an intranet","an extranet","a local area network","the Internet"],"answer":[3],"explanation":"Online shopping sites are accessed through the Internet."},{"module":"Networking Today","question":"How does BYOD change the way in which businesses implement networks?","options":["BYOD provides flexibility in where and how users can access network resources.","BYOD users are responsible for their own network security, thus reducing the need for organizational security policies.","BYOD requires organizations to purchase laptops rather than desktops.","BYOD devices are more expensive than devices that are purchased by an organization."],"answer":[0],"explanation":"BYOD increases flexibility in where and how users access network resources."},{"module":"Networking Today","question":"An employee wants to access the network of the organization remotely, in the safest possible way. What network feature would allow an employee to gain secure remote access to a company network?","options":["ACL","VPN","BYOD","IPS"],"answer":[1],"explanation":"A VPN provides secure remote access to an organization's network."},{"module":"Networking Today","question":"What is the Internet?","options":["It provides connections through interconnected global networks.","It provides network access for mobile devices.","It is a private network for an organization with LAN and WAN connections.","It is a network based on Ethernet technology."],"answer":[0],"explanation":"The Internet is a global system of interconnected networks."},{"module":"Networking Today","question":"What are two functions of end devices on a network? (Choose two.)","options":["They direct data over alternate paths in the event of link failures.","They filter the flow of data to enhance security.","They originate the data that flows through the network.","They provide the channel over which the network message travel.","They are the interface between humans and the communication network."],"answer":[2,4],"explanation":"End devices originate data and provide the interface between users and the network."},{"module":"Basic Switch and End Device Configuration","question":"Which statement is true about the running configuration file in a Cisco IOS device?","options":["It is stored in NVRAM.","It should be deleted using the erase running-config command.","It is automatically saved when the router reboots.","It affects the operation of the device immediately when modified."],"answer":[3],"explanation":"The running configuration is active in RAM, so changes affect the device immediately."},{"module":"Basic Switch and End Device Configuration","question":"Which two statements are true regarding the user EXEC mode? (Choose two.)","options":["Global configuration mode can be accessed by entering the enable command.","The device prompt for this mode ends with the \">\" symbol.","Interfaces and routing protocols can be configured.","Only some aspects of the router configuration can be viewed.","All router commands are available."],"answer":[1,3],"explanation":"User EXEC mode has a > prompt and allows only limited viewing of device information."},{"module":"Basic Switch and End Device Configuration","question":"Which type of access is secured on a Cisco router or switch with the enable secret command?","options":["privileged EXEC","console line","virtual terminal","AUX port"],"answer":[0],"explanation":"The enable secret command protects privileged EXEC mode."},{"module":"Basic Switch and End Device Configuration","question":"What is the default SVI on a Cisco switch?","options":["VLAN100","VLAN99","VLAN999","VLAN1"],"answer":[3],"explanation":"The default switch virtual interface on a Cisco switch is VLAN 1."},{"module":"Basic Switch and End Device Configuration","question":"When a hostname is configured through the Cisco CLI, which three naming conventions are part of the guidelines? (Choose three.)","options":["the hostname should be fewer than 64 characters in length","the hostname should end with a special character","the hostname should begin with a letter","the hostname should be written in all lower case characters","the hostname should contain no spaces"],"answer":[0,2,4],"explanation":"Cisco hostname guidelines include fewer than 64 characters, beginning with a letter, and containing no spaces."},{"module":"Basic Switch and End Device Configuration","question":"What is the function of the shell in an OS?","options":["It provides dedicated firewall services.","It interacts with the device hardware.","It interfaces between the users and the kernel.","It provides the intrusion protection services for the device."],"answer":[2],"explanation":"The shell provides the interface between users and the kernel."},{"module":"Basic Switch and End Device Configuration","question":"A router with a valid operating system contains a configuration file stored in NVRAM. The configuration file has an enable secret password but no console password. When the router boots up, which mode will display?","options":["setup mode","user EXEC mode","global configuration mode","privileged EXEC mode"],"answer":[1],"explanation":"With a valid IOS and startup configuration, the device boots to user EXEC mode."},{"module":"Basic Switch and End Device Configuration","question":"An administrator has just changed the IP address of an interface on an IOS device. What else must be done in order to apply those changes to the device?","options":["Reload the device and type yes when prompted to save the configuration.","Copy the information in the startup configuration file to the running configuration.","Nothing must be done. Changes to the configuration on an IOS device take effect as soon as the command is typed correctly and the Enter key has been pressed.","Copy the running configuration to the startup configuration file."],"answer":[2],"explanation":"IOS configuration changes take effect immediately after a valid command is entered."},{"module":"Basic Switch and End Device Configuration","question":"Which memory location on a Cisco router or switch will lose all content when the device is restarted?","options":["flash","NVRAM","RAM","ROM"],"answer":[2],"explanation":"RAM is volatile and loses its contents when the device restarts."},{"module":"Basic Switch and End Device Configuration","question":"Why would a technician enter the command copy startup-config running-config?","options":["to remove all configurations from the switch","to make a changed configuration the new startup configuration","to save an active configuration to NVRAM","to copy an existing configuration into RAM"],"answer":[3],"explanation":"The command copies the saved startup configuration from NVRAM into the running configuration in RAM."},{"module":"Basic Switch and End Device Configuration","question":"Which functionality is provided by DHCP?","options":["automatic assignment of an IP address to each host","remote switch management","end-to-end connectivity test","translation of IP addresses to domain names"],"answer":[0],"explanation":"DHCP automatically assigns IP addressing information to hosts."},{"module":"Basic Switch and End Device Configuration","question":"Which two functions are provided to users by the context-sensitive help feature of the Cisco IOS CLI? (Choose two.)","options":["providing an error message when a wrong command is submitted","displaying a list of all available commands within the current mode","selecting the best command to accomplish a task","determining which option, keyword, or argument is available for the entered command","allowing the user to complete the remainder of an abbreviated command with the TAB key"],"answer":[1,3],"explanation":"Context-sensitive help lists available commands in the current mode and shows available options, keywords, or arguments."},{"module":"Basic Switch and End Device Configuration","question":"Which memory location on a Cisco router or switch stores the startup configuration file?","options":["flash","ROM","RAM","NVRAM"],"answer":[3],"explanation":"The startup configuration is stored in NVRAM."},{"module":"Basic Switch and End Device Configuration","question":"To what subnet does the IP address 10.1.100.50 belong if a subnet mask of 255.255.0.0 is used?","options":["10.1.100.32","10.1.0.0","10.0.0.0","10.1.100.0"],"answer":[1],"explanation":"A 255.255.0.0 mask uses the first two octets as the network portion, so the subnet is 10.1.0.0."},{"module":"Protocols and Models","question":"Which three acronyms/initialisms represent standards organizations? (Choose three.)","options":["IETF","IEEE","OSI","IANA","MAC","TCP/IP"],"answer":[0,1,3],"explanation":"IETF, IEEE, and IANA are standards organizations."},{"module":"Protocols and Models","question":"What type of communication will send a message to all devices on a local area network?","options":["multicast","allcast","broadcast","unicast"],"answer":[2],"explanation":"Broadcast communication sends a message to all devices on the local network."},{"module":"Protocols and Models","question":"In computer communication, what is the purpose of message encoding?","options":["to interpret information","to break large messages into smaller frames","to negotiate correct timing for successful communication","to convert information to the appropriate form for transmission"],"answer":[3],"explanation":"Encoding converts information into a form suitable for transmission over the medium."},{"module":"Protocols and Models","question":"Which message delivery option is used when all devices need to receive the same message simultaneously?","options":["duplex","broadcast","unicast","multicast"],"answer":[1],"explanation":"A broadcast is delivered to all devices in the broadcast domain."},{"module":"Protocols and Models","question":"What are two benefits of using a layered network model? (Choose two.)","options":["It ensures a device at one layer can function at the next higher layer.","It speeds up packet delivery.","It assists in protocol design.","It prevents designers from creating their own model.","It prevents technology in one layer from affecting other layers."],"answer":[2,4],"explanation":"Layered models assist protocol design and help prevent changes in one layer from affecting other layers."},{"module":"Protocols and Models","question":"What is the purpose of protocols in data communications?","options":["specifying the bandwidth of the channel or medium for each type of communication","providing the rules required for a specific type of communication to occur","specifying the device operating systems that will support the communication","dictating the content of the message sent during communication"],"answer":[1],"explanation":"Protocols define the rules required for communication to occur."},{"module":"Protocols and Models","question":"Which logical address is used for delivery of data to a remote network?","options":["destination MAC address","source MAC address","destination IP address","destination port number","source IP address"],"answer":[2],"explanation":"The destination IP address is the logical address used for delivery to a remote network."},{"module":"Protocols and Models","question":"What is the general term that is used to describe a piece of data at any layer of a networking model?","options":["segment","packet","frame","protocol data unit"],"answer":[3],"explanation":"Protocol data unit is the general term for data at any layer of a networking model."},{"module":"Protocols and Models","question":"Which two protocols function at the internet layer? (Choose two.)","options":["BOOTP","ICMP","PPP","POP","IP"],"answer":[1,4],"explanation":"ICMP and IP operate at the TCP/IP internet layer."},{"module":"Protocols and Models","question":"Which layer of the OSI model defines services to segment and reassemble data for individual communications between end devices?","options":["presentation","network","transport","session","application"],"answer":[2],"explanation":"The transport layer segments and reassembles data for individual communications between end devices."},{"module":"Protocols and Models","question":"Which type of communication will send a message to a group of host destinations simultaneously?","options":["broadcast","multicast","unicast","anycast"],"answer":[1],"explanation":"Multicast sends one message to a specific group of destination hosts."},{"module":"Protocols and Models","question":"What process is used to receive transmitted data and convert it into a readable message?","options":["encapsulation","decoding","access control","flow control"],"answer":[1],"explanation":"Decoding reverses encoding so received data can be interpreted."},{"module":"Protocols and Models","question":"What is done to an IP packet before it is transmitted over the physical medium?","options":["It is segmented into smaller individual pieces.","It is encapsulated into a TCP segment.","It is encapsulated in a Layer 2 frame.","It is tagged with information guaranteeing reliable delivery."],"answer":[2],"explanation":"Before transmission over the medium, an IP packet is encapsulated in a data link Layer 2 frame."},{"module":"Protocols and Models","question":"What process is used to place one message inside another message for transfer from the source to the destination?","options":["access control","flow control","encapsulation","decoding"],"answer":[2],"explanation":"Encapsulation places one message format inside another message format."},{"module":"Protocols and Models","question":"A web client is sending a request for a webpage to a web server. From the perspective of the client, what is the correct order of the protocol stack that is used to prepare the request for transmission?","options":["Ethernet, TCP, IP, HTTP","Ethernet, IP, TCP, HTTP","HTTP, IP, TCP, Ethernet","HTTP, TCP, IP, Ethernet"],"answer":[3],"explanation":"From the client, the request is prepared from application down to network access: HTTP, TCP, IP, Ethernet."},{"module":"Physical Layer","question":"A network administrator is troubleshooting connectivity issues on a server. Using a tester, the administrator notices that the signals generated by the server NIC are distorted and not usable. In which layer of the OSI model is the error categorized?","options":["Presentation layer","Network layer","Physical layer","Data link layer"],"answer":[2],"explanation":"Distorted electrical, optical, or wireless signals are categorized at the physical layer."},{"module":"Physical Layer","question":"What type of cable is used to connect a workstation serial port to a Cisco router console port?","options":["Crossover","Rollover","Straight-through","Coaxial"],"answer":[1],"explanation":"A rollover cable is used to connect a workstation serial port to a Cisco console port."},{"module":"Physical Layer","question":"Why are two strands of fiber used for a single fiber optic connection?","options":["The two strands allow the data to travel for longer distances without degrading.","They prevent crosstalk from causing interference on the connection.","They increase the speed at which the data can travel.","They allow for full-duplex connectivity."],"answer":[3],"explanation":"Two fiber strands allow simultaneous transmit and receive paths for full-duplex communication."},{"module":"Physical Layer","question":"Which procedure is used to reduce the effect of crosstalk in copper cables?","options":["Requiring proper grounding connections","Twisting opposing circuit wire pairs together","Wrapping the bundle of wires with metallic shielding","Designing a cable infrastructure to avoid crosstalk interference","Avoiding sharp bends during installation"],"answer":[1],"explanation":"Twisting opposing wire pairs together helps cancel interference and reduce crosstalk."},{"module":"Physical Layer","question":"What is one advantage of using fiber optic cabling rather than copper cabling?","options":["It is usually cheaper than copper cabling.","It is able to be installed around sharp bends.","It is easier to terminate and install than copper cabling.","It is able to carry signals much farther than copper cabling."],"answer":[3],"explanation":"Fiber optic cabling can carry signals over much longer distances than copper cabling."},{"module":"Physical Layer","question":"A network administrator is designing a new network infrastructure that includes both wired and wireless connectivity. Under which situation would a wireless connection be recommended?","options":["The end-user device only has an Ethernet NIC.","The end-user device requires a dedicated connection because of performance requirements.","The end-user device needs mobility when connecting to the network.","The end-user device area has a high concentration of RFI."],"answer":[2],"explanation":"Wireless connectivity is recommended when the device needs mobility."},{"module":"Physical Layer","question":"Which type of UTP cable is used to connect a PC to a switch port?","options":["Console","Rollover","Crossover","Straight-through"],"answer":[3],"explanation":"A straight-through UTP cable is used to connect unlike devices such as a PC and a switch."},{"module":"Physical Layer","question":"What is the definition of bandwidth?","options":["The speed of bits across the media over a given period of time","The speed at which bits travel on the network","The amount of data that can flow from one place to another in a given amount of time","The measure of usable data transferred over a given period of time"],"answer":[2],"explanation":"Bandwidth is the capacity for data to flow from one place to another in a given amount of time."},{"module":"Physical Layer","question":"Which statement correctly describes frame encoding?","options":["It uses the characteristic of one wave to modify another wave.","It transmits data signals along with a clock signal which occurs at evenly spaced time durations.","It generates the electrical, optical, or wireless signals that represent the binary numbers of the frame.","It converts bits into a predefined code in order to provide a predictable pattern to help distinguish data bits from control bits."],"answer":[3],"explanation":"Frame encoding converts bits into predefined codes that help distinguish data bits from control bits."},{"module":"Physical Layer","question":"What is a characteristic of UTP cabling?","options":["Cancellation","Cladding","Immunity to electrical hazards","Woven copper braid or metallic foil"],"answer":[0],"explanation":"UTP cabling uses cancellation from twisted wire pairs to reduce interference."},{"module":"Physical Layer","question":"A wireless LAN is being deployed inside the new one room office that is occupied by the park ranger. The office is located at the highest part of the national park. After network testing is complete, the technicians report that the wireless LAN signal is occasionally affected by some type of interference. What is a possible cause of the signal distortion?","options":["The microwave oven","The large number of trees that surround the office","The elevated location where the wireless LAN was installed","The number of wireless devices that are used in the wireless LAN"],"answer":[0],"explanation":"Microwave ovens can interfere with 2.4 GHz wireless LAN signals."},{"module":"Physical Layer","question":"What is the purpose of the OSI physical layer?","options":["Controlling access to media","Transmitting bits across the local media","Performing error detection on received frames","Exchanging frames between nodes over physical network media"],"answer":[1],"explanation":"The physical layer transmits bits across the local media."},{"module":"Physical Layer","question":"Which characteristic describes crosstalk?","options":["The distortion of the network signal from fluorescent lighting","The distortion of the transmitted messages from signals carried in adjacent wires","The weakening of the network signal over long cable lengths","The loss of wireless signal over excessive distance from the access point"],"answer":[1],"explanation":"Crosstalk is distortion caused by signals carried on adjacent wires."},{"module":"Physical Layer","question":"What is indicated by the term throughput?","options":["The guaranteed data transfer rate offered by an ISP","The capacity of a particular medium to carry data","The measure of the usable data transferred across the media","The measure of the bits transferred across the media over a given period of time","The time it takes for a message to get from sender to receiver"],"answer":[3],"explanation":"Throughput is the measure of bits transferred across media over a given period of time."},{"module":"Physical Layer","question":"Which standards organization oversees development of wireless LAN standards?","options":["IANA","IEEE","ISO","TIA"],"answer":[1],"explanation":"IEEE develops wireless LAN standards such as the 802.11 family."},{"module":"Number Systems","question":"What is the binary representation for the decimal number 173?","options":["10100111","10100101","10101101","10110101"],"answer":[2],"explanation":"Decimal 173 converts to binary 10101101."},{"module":"Number Systems","question":"Given the binary address of 11101100 00010001 00001100 00001010, which address does this represent in dotted decimal format?","options":["234.17.10.9","234.16.12.10","236.17.12.6","236.17.12.10"],"answer":[3],"explanation":"The binary octets convert to 236.17.12.10."},{"module":"Number Systems","question":"How many binary bits exist within an IPv6 address?","options":["32","48","64","128","256"],"answer":[3],"explanation":"IPv6 addresses are 128 bits long."},{"module":"Number Systems","question":"What is the binary equivalent of the decimal number 232?","options":["11101000","11000110","10011000","11110010"],"answer":[0],"explanation":"Decimal 232 converts to binary 11101000."},{"module":"Number Systems","question":"Which two statements are correct about IPv4 and IPv6 addresses? (Choose two.)","options":["IPv6 addresses are represented by hexadecimal numbers.","IPv4 addresses are represented by hexadecimal numbers.","IPv6 addresses are 32 bits in length.","IPv4 addresses are 32 bits in length.","IPv4 addresses are 128 bits in length.","IPv6 addresses are 64 bits in length."],"answer":[0,3],"explanation":"IPv6 addresses are represented in hexadecimal, and IPv4 addresses are 32 bits long."},{"module":"Number Systems","question":"Which IPv4 address format was created for ease of use by people and is expressed as 201.192.1.14?","options":["Binary","Dotted decimal","Hexadecimal","ASCII"],"answer":[1],"explanation":"IPv4 addresses are commonly written in dotted decimal format for readability."},{"module":"Number Systems","question":"What is the dotted decimal representation of the IPv4 address 11001011.00000000.01110001.11010011?","options":["192.0.2.199","198.51.100.201","203.0.113.211","209.165.201.223"],"answer":[2],"explanation":"The binary octets convert to 203.0.113.211."},{"module":"Number Systems","question":"What is the decimal equivalent of the binary number 10010101?","options":["149","157","168","192"],"answer":[0],"explanation":"Binary 10010101 equals decimal 149."},{"module":"Number Systems","question":"What is the decimal equivalent of the hex number 0x3F?","options":["63","77","87","93"],"answer":[0],"explanation":"Hex 0x3F equals 3*16 + 15 = 63."},{"module":"Number Systems","question":"What is the dotted decimal representation of the IPv4 address which is represented as the binary string 00001010.01100100.00010101.00000001?","options":["10.100.21.1","10.10.20.1","100.10.11.1","100.21.10.1"],"answer":[0],"explanation":"The binary octets convert to 10.100.21.1."},{"module":"Number Systems","question":"What is the decimal equivalent of 0xC9?","options":["185","200","201","199"],"answer":[2],"explanation":"Hex 0xC9 equals 12*16 + 9 = 201."},{"module":"Number Systems","question":"Which is a valid hexadecimal number?","options":["F","G","H","J"],"answer":[0],"explanation":"Hexadecimal digits include 0-9 and A-F."},{"module":"Number Systems","question":"What is the binary representation of 0xCA?","options":["10111010","11010101","11001010","11011010"],"answer":[2],"explanation":"Hex C is 1100 and hex A is 1010, so 0xCA is 11001010."},{"module":"Number Systems","question":"How many bits are in an IPv4 address?","options":["32","64","128","256"],"answer":[0],"explanation":"An IPv4 address contains 32 bits."},{"module":"Data Link Layer","question":"What identifier is used at the data link layer to uniquely identify an Ethernet device?","options":["IP address","MAC address","Sequence number","TCP port number","UDP port number"],"answer":[1],"explanation":"Ethernet devices are identified at the data link layer by MAC addresses."},{"module":"Data Link Layer","question":"What attribute of a NIC would place it at the data link layer of the OSI model?","options":["Attached Ethernet cable","IP address","MAC address","RJ-45 port","TCP/IP protocol stack"],"answer":[2],"explanation":"The MAC address is the data link layer attribute of a NIC."},{"module":"Data Link Layer","question":"Which two engineering organizations define open standards and protocols that apply to the data link layer? (Choose two.)","options":["Institute of Electrical and Electronics Engineers (IEEE)","Internet Assigned Numbers Authority (IANA)","International Telecommunication Union (ITU)","Electronic Industries Alliance (EIA)","Internet Society (ISOC)"],"answer":[0,2],"explanation":"IEEE and ITU define standards and protocols that apply to the data link layer."},{"module":"Data Link Layer","question":"What is true concerning physical and logical topologies?","options":["The logical topology is always the same as the physical topology.","Physical topologies are concerned with how a network transfers frames.","Physical topologies display the IP addressing scheme of each network.","Logical topologies refer to how a network transfers data between devices."],"answer":[3],"explanation":"Logical topology describes how data flows between devices, regardless of the physical layout."},{"module":"Data Link Layer","question":"A technician has been asked to develop a physical topology for a network that provides a high level of redundancy. Which physical topology requires that every node is attached to every other node on the network?","options":["Bus","Hierarchical","Mesh","Ring","Star"],"answer":[2],"explanation":"A full mesh topology connects every node to every other node, providing high redundancy."},{"module":"Data Link Layer","question":"Which statement describes the half-duplex mode of data transmission?","options":["Data that is transmitted over the network can only flow in one direction.","Data that is transmitted over the network flows in one direction at a time.","Data that is transmitted over the network flows in one direction to many different destinations simultaneously.","Data that is transmitted over the network flows in both directions at the same time."],"answer":[1],"explanation":"Half-duplex communication allows transmission in both directions, but only one direction at a time."},{"module":"Data Link Layer","question":"Which is a function of the Logical Link Control (LLC) sublayer?","options":["To define the media access processes that are performed by the hardware","To provide data link layer addressing","To identify which network layer protocol is being used","To accept segments and package them into data units that are called packets"],"answer":[2],"explanation":"The LLC sublayer identifies which network layer protocol is encapsulated."},{"module":"Data Link Layer","question":"Which data link layer media access control method does Ethernet use with legacy Ethernet hubs?","options":["CSMA/CD","Determinism","Turn taking","Token passing"],"answer":[0],"explanation":"Legacy half-duplex Ethernet hubs use CSMA/CD."},{"module":"Data Link Layer","question":"What are the two sublayers of the OSI model data link layer? (Choose two.)","options":["Internet","Physical","LLC","Transport","MAC","Network access"],"answer":[2,4],"explanation":"The OSI data link layer has the LLC and MAC sublayers."},{"module":"Data Link Layer","question":"Which layer of the OSI model is responsible for specifying the encapsulation method used for specific types of media?","options":["Application","Transport","Data link","Physical"],"answer":[2],"explanation":"The data link layer specifies the frame encapsulation method used for a media type."},{"module":"Data Link Layer","question":"What type of physical topology can be created by connecting all Ethernet cables to a central device?","options":["Bus","Ring","Star","Mesh"],"answer":[2],"explanation":"Connecting all devices to a central device creates a star topology."},{"module":"Data Link Layer","question":"What are two services performed by the data link layer of the OSI model? (Choose two.)","options":["It fragments data packets into the MTU size.","It determines the path to forward packets.","It accepts Layer 3 packets and encapsulates them into frames.","It provides media access control and performs error detection.","It monitors the Layer 2 communication by building a MAC address table."],"answer":[2,3],"explanation":"The data link layer encapsulates Layer 3 packets into frames and provides media access control and error detection."},{"module":"Data Link Layer","question":"Although CSMA/CD is still a feature of Ethernet, why is it no l
