<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Networking Quiz — CCNA Prep</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #0d1117;
  --ink2: #161b22;
  --surface: #0d1117;
  --panel: #161b22;
  --panel2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --accent-dim: #1f3358;
  --green: #3fb950;
  --green-dim: #0d2c17;
  --red: #f85149;
  --red-dim: #2a0c0a;
  --yellow: #d29922;
  --yellow-dim: #2b2006;
  --radius: 10px;
  --radius-sm: 6px;
}

html, body {
  height: 100%;
  background: var(--surface);
  color: var(--text);
  font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
  font-size: 14px;
  line-height: 1.6;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 24px 12px 48px;
}

/* Scan-line texture — the "one risk" */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,0.012) 2px,
    rgba(255,255,255,0.012) 4px
  );
  pointer-events: none;
  z-index: 999;
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 720px;
}

/* ── Header ── */
.site-header {
  text-align: center;
  padding: 0 0 28px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
}

.logo-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 4px;
}

.logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--ink);
  font-weight: 900;
  font-family: monospace;
  flex-shrink: 0;
}

.site-header h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
}

.site-header .sub {
  font-size: 0.82rem;
  color: var(--muted);
  margin-top: 2px;
  font-family: system-ui, sans-serif;
}

/* ── Screens ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── Menu ── */
.stat-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.stat-chip {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 0.78rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 5px;
}

.stat-chip strong { color: var(--text); }

.menu-notice {
  background: var(--red-dim);
  border: 1px solid var(--red);
  border-radius: var(--radius-sm);
  color: var(--red);
  padding: 8px 12px;
  font-size: 0.82rem;
  margin-bottom: 16px;
  display: none;
}

.menu-notice.visible { display: block; }

.section-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
}

.btn-grid.narrow { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }

.btn {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.82rem;
  padding: 9px 12px;
  text-align: left;
  transition: border-color .12s, background .12s, transform .08s;
  line-height: 1.4;
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.btn:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  transform: translateY(-1px);
}

.btn:active { transform: translateY(0); }

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--ink);
  font-weight: 700;
}

.btn.primary:hover { background: #79c0ff; border-color: #79c0ff; }

.btn.danger {
  border-color: var(--red);
  color: var(--red);
}

.btn.danger:hover { background: var(--red-dim); }

.btn.disabled, .btn:disabled {
  opacity: 0.38;
  cursor: not-allowed;
  pointer-events: none;
}

.badge {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 99px;
  padding: 1px 6px;
  flex-shrink: 0;
}

.badge.wrong { background: var(--red-dim); color: var(--red); }

/* ── Quiz Header ── */
.quiz-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.progress-outer {
  flex: 1;
  height: 4px;
  background: var(--panel2);
  border-radius: 99px;
  overflow: hidden;
  min-width: 80px;
}

.progress-inner {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width .3s ease;
}

.q-counter {
  font-size: 0.78rem;
  color: var(--muted);
  white-space: nowrap;
}

.q-score-live {
  font-size: 0.78rem;
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
}

/* ── Question Card ── */
.q-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.q-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.q-num {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

.q-module-tag {
  font-size: 0.72rem;
  color: var(--muted);
  font-family: system-ui, sans-serif;
}

.q-text {
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.65;
  color: var(--text);
  font-family: system-ui, sans-serif;
  margin-bottom: 6px;
}

.multi-hint {
  font-size: 0.75rem;
  color: var(--yellow);
  font-family: system-ui, sans-serif;
  margin-bottom: 14px;
  display: none;
}

/* ── Options ── */
.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 18px;
}

.opt {
  background: var(--panel2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  transition: border-color .1s, background .1s;
  font-family: system-ui, sans-serif;
  font-size: 0.88rem;
  line-height: 1.5;
  user-select: none;
  text-align: left;
  width: 100%;
  color: var(--text);
}

.opt:hover:not(.locked) { border-color: var(--accent); background: var(--accent-dim); }
.opt.selected:not(.correct):not(.wrong) { border-color: var(--accent); background: var(--accent-dim); }
.opt.correct { border-color: var(--green); background: var(--green-dim); color: #7ee787; }
.opt.wrong { border-color: var(--red); background: var(--red-dim); color: #ff7b72; }
.opt.missed { border-color: var(--yellow); background: var(--yellow-dim); color: #e3b341; }
.opt.locked { cursor: default; }

.opt-key {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 4px;
  background: var(--border);
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 700;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .1s, color .1s;
  margin-top: 1px;
}

.opt.selected:not(.correct):not(.wrong) .opt-key { background: var(--accent); color: var(--ink); }
.opt.correct .opt-key { background: var(--green); color: var(--ink); }
.opt.wrong .opt-key { background: var(--red); color: #fff; }
.opt.missed .opt-key { background: var(--yellow); color: var(--ink); }

/* ── Feedback ── */
.feedback {
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 0.84rem;
  font-family: system-ui, sans-serif;
  line-height: 1.55;
  display: none;
  border-left: 3px solid;
}

.feedback.correct {
  display: block;
  background: var(--green-dim);
  border-color: var(--green);
  color: #7ee787;
}

.feedback.wrong {
  display: block;
  background: var(--red-dim);
  border-color: var(--red);
  color: #ff7b72;
}

.feedback-head {
  font-weight: 700;
  margin-bottom: 5px;
  font-size: 0.88rem;
}

.explanation-text { color: var(--muted); }
.explanation-text.show { color: inherit; }

/* ── Actions ── */
.q-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn-submit, .btn-next, .btn-quit {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.84rem;
  font-weight: 600;
  padding: 8px 18px;
  transition: border-color .1s, background .1s;
  display: none;
}

.btn-submit { border-color: var(--green); color: var(--green); }
.btn-submit:hover { background: var(--green-dim); }

.btn-next { border-color: var(--accent); color: var(--accent); }
.btn-next:hover { background: var(--accent-dim); }

.btn-quit { color: var(--muted); font-weight: 400; }
.btn-quit:hover { border-color: var(--muted); }

.btn-submit.show, .btn-next.show, .btn-quit.show { display: inline-block; }

/* ── Results ── */
.result-wrap {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}

.result-pct {
  text-align: center;
  padding: 16px 0 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.pct-display {
  font-size: 3.5rem;
  font-weight: 900;
  letter-spacing: -2px;
  display: block;
  line-height: 1;
  margin-bottom: 6px;
}

.pct-display.great { color: var(--green); }
.pct-display.ok { color: var(--yellow); }
.pct-display.bad { color: var(--red); }

.pct-label { color: var(--muted); font-size: 0.82rem; font-family: system-ui, sans-serif; }

.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.rstat {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  text-align: center;
  padding: 10px 6px;
}

.rstat-num { font-size: 1.6rem; font-weight: 800; display: block; }
.rstat-num.green { color: var(--green); }
.rstat-num.red { color: var(--red); }
.rstat-num.blue { color: var(--accent); }
.rstat-lbl { font-size: 0.7rem; color: var(--muted); font-family: system-ui, sans-serif; }

.result-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  justify-content: center;
}

/* ── Review List ── */
.review-section-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  font-family: system-ui, sans-serif;
}

.review-item {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 8px;
  font-family: system-ui, sans-serif;
  font-size: 0.82rem;
}

.review-item.r-correct { border-left: 3px solid var(--green); }
.review-item.r-wrong { border-left: 3px solid var(--red); }

.r-status {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 4px;
}

.r-correct .r-status { color: var(--green); }
.r-wrong .r-status { color: var(--red); }

.r-q { font-weight: 500; margin-bottom: 4px; color: var(--text); line-height: 1.45; }
.r-ans { color: var(--muted); font-size: 0.78rem; }
.r-ans em { color: var(--text); font-style: normal; }

@media (max-width: 480px) {
  body { padding: 14px 8px 40px; }
  .result-stats { grid-template-columns: repeat(3, 1fr); }
  .btn-grid, .btn-grid.narrow { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <header class="site-header">
    <div class="logo-row">
      <div class="logo-icon">RC</div>
      <h1>Networking Quiz Trainer</h1>
    </div>
    <p class="sub">CCNA / ITN · 852 questions across all modules &amp; exams</p>
  </header>

  <!-- Menu -->
  <div id="menu-screen" class="screen active">
    <div class="stat-row" id="stat-row"></div>
    <div class="menu-notice" id="menu-notice"></div>

    <div class="section-label">Quick Start</div>
    <div class="btn-grid">
      <button class="btn primary" data-mode="all">All 852 Questions</button>
      <button class="btn" data-mode="20">20 Random</button>
      <button class="btn" data-mode="50">50 Random</button>
      <button class="btn danger" id="wrong-btn" data-mode="wrong">Wrong Answers</button>
    </div>

    <div class="section-label">Module Quizzes</div>
    <div class="btn-grid narrow" id="module-btns"></div>

    <div class="section-label">Exams</div>
    <div class="btn-grid" id="exam-btns"></div>

    <div class="section-label">Check Your Understanding</div>
    <div class="btn-grid narrow" id="cyu-btns"></div>
  </div>

  <!-- Question -->
  <div id="question-screen" class="screen">
    <div class="quiz-topbar">
      <span class="q-counter" id="q-counter">Q 1/1</span>
      <div class="progress-outer"><div class="progress-inner" id="q-progress" style="width:0%"></div></div>
      <span class="q-score-live" id="q-score-live">0 pts</span>
    </div>

    <div class="q-card">
      <div class="q-meta">
        <span class="q-num" id="q-num">Q1</span>
        <span class="q-module-tag" id="q-mod"></span>
      </div>
      <div class="q-text" id="q-text"></div>
      <div class="multi-hint" id="q-multi-hint"></div>
      <div class="options" id="q-options"></div>

      <div class="feedback" id="q-feedback">
        <div class="feedback-head" id="q-fb-head"></div>
        <div class="explanation-text" id="q-explanation"></div>
      </div>

      <div class="q-actions">
        <button class="btn-submit" id="btn-submit">Submit Answer</button>
        <button class="btn-next" id="btn-next">Next →</button>
        <button class="btn-quit show" id="btn-quit">Quit</button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="results-screen" class="screen">
    <div class="result-wrap">
      <div class="result-pct">
        <span class="pct-display" id="pct-display"></span>
        <span class="pct-label" id="pct-label"></span>
      </div>
      <div class="result-stats">
        <div class="rstat">
          <span class="rstat-num green" id="stat-correct">0</span>
          <span class="rstat-lbl">Correct</span>
        </div>
        <div class="rstat">
          <span class="rstat-num red" id="stat-wrong">0</span>
          <span class="rstat-lbl">Wrong</span>
        </div>
        <div class="rstat">
          <span class="rstat-num blue" id="stat-total">0</span>
          <span class="rstat-lbl">Total</span>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn primary" id="btn-retry">Retry Same Mode</button>
        <button class="btn" id="btn-menu">Back to Menu</button>
      </div>
      <div class="review-section-label">Session Review</div>
      <div id="review-list"></div>
    </div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
const ALL_QUESTIONS = [{"module":"Basic Network Connectivity and Communications Exam","question":"In the show running-config command, which part of the syntax is represented by running-config?","options":["the command","a keyword","a variable","a prompt"],"answer":[1],"explanation":"running-config is a Cisco IOS keyword in the show running-config command."},{"module":"Basic Network Connectivity and Communications Exam","question":"An employee at a branch office is creating a quote for a customer. In order to do this, the employee needs to access confidential pricing information from internal servers at the Head Office. What type of network would the employee access?","options":["an intranet","the Internet","an extranet","a local area network"],"answer":[0],"explanation":"An intranet is a private internal network used by an organization's staff to access internal resources."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which statement describes the use of powerline networking technology?","options":["New smart electrical cabling is used to extend an existing home LAN.","A home LAN is installed without the use of physical cabling.","A device connects to an existing home LAN using an adapter and an existing electrical outlet.","Wireless access points use powerline adapters to distribute data through the home LAN."],"answer":[2],"explanation":"Powerline networking uses adapters plugged into existing electrical outlets to carry LAN traffic over home electrical wiring."},{"module":"Basic Network Connectivity and Communications Exam","question":"A networking technician is working on the wireless network at a medical clinic. The technician accidentally sets up the wireless network so that patients can see the medical records data of other patients. Which of the four network characteristics has been violated in this situation?","options":["fault tolerance","scalability","security","Quality of Service (QoS)","reliability"],"answer":[2],"explanation":"Allowing unauthorized access to confidential medical records is a security violation."},{"module":"Basic Network Connectivity and Communications Exam","question":"What two criteria are used to help select a network medium from various network media? (Choose two.)","options":["the types of data that need to be prioritized","the cost of the end devices utilized in the network","the distance the selected medium can successfully carry a signal","the number of intermediate devices installed in the network","the environment where the selected medium is to be installed"],"answer":[2,4],"explanation":"Network media are selected partly by distance limitations and the installation environment."},{"module":"Basic Network Connectivity and Communications Exam","question":"What type of network traffic requires QoS?","options":["email","on-line purchasing","video conferencing","wiki"],"answer":[2],"explanation":"Video conferencing is sensitive to delay, jitter, and packet loss, so it benefits from QoS."},{"module":"Basic Network Connectivity and Communications Exam","question":"A user is implementing security on a small office network. Which two actions would provide the minimum security requirements for this network? (Choose two.)","options":["implementing a firewall","installing a wireless network","installing antivirus software","implementing an intrusion detection system","adding a dedicated intrusion prevention device"],"answer":[0,2],"explanation":"A firewall and antivirus software provide basic protection for a small office network."},{"module":"Basic Network Connectivity and Communications Exam","question":"Passwords can be used to restrict access to all or parts of the Cisco IOS. Select the modes and interfaces that can be protected with passwords. (Choose three.)","options":["VTY interface","console interface","Ethernet interface","boot IOS mode","privileged EXEC mode","router configuration mode"],"answer":[0,1,4],"explanation":"Passwords can protect VTY access, console access, and privileged EXEC mode."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which interface allows remote management of a Layer 2 switch?","options":["the AUX interface","the console port interface","the switch virtual interface","the first Ethernet port interface"],"answer":[2],"explanation":"A switch virtual interface can be assigned an IP address for remote management."},{"module":"Basic Network Connectivity and Communications Exam","question":"What function does pressing the Tab key have when entering a command in IOS?","options":["It aborts the current command and returns to configuration mode.","It exits configuration mode and returns to user EXEC mode.","It moves the cursor to the beginning of the next line.","It completes the remainder of a partially typed word in a command."],"answer":[3],"explanation":"The Tab key completes a command keyword when the typed text uniquely identifies it."},{"module":"Basic Network Connectivity and Communications Exam","question":"While trying to solve a network issue, a technician made multiple changes to the current router configuration file. The changes did not solve the problem and were not saved. What action can the technician take to discard the changes and work with the file in NVRAM?","options":["Issue the reload command without saving the running configuration.","Delete the vlan.dat file and reboot the device.","Close and reopen the terminal emulation software.","Issue the copy startup-config running-config command."],"answer":[0],"explanation":"Reloading without saving discards unsaved running configuration changes and loads the startup configuration from NVRAM."},{"module":"Basic Network Connectivity and Communications Exam","question":"An administrator uses the Ctrl-Shift-6 key combination on a switch after issuing the ping command. What is the purpose of using these keystrokes?","options":["to restart the ping process","to interrupt the ping process","to exit to a different configuration mode","to allow the user to complete the command"],"answer":[1],"explanation":"Ctrl-Shift-6 interrupts an active IOS process such as ping."},{"module":"Basic Network Connectivity and Communications Exam","question":"A technician configures a switch with these commands: SwitchA(config)# interface vlan 1; SwitchA(config-if)# ip address 192.168.1.1 255.255.255.0; SwitchA(config-if)# no shutdown. What is the technician configuring?","options":["Telnet access","SVI","password encryption","physical switchport access"],"answer":[1],"explanation":"The commands configure interface VLAN 1, which is a switch virtual interface."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which command or key combination allows a user to return to the previous level in the command hierarchy?","options":["end","exit","Ctrl-Z","Ctrl-C"],"answer":[1],"explanation":"The exit command moves back one level in the IOS command hierarchy."},{"module":"Basic Network Connectivity and Communications Exam","question":"What are two characteristics of RAM on a Cisco device? (Choose two.)","options":["RAM provides nonvolatile storage.","The configuration that is actively running on the device is stored in RAM.","The contents of RAM are lost during a power cycle.","RAM is a component in Cisco switches but not in Cisco routers.","RAM is able to store multiple versions of IOS and configuration files."],"answer":[1,2],"explanation":"RAM stores the running configuration and is volatile, so its contents are lost during a power cycle."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which two host names follow the guidelines for naming conventions on Cisco IOS devices? (Choose two.)","options":["Branch2!","RM-3-Switch-2A4","Floor(15)","HO Floor 17","SwBranch799"],"answer":[1,4],"explanation":"Valid IOS host names start with a letter and use letters, digits, and hyphens, without spaces or special characters."},{"module":"Basic Network Connectivity and Communications Exam","question":"How is SSH different from Telnet?","options":["SSH makes connections over the network, whereas Telnet is for out-of-band access.","SSH provides security to remote sessions by encrypting messages and using user authentication. Telnet is considered insecure and sends messages in plaintext.","SSH requires the use of the PuTTY terminal emulation program. Tera Term must be used to connect to devices through the use of Telnet.","SSH must be configured over an active network connection, whereas Telnet is used to connect to a device from a console connection."],"answer":[1],"explanation":"SSH encrypts remote sessions and supports user authentication, while Telnet sends data in plaintext."},{"module":"Basic Network Connectivity and Communications Exam","question":"What are three characteristics of an SVI? (Choose three.)","options":["It is designed as a security protocol to protect switch ports.","It is not associated with any physical interface on a switch.","It is a special interface that allows connectivity by different types of media.","It is required to allow connectivity by any device at any location.","It provides a means to remotely manage a switch.","It is associated with VLAN1 by default."],"answer":[1,4,5],"explanation":"An SVI is a virtual interface, can be used for remote switch management, and is associated with VLAN 1 by default on many switches."},{"module":"Basic Network Connectivity and Communications Exam","question":"What command is used to verify the condition of the switch interfaces, including the status of the interfaces and a configured IP address?","options":["ipconfig","ping","traceroute","show ip interface brief"],"answer":[3],"explanation":"show ip interface brief displays a summary of interface status and configured IP addresses."},{"module":"Basic Network Connectivity and Communications Exam","question":"After making configuration changes on a Cisco switch, a network administrator issues a copy running-config startup-config command. What is the result of issuing this command?","options":["The new configuration will be stored in flash memory.","The new configuration will be loaded if the switch is restarted.","The current IOS file will be replaced with the newly configured file.","The configuration changes will be removed and the original configuration will be restored."],"answer":[1],"explanation":"copy running-config startup-config saves the running configuration to NVRAM so it is loaded after a restart."},{"module":"Basic Network Connectivity and Communications Exam","question":"What command will prevent all unencrypted passwords from displaying in plain text in a configuration file?","options":["(config)# enable password secret","(config)# enable secret Secret_Password","(config-line)# password secret","(config)# service password-encryption","(config)# enable secret Encrypted_Password"],"answer":[3],"explanation":"The service password-encryption command encrypts plaintext passwords shown in configuration files."},{"module":"Basic Network Connectivity and Communications Exam","question":"A network administrator enters the service password-encryption command into the configuration mode of a router. What does this command accomplish?","options":["This command encrypts passwords as they are transmitted across serial WAN links.","This command prevents someone from viewing the running configuration passwords.","This command enables a strong encryption algorithm for the enable secret password command.","This command automatically encrypts passwords in configuration files that are currently stored in NVRAM.","This command provides an exclusive encrypted password for external service personnel who are required to do router maintenance."],"answer":[1],"explanation":"service password-encryption encrypts plaintext passwords in the running and startup configuration displays."},{"module":"Basic Network Connectivity and Communications Exam","question":"What method can be used by two computers to ensure that packets are not dropped because too much data is being sent too quickly?","options":["encapsulation","flow control","access method","response timeout"],"answer":[1],"explanation":"Flow control lets communicating devices manage transmission timing so data is not sent too quickly."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which statement accurately describes a TCP/IP encapsulation process when a PC is sending data to the network?","options":["Data is sent from the internet layer to the network access layer.","Packets are sent from the network access layer to the transport layer.","Segments are sent from the transport layer to the internet layer.","Frames are sent from the network access layer to the internet layer."],"answer":[2],"explanation":"During outbound encapsulation, the transport layer passes segments to the internet layer."},{"module":"Basic Network Connectivity and Communications Exam","question":"What three application layer protocols are part of the TCP/IP protocol suite? (Choose three.)","options":["ARP","DHCP","DNS","FTP","NAT","PPP"],"answer":[1,2,3],"explanation":"DHCP, DNS, and FTP are TCP/IP application layer protocols."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which name is assigned to the transport layer PDU?","options":["bits","data","frame","packet","segment"],"answer":[4],"explanation":"The transport layer PDU is called a segment."},{"module":"Basic Network Connectivity and Communications Exam","question":"When IPv4 addressing is manually configured on a web server, which property of the IPv4 configuration identifies the network and host portion for an IPv4 address?","options":["DNS server address","subnet mask","default gateway","DHCP server address"],"answer":[1],"explanation":"The subnet mask identifies the network and host portions of an IPv4 address."},{"module":"Basic Network Connectivity and Communications Exam","question":"What process involves placing one PDU inside of another PDU?","options":["encapsulation","encoding","segmentation","flow control"],"answer":[0],"explanation":"Encapsulation places one protocol data unit inside the data field of another lower-layer PDU."},{"module":"Basic Network Connectivity and Communications Exam","question":"What layer is responsible for routing messages through an internetwork in the TCP/IP model?","options":["internet","transport","network access","session"],"answer":[0],"explanation":"The TCP/IP internet layer is responsible for routing messages between networks."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which PDU format is used when bits are received from the network medium by the NIC of a host?","options":["file","frame","packet","segment"],"answer":[1],"explanation":"At the data link layer, received bits are interpreted as a frame."},{"module":"Basic Network Connectivity and Communications Exam","question":"Refer to the exhibit. ServerB is attempting to contact HostA. Which two statements correctly identify the addressing that ServerB will generate in the process? (Choose two.)","options":["ServerB will generate a packet with the destination IP address of RouterB.","ServerB will generate a frame with the destination MAC address of SwitchB.","ServerB will generate a packet with the destination IP address of RouterA.","ServerB will generate a frame with the destination MAC address of RouterB.","ServerB will generate a packet with the destination IP address of HostA.","ServerB will generate a frame with the destination MAC address of RouterA."],"answer":[3,4],"explanation":"For a remote destination, ServerB uses HostA's IP address in the packet and the local default gateway RouterB's MAC address in the frame."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which method allows a computer to react accordingly when it requests data from a server and the server takes too long to respond?","options":["encapsulation","flow control","access method","response timeout"],"answer":[3],"explanation":"A response timeout lets a host decide that no reply is coming after waiting an acceptable amount of time."},{"module":"Basic Network Connectivity and Communications Exam","question":"A web client is receiving a response for a web page from a web server. From the perspective of the client, what is the correct order of the protocol stack that is used to decode the received transmission?","options":["Ethernet, IP, TCP, HTTP","HTTP, TCP, IP, Ethernet","Ethernet, TCP, IP, HTTP","HTTP, Ethernet, IP, TCP"],"answer":[0],"explanation":"A receiving host decapsulates from the lower layers upward: Ethernet, IP, TCP, then HTTP."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which two OSI model layers have the same functionality as a single layer of the TCP/IP model? (Choose two.)","options":["data link","network","physical","session","transport"],"answer":[0,2],"explanation":"The OSI data link and physical layers map together to the TCP/IP network access layer."},{"module":"Basic Network Connectivity and Communications Exam","question":"At which layer of the OSI model would a logical address be added during encapsulation?","options":["physical layer","data link layer","network layer","transport layer"],"answer":[2],"explanation":"Logical addresses, such as IP addresses, are added at the network layer."},{"module":"Basic Network Connectivity and Communications Exam","question":"What is a characteristic of multicast messages?","options":["They are sent to a select group of hosts.","They are sent to all hosts on a network.","They must be acknowledged.","They are sent to a single destination."],"answer":[0],"explanation":"Multicast sends one message to a selected multicast group."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which statement is correct about network protocols?","options":["Network protocols define the type of hardware that is used and how it is mounted in racks.","They define how messages are exchanged between the source and the destination.","They all function in the network access layer of TCP/IP.","They are only required for exchange of messages between devices on remote networks."],"answer":[1],"explanation":"Network protocols define rules for exchanging messages between source and destination devices."},{"module":"Basic Network Connectivity and Communications Exam","question":"What is an advantage of network devices using open standard protocols?","options":["Network communications is confined to data transfers between devices from the same vendor.","A client host and a server running different operating systems can successfully exchange data.","Internet access can be controlled by a single ISP in each market.","Competition and innovation are limited to specific types of products."],"answer":[1],"explanation":"Open standards allow interoperable communication between devices and software from different vendors."},{"module":"Basic Network Connectivity and Communications Exam","question":"Which device performs the function of determining the path that messages should take through internetworks?","options":["a router","a firewall","a web server","a DSL modem"],"answer":[0],"explanation":"Routers determine paths for traffic through internetworks."},{"module":"Basic Network Connectivity and Communications Exam","question":"Open the PT Activity. What is the IP address of the switch virtual interface (SVI) on Switch0?","options":["192.168.5.10","192.168.10.5","192.168.10.1","192.168.5.0"],"answer":[1],"explanation":"The activity answer identifies 192.168.10.5 as the SVI IP address on Switch0."},{"module":"Basic Network Connectivity and Communications Exam","question":"Why would a Layer 2 switch need an IP address?","options":["to enable the switch to send broadcast frames to attached PCs","to enable the switch to function as a default gateway","to enable the switch to be managed remotely","to enable the switch to receive frames from attached PCs"],"answer":[2],"explanation":"A Layer 2 switch uses an IP address on a virtual interface so it can be managed remotely."},{"module":"Basic Network Connectivity and Communications Exam","question":"Refer to the exhibit. An administrator is trying to configure the switch but receives the error message that is displayed in the exhibit. What is the problem?","options":["The entire command, configure terminal, must be used.","The administrator is already in global configuration mode.","The administrator must first enter privileged EXEC mode before issuing the command.","The administrator must connect via the console port to access global configuration mode."],"answer":[2],"explanation":"configure terminal must be entered from privileged EXEC mode, so the administrator must first use enable."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes a network owned by one organization that provides safe and secure access to individuals who work for a different organization?","options":["extranet","cloud","BYOD","quality of service"],"answer":[0],"explanation":"An extranet gives authorized external users secure access to selected organizational resources."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes storing personal files on servers over the internet to provide access anywhere, anytime, and on any device?","options":["cloud","BYOD","quality of service","converged network"],"answer":[0],"explanation":"Cloud storage keeps files on internet-accessible servers for access from many devices and locations."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes a network where one computer can be both client and server?","options":["peer-to-peer","cloud","BYOD","quality of service"],"answer":[0],"explanation":"In a peer-to-peer network, each computer can act as both client and server."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes a type of network used by people who work from home or from a small remote office?","options":["SOHO network","BYOD","quality of service","converged network"],"answer":[0],"explanation":"SOHO means small office/home office."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes a computing model where server software runs on dedicated computers?","options":["client/server","internet","intranet","extranet"],"answer":[0],"explanation":"In a client/server model, dedicated servers provide resources or services to client devices."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes a technology that allows devices to connect to the LAN using an electrical outlet?","options":["powerline networking","internet","intranet","extranet"],"answer":[0],"explanation":"Powerline networking carries LAN traffic over existing electrical wiring."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes a policy that allows network devices to manage the flow of data to give priority to voice and video?","options":["quality of service","internet","intranet","extranet"],"answer":[0],"explanation":"Quality of Service prioritizes delay-sensitive traffic such as voice and video."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes a private collection of LANs and WANs that belongs to an organization?","options":["intranet","internet","extranet","peer-to-peer"],"answer":[0],"explanation":"An intranet is a private internal network belonging to an organization."},{"module":"Basic Network Connectivity and Communications Exam","question":"What term describes the ability to use personal devices across a business or campus network?","options":["BYOD","internet","intranet","extranet"],"answer":[0],"explanation":"BYOD stands for Bring Your Own Device."},{"module":"Basic Network Connectivity and Communications Exam","question":"At which OSI layer is a source IP address added to a PDU during the encapsulation process?","options":["network layer","data link layer","transport layer","application layer"],"answer":[0],"explanation":"Source and destination IP addresses are added at the network layer."},{"module":"Basic Network Connectivity and Communications Exam","question":"At which OSI layer is a destination port number added to a PDU during the encapsulation process?","options":["transport layer","data link layer","network layer","application layer"],"answer":[0],"explanation":"Port numbers are added at the transport layer."},{"module":"Basic Network Connectivity and Communications Exam","question":"At which OSI layer is data added to a PDU during the encapsulation process?","options":["application layer","data link layer","network layer","transport layer"],"answer":[0],"explanation":"Application data originates at the application layer before being encapsulated by lower layers."},{"module":"Basic Network Connectivity and Communications Exam","question":"At which OSI layer is a destination IP address added to a PDU during the encapsulation process?","options":["network layer","application layer","transport layer","presentation layer"],"answer":[0],"explanation":"IP addressing is added at the network layer."},{"module":"Basic Network Connectivity and Communications Exam","question":"At which OSI layer is a source MAC address added to a PDU during the encapsulation process?","options":["data link layer","application layer","transport layer","presentation layer"],"answer":[0],"explanation":"MAC addressing is added at the data link layer."},{"module":"Basic Network Connectivity and Communications Exam","question":"At which OSI layer is a source port number added to a PDU during the encapsulation process?","options":["transport layer","application layer","network layer","presentation layer"],"answer":[0],"explanation":"Port numbers are added at the transport layer."},{"module":"Basic Network Connectivity and Communications Exam","question":"At which OSI layer is a destination MAC address added to a PDU during the encapsulation process?","options":["data link layer","transport layer","application layer","network layer"],"answer":[0],"explanation":"MAC addresses are added in the data link layer frame."},{"module":"Ethernet Concepts Exam","question":"A network administrator is measuring the transfer of bits across the company backbone for a mission critical financial application. The administrator notices that the network throughput appears lower than the bandwidth expected. Which three factors could influence the differences in throughput? (Choose three.)","options":["the amount of traffic that is currently crossing the network","the sophistication of the encapsulation method applied to the data","the type of traffic that is crossing the network","the latency that is created by the number of network devices that the data is crossing","the bandwidth of the WAN connection to the Internet","the reliability of the gigabit Ethernet infrastructure of the backbone"],"answer":[0,2,3],"explanation":"Throughput can be affected by traffic amount, traffic type, and latency caused by devices along the path."},{"module":"Ethernet Concepts Exam","question":"What are two characteristics of fiber-optic cable? (Choose two.)","options":["It is not affected by EMI or RFI.","Each pair of cables is wrapped in metallic foil.","It combines the technique of cancellation, shielding, and twisting to protect data.","It typically contains 4 pairs of fiber-optic wires.","It is more expensive than UTP cabling is."],"answer":[0,4],"explanation":"Fiber is immune to EMI/RFI and is typically more expensive than UTP cabling."},{"module":"Ethernet Concepts Exam","question":"What is a primary role of the Physical layer in transmitting data on the network?","options":["create the signals that represent the bits in each frame on to the media","provide physical addressing to the devices","determine the path packets take through the network","control data access to the media"],"answer":[0],"explanation":"The physical layer encodes bits as signals and transmits them over the network media."},{"module":"Ethernet Concepts Exam","question":"With the use of unshielded twisted-pair copper wire in a network, what causes crosstalk within the cable pairs?","options":["the magnetic field around the adjacent pairs of wire","the use of braided wire to shield the adjacent wire pairs","the reflection of the electrical wave back from the far end of the cable","the collision caused by two nodes trying to use the media simultaneously"],"answer":[0],"explanation":"Crosstalk occurs when the magnetic field from one wire interferes with signals on an adjacent wire."},{"module":"Ethernet Concepts Exam","question":"In addition to the cable length, what two factors could interfere with the communication carried over UTP cables? (Choose two.)","options":["crosstalk","bandwidth","size of the network","signal modulation technique","electromagnetic interference"],"answer":[0,4],"explanation":"UTP copper cabling can be affected by crosstalk and electromagnetic or radio-frequency interference."},{"module":"Ethernet Concepts Exam","question":"Which two devices commonly affect wireless networks? (Choose two.)","options":["Blu-ray players","home theaters","cordless phones","microwaves","incandescent light bulbs","external hard drives"],"answer":[2,3],"explanation":"Cordless phones and microwaves can cause radio-frequency interference for wireless networks."},{"module":"Ethernet Concepts Exam","question":"Which two statements describe the services provided by the data link layer? (Choose two.)","options":["It defines the end-to-end delivery addressing scheme.","It maintains the path between the source and destination devices during the data transmission.","It manages the access of frames to the network media.","It provides reliable delivery through link establishment and flow control.","It ensures that application data will be transmitted according to the prioritization.","It packages various Layer 3 PDUs into a frame format that is compatible with the network interface."],"answer":[2,5],"explanation":"The data link layer manages media access and frames Layer 3 PDUs for the network interface and media."},{"module":"Ethernet Concepts Exam","question":"What is the function of the CRC value that is found in the FCS field of a frame?","options":["to verify the integrity of the received frame","to verify the physical address in the frame","to verify the logical address in the frame","to compute the checksum header for the data field in the frame"],"answer":[0],"explanation":"The CRC in the FCS field is used to detect whether a received frame has errors."},{"module":"Ethernet Concepts Exam","question":"What is contained in the trailer of a data-link frame?","options":["logical address","physical address","data","error detection"],"answer":[3],"explanation":"The data-link trailer contains error detection information, such as the FCS."},{"module":"Ethernet Concepts Exam","question":"Which statement describes a characteristic of the frame header fields of the data link layer?","options":["They all include the flow control and logical connection fields.","Ethernet frame header fields contain Layer 3 source and destination addresses.","They vary depending on protocols.","They include information on user applications."],"answer":[2],"explanation":"Data-link frame header fields vary according to the protocol."},{"module":"Ethernet Concepts Exam","question":"A network team is comparing physical WAN topologies for connecting remote sites to a headquarters building. Which topology provides high availability and connects some, but not all, remote sites?","options":["mesh","partial mesh","hub and spoke","point-to-point"],"answer":[1],"explanation":"A partial mesh connects some, but not all, remote sites and can provide high availability."},{"module":"Ethernet Concepts Exam","question":"Which two fields or features does Ethernet examine to determine if a received frame is passed to the data link layer or discarded by the NIC? (Choose two.)","options":["auto-MDIX","CEF","Frame Check Sequence","minimum frame size","source MAC address"],"answer":[2,3],"explanation":"Ethernet discards frames that fail FCS validation or are smaller than the minimum frame size."},{"module":"Ethernet Concepts Exam","question":"Which media communication type does not require media arbitration in the data link layer?","options":["deterministic","half-duplex","full-duplex","controlled access"],"answer":[2],"explanation":"Full-duplex communication allows simultaneous sending and receiving, so media arbitration is not required."},{"module":"Ethernet Concepts Exam","question":"Which statement describes an extended star topology?","options":["End devices connect to a central intermediate device, which in turn connects to other central intermediate devices.","End devices are connected together by a bus and each bus connects to a central intermediate device.","Each end system is connected to its respective neighbor via an intermediate device.","All end and intermediate devices are connected in a chain to each other."],"answer":[0],"explanation":"An extended star connects central intermediate devices to other central intermediate devices."},{"module":"Ethernet Concepts Exam","question":"What is a characteristic of the LLC sublayer?","options":["It provides the logical addressing required that identifies the device.","It provides delimitation of data according to the physical signaling requirements of the medium.","It places information in the frame allowing multiple Layer 3 protocols to use the same network interface and media.","It defines software processes that provide services to the physical layer."],"answer":[2],"explanation":"LLC identifies the Layer 3 protocol so multiple network layer protocols can use the same interface and media."},{"module":"Ethernet Concepts Exam","question":"What are three ways that media access control is used in networking? (Choose three.)","options":["Ethernet utilizes CSMA/CD.","Media access control provides placement of data frames onto the media.","Contention-based access is also known as deterministic.","802.11 utilizes CSMA/CD.","Data link layer protocols define the rules for access to different media.","Networks with controlled access have reduced performance due to data collisions."],"answer":[0,1,4],"explanation":"Media access control defines how frames are placed on media; Ethernet uses CSMA/CD, and data-link protocols define access rules for different media."},{"module":"Ethernet Concepts Exam","question":"During the encapsulation process, what occurs at the data link layer for a PC connected to an Ethernet network?","options":["An IP address is added.","The logical address is added.","The physical address is added.","The process port number is added."],"answer":[2],"explanation":"The Ethernet data-link layer adds source and destination physical, or MAC, addresses."},{"module":"Ethernet Concepts Exam","question":"What three items are contained in an Ethernet header and trailer? (Choose three.)","options":["source IP address","source MAC address","destination IP address","destination MAC address","error-checking information"],"answer":[1,3,4],"explanation":"Ethernet header and trailer information includes source MAC, destination MAC, and error-checking information."},{"module":"Ethernet Concepts Exam","question":"Which statement is true about the CSMA/CD access method that is used in Ethernet?","options":["When a device hears a carrier signal and transmits, a collision cannot occur.","A jamming signal causes only devices that caused the collision to execute a backoff algorithm.","All network devices must listen before transmitting.","Devices involved in a collision get priority to transmit after the backoff period."],"answer":[2],"explanation":"With CSMA/CD, devices listen to the medium before transmitting."},{"module":"Ethernet Concepts Exam","question":"What is the auto-MDIX feature on a switch?","options":["the automatic configuration of an interface for 10/100/1000 Mb/s operation","the automatic configuration of an interface for a straight-through or a crossover Ethernet cable connection","the automatic configuration of full-duplex operation over a single Ethernet copper or optical cable","the ability to turn a switch interface on or off accordingly if an active connection is detected"],"answer":[1],"explanation":"Auto-MDIX automatically adjusts an interface for a straight-through or crossover Ethernet cable."},{"module":"Ethernet Concepts Exam","question":"A Layer 2 switch is used to switch incoming frames from a 1000BASE-T port to a port connected to a 100Base-T network. Which method of memory buffering would work best for this task?","options":["port-based buffering","level 1 cache buffering","shared memory buffering","fixed configuration buffering"],"answer":[2],"explanation":"Shared memory buffering works well when frames move between ports with different speeds."},{"module":"Ethernet Concepts Exam","question":"What are two examples of the cut-through switching method? (Choose two.)","options":["store-and-forward switching","fast-forward switching","CRC switching","fragment-free switching","QOS switching"],"answer":[1,3],"explanation":"Fast-forward and fragment-free switching are cut-through switching methods."},{"module":"Ethernet Concepts Exam","question":"Which frame forwarding method receives the entire frame and performs a CRC check to detect errors before forwarding the frame?","options":["cut-through switching","store-and-forward switching","fragment-free switching","fast-forward switching"],"answer":[1],"explanation":"Store-and-forward switching receives the whole frame and checks the CRC before forwarding."},{"module":"Ethernet Concepts Exam","question":"What is the purpose of the FCS field in a frame?","options":["to obtain the MAC address of the sending node","to verify the logical address of the sending node","to compute the CRC header for the data field","to determine if errors occurred in the transmission and reception"],"answer":[3],"explanation":"The FCS field is used to detect transmission or reception errors in a frame."},{"module":"Ethernet Concepts Exam","question":"Which switching method has the lowest level of latency?","options":["cut-through","store-and-forward","fragment-free","fast-forward"],"answer":[3],"explanation":"Fast-forward switching begins forwarding after reading the destination MAC address, giving the lowest latency."},{"module":"Ethernet Concepts Exam","question":"A network administrator is connecting two modern switches using a straight-through cable. The switches are new and have never been configured. Which three statements are correct about the final result of the connection? (Choose three.)","options":["The link between the switches will work at the fastest speed that is supported by both switches.","The link between switches will work as full-duplex.","If both switches support different speeds, they will each work at their own fastest speed.","The auto-MDIX feature will configure the interfaces eliminating the need for a crossover cable.","The connection will not be possible unless the administrator changes the cable to a crossover cable.","The duplex capability has to be manually configured because it cannot be negotiated."],"answer":[0,1,3],"explanation":"Modern switches commonly negotiate the fastest shared speed, full duplex, and use auto-MDIX."},{"module":"Ethernet Concepts Exam","question":"Which advantage does the store-and-forward switching method have compared with the cut-through switching method?","options":["collision detecting","frame error checking","faster frame forwarding","frame forwarding using IPv4 Layer 3 and 4 information"],"answer":[1],"explanation":"Store-and-forward switching checks the complete frame for errors before forwarding."},{"module":"Ethernet Concepts Exam","question":"When the store-and-forward method of switching is in use, what part of the Ethernet frame is used to perform an error check?","options":["CRC in the trailer","source MAC address in the header","destination MAC address in the header","protocol type in the header"],"answer":[0],"explanation":"The CRC in the trailer is used to verify frame integrity."},{"module":"Ethernet Concepts Exam","question":"Which switching method uses the CRC value in a frame?","options":["cut-through","fast-forward","fragment-free","store-and-forward"],"answer":[3],"explanation":"Store-and-forward switching receives the full frame and uses the CRC to check for errors."},{"module":"Ethernet Concepts Exam","question":"What are two actions performed by a Cisco switch? (Choose two.)","options":["building a routing table that is based on the first IP address in the frame header","using the source MAC addresses of frames to build and maintain a MAC address table","forwarding frames with unknown destination IP addresses to the default gateway","utilizing the MAC address table to forward frames via the destination MAC address","examining the destination MAC address to add new entries to the MAC address table"],"answer":[1,3],"explanation":"Switches learn source MAC addresses and use the MAC address table to forward frames by destination MAC address."},{"module":"Ethernet Concepts Exam","question":"Which two statements describe features or functions of the logical link control sublayer in Ethernet standards? (Choose two.)","options":["Logical link control is implemented in software.","Logical link control is specified in the IEEE 802.3 standard.","The LLC sublayer adds a header and a trailer to the data.","The data link layer uses LLC to communicate with the upper layers of the protocol suite.","The LLC sublayer is responsible for the placement and retrieval of frames on and off the media."],"answer":[0,3],"explanation":"LLC is implemented in software and enables the data link layer to communicate with upper-layer protocols."},{"module":"Ethernet Concepts Exam","question":"What is one advantage of using the cut-through switching method instead of the store-and-forward switching method?","options":["has a positive impact on bandwidth by dropping most of the invalid frames","makes a fast forwarding decision based on the source MAC address of the frame","has a lower latency appropriate for high-performance computing applications","provides the flexibility to support any mix of Ethernet speeds"],"answer":[2],"explanation":"Cut-through switching starts forwarding sooner, which gives it lower latency."},{"module":"Ethernet Concepts Exam","question":"Which is a multicast MAC address?","options":["cc-cc-cc-cc-cc-cc","5C-26-0A-4B-19-3E","01-00-5E-00-00-03","00-26-0F-4B-00-3E"],"answer":[2],"explanation":"IPv4 multicast MAC addresses begin with 01-00-5E."},{"module":"Ethernet Concepts Exam","question":"What does the term attenuation mean in data communication?","options":["loss of signal strength as distance increases","time for a signal to reach its destination","leakage of signals from one cable pair to another","strengthening of a signal by a networking device"],"answer":[0],"explanation":"Attenuation is signal loss as distance increases."},{"module":"Ethernet Concepts Exam","question":"What makes fiber preferable to copper cabling for interconnecting buildings? (Choose three.)","options":["greater distances per cable run","lower installation cost","limited susceptibility to EMI/RFI","durable connections","greater bandwidth potential","easily terminated"],"answer":[0,2,4],"explanation":"Fiber supports greater distances, higher bandwidth, and immunity to EMI/RFI compared with copper."},{"module":"Ethernet Concepts Exam","question":"What OSI physical layer term describes the process by which one wave modifies another wave?","options":["modulation","IEEE","EIA/TIA","air"],"answer":[0],"explanation":"Modulation is the process of modifying a carrier wave to encode information."},{"module":"Ethernet Concepts Exam","question":"What OSI physical layer term describes the capacity at which a medium can carry data?","options":["bandwidth","throughput","latency","goodput"],"answer":[0],"explanation":"Bandwidth describes the data-carrying capacity of a medium."},{"module":"Ethernet Concepts Exam","question":"What OSI physical layer term describes the measure of the transfer of bits across a medium over a given period of time?","options":["throughput","bandwidth","latency","goodput"],"answer":[0],"explanation":"Throughput is the actual transfer of bits across a medium over time."},{"module":"Ethernet Concepts Exam","question":"What OSI physical layer term describes the amount of time, including delays, for data to travel from one point to another?","options":["latency","bandwidth","throughput","goodput"],"answer":[0],"explanation":"Latency is the delay for data to travel from source to destination."},{"module":"Ethernet Concepts Exam","question":"What OSI physical layer term describes the measure of usable data transferred over a given period of time?","options":["goodput","fiber-optic cable","air","copper cable"],"answer":[0],"explanation":"Goodput measures useful data transferred, excluding overhead and retransmissions."},{"module":"Ethernet Concepts Exam","question":"What OSI physical layer term describes the physical medium which uses electrical pulses?","options":["copper cable","fiber-optic cable","air","goodput"],"answer":[0],"explanation":"Copper cable uses electrical pulses to transmit data."},{"module":"Ethernet Concepts Exam","question":"What OSI physical layer term describes the physical medium that uses the propagation of light?","options":["fiber-optic cable","goodput","latency","throughput"],"answer":[0],"explanation":"Fiber-optic cable transmits data using light."},{"module":"Ethernet Concepts Exam","question":"What OSI physical layer term describes the physical medium for microwave transmissions?","options":["air","goodput","latency","throughput"],"answer":[0],"explanation":"Microwave wireless transmissions travel through air."},{"module":"Ethernet Concepts Exam","question":"Which two functions are performed at the MAC sublayer of the OSI data link layer? (Choose two.)","options":["Implements a trailer to detect transmission errors.","Controls the NIC responsible for sending and receiving data on the physical medium.","Places information in the frame that identifies which network layer protocol is being used for the frame.","Adds Layer 2 control information to network protocol data.","Enables IPv4 and IPv6 to utilize the same network interface and media."],"answer":[0,1],"explanation":"The MAC sublayer controls media access through the NIC and includes the trailer used for error detection."},{"module":"Ethernet Concepts Exam","question":"Which two functions are performed at the LLC sublayer of the OSI data link layer? (Choose two.)","options":["Enables IPv4 and IPv6 to utilize the same network interface and media.","Places information in the frame that identifies which network layer protocol is being used for the frame.","Integrates various physical technologies.","Implements a process to delimit fields within a Layer 2 frame.","Controls the NIC responsible for sending and receiving data on the physical medium."],"answer":[0,1],"explanation":"LLC identifies the network layer protocol and allows multiple Layer 3 protocols to use the same interface and media."},{"module":"Ethernet Concepts Exam","question":"What action will occur if a switch receives a frame and does have the source MAC address in the MAC table?","options":["The switch refreshes the timer on that entry.","The switch shares the MAC address table entry with any connected switches.","The switch does not forward the frame.","The switch adds it to its MAC address table associated with the port number."],"answer":[0],"explanation":"When the source MAC address is already known, the switch refreshes the aging timer for that MAC table entry."},{"module":"Ethernet Concepts Exam","question":"What action will occur if a host receives a frame with a destination MAC address it does not recognize?","options":["The host will discard the frame.","The host replies to the switch with its own IP address.","The host forwards the frame to all other hosts.","The host returns the frame to the switch."],"answer":[0],"explanation":"A host discards frames not addressed to its MAC address or a relevant broadcast/multicast address."},{"module":"Ethernet Concepts Exam","question":"What action will occur if a switch receives a frame with the destination MAC address cc:cc:cc:cc:cc:cc?","options":["The switch forwards it out all ports except the ingress port.","The switch refreshes the timer on that entry.","The switch does not forward the frame.","The switch sends the frame to a connected router because the destination MAC address is not local."],"answer":[0],"explanation":"A switch floods a broadcast frame out all ports except the port on which it was received."},{"module":"Communicating Between Networks Exam","question":"A computer can access devices on the same network but cannot access devices on other networks. What is the probable cause of this problem?","options":["The cable is not connected properly to the NIC.","The computer has an invalid IP address.","The computer has an incorrect subnet mask.","The computer has an invalid default gateway address."],"answer":[3],"explanation":"If local access works but remote access fails, the default gateway is likely missing or incorrect."},{"module":"Communicating Between Networks Exam","question":"Which statement describes a feature of the IP protocol?","options":["IP encapsulation is modified based on network media.","IP relies on Layer 2 protocols for transmission error control.","MAC addresses are used during the IP packet encapsulation.","IP relies on upper layer services to handle situations of missing or out-of-order packets."],"answer":[3],"explanation":"IP is connectionless and relies on upper-layer protocols such as TCP for recovery from missing or out-of-order packets."},{"module":"Communicating Between Networks Exam","question":"Why is NAT not needed in IPv6?","options":["Because IPv6 has integrated security, there is no need to hide the IPv6 addresses of internal networks.","Any host or user can get a public IPv6 network address because the number of available IPv6 addresses is extremely large.","The problems that are induced by NAT applications are solved because the IPv6 header improves packet handling by intermediate routers.","The end-to-end connectivity problems that are caused by NAT are solved because the number of routes increases with the number of nodes that are connected to the Internet."],"answer":[1],"explanation":"IPv6 has a very large address space, allowing public addressing without NAT."},{"module":"Communicating Between Networks Exam","question":"Which parameter does the router use to choose the path to the destination when there are multiple routes available?","options":["the lower metric value that is associated with the destination network","the lower gateway IP address to get to the destination network","the higher metric value that is associated with the destination network","the higher gateway IP address to get to the destination network"],"answer":[0],"explanation":"When multiple routes are available, the route with the lower metric is preferred."},{"module":"Communicating Between Networks Exam","question":"What are two services provided by the OSI network layer? (Choose two.)","options":["performing error detection","routing packets toward the destination","encapsulating PDUs from the transport layer","placement of frames on the media","collision detection"],"answer":[1,2],"explanation":"The network layer encapsulates transport layer PDUs into packets and routes packets toward destinations."},{"module":"Communicating Between Networks Exam","question":"Within a production network, what is the purpose of configuring a switch with a default gateway address?","options":["Hosts that are connected to the switch can use the switch default gateway address to forward packets to a remote destination.","A switch must have a default gateway to be accessible by Telnet and SSH.","The default gateway address is used to forward packets originating from the switch to remote networks.","It provides a next-hop address for all traffic that flows through the switch."],"answer":[2],"explanation":"A switch default gateway lets traffic originating from the switch reach remote networks."},{"module":"Communicating Between Networks Exam","question":"What is a basic characteristic of the IP protocol?","options":["connectionless","media dependent","user data segmentation","reliable end-to-end delivery"],"answer":[0],"explanation":"IP is a connectionless network layer protocol."},{"module":"Communicating Between Networks Exam","question":"Which field in the IPv4 header is used to prevent a packet from traversing a network endlessly?","options":["Time-to-Live","Sequence Number","Acknowledgment Number","Differentiated Services"],"answer":[0],"explanation":"The IPv4 Time-to-Live field is decremented by routers and prevents endless packet loops."},{"module":"Communicating Between Networks Exam","question":"What is one advantage that the IPv6 simplified header offers over IPv4?","options":["smaller-sized header","little requirement for processing checksums","smaller-sized source and destination IP addresses","efficient packet handling"],"answer":[3],"explanation":"The simplified IPv6 header supports more efficient packet handling."},{"module":"Communicating Between Networks Exam","question":"What IPv4 header field identifies the upper layer protocol carried in the packet?","options":["Protocol","Identification","Version","Differentiated Services"],"answer":[0],"explanation":"The Protocol field identifies the upper-layer protocol carried in the IPv4 packet."},{"module":"Communicating Between Networks Exam","question":"What information does the loopback test provide?","options":["The TCP/IP stack on the device is working correctly.","The device has end-to-end connectivity.","DHCP is working correctly.","The Ethernet cable is working correctly.","The device has the correct IP address on the network."],"answer":[0],"explanation":"A loopback test verifies that the local TCP/IP stack is functioning."},{"module":"Communicating Between Networks Exam","question":"What routing table entry has a next hop address associated with a destination network?","options":["directly-connected routes","local routes","remote routes","C and L source routes"],"answer":[2],"explanation":"Remote route entries include a next-hop address."},{"module":"Communicating Between Networks Exam","question":"How do hosts ensure that their packets are directed to the correct network destination?","options":["They have to keep their own local routing table that contains a route to the loopback interface, a local network route, and a remote default route.","They always direct their packets to the default gateway, which will be responsible for the packet delivery.","They search in their own local routing table for a route to the network destination address and pass this information to the default gateway.","They send a query packet to the default gateway asking for the best route."],"answer":[0],"explanation":"Hosts use their local routing table, including local and default routes, to choose where to send packets."},{"module":"Communicating Between Networks Exam","question":"When transporting data from real-time applications, such as streaming audio and video, which field in the IPv6 header can be used to inform the routers and switches to maintain the same path for the packets in the same conversation?","options":["Next Header","Flow Label","Traffic Class","Differentiated Services"],"answer":[1],"explanation":"The IPv6 Flow Label field can identify packets in the same flow for special handling."},{"module":"Communicating Between Networks Exam","question":"What statement describes the function of the Address Resolution Protocol?","options":["ARP is used to discover the IP address of any host on a different network.","ARP is used to discover the IP address of any host on the local network.","ARP is used to discover the MAC address of any host on a different network.","ARP is used to discover the MAC address of any host on the local network."],"answer":[3],"explanation":"ARP resolves the MAC address of a known IPv4 address on the local network."},{"module":"Communicating Between Networks Exam","question":"Under which two circumstances will a switch flood a frame out of every port except the port that the frame was received on? (Choose two.)","options":["The frame has the broadcast address as the destination address.","The destination address is unknown to the switch.","The source address in the frame header is the broadcast address.","The source address in the frame is a multicast address.","The destination address in the frame is a known unicast address."],"answer":[0,1],"explanation":"A switch floods broadcast frames and unknown unicast frames."},{"module":"Communicating Between Networks Exam","question":"Which statement describes the treatment of ARP requests on the local link?","options":["They must be forwarded by all routers on the local network.","They are received and processed by every device on the local network.","They are dropped by all switches on the local network.","They are received and processed only by the target device."],"answer":[1],"explanation":"ARP requests are broadcasts, so all devices on the local link receive and process them."},{"module":"Communicating Between Networks Exam","question":"Which destination address is used in an ARP request frame?","options":["0.0.0.0","255.255.255.255","cccc.cccc.cccc","AAAA.AAAA.AAAA","the physical address of the destination host"],"answer":[2],"explanation":"An ARP request is sent using a Layer 2 broadcast destination MAC address."},{"module":"Communicating Between Networks Exam","question":"A network technician issues the arp -d * command on a PC after the router that is connected to the LAN is reconfigured. What is the result after this command is issued?","options":["The ARP cache is cleared.","The current content of the ARP cache is displayed.","The detailed information of the ARP cache is displayed.","The ARP cache is synchronized with the router interface."],"answer":[0],"explanation":"The arp -d * command clears the ARP cache."},{"module":"Communicating Between Networks Exam","question":"Refer to the exhibit. PC1 has sent a frame addressed to PC3, and the MAC address of PC3 is not present in the switch MAC address table. What will the switch do with the frame?","options":["The switch will discard the frame.","The switch will forward the frame only to port 2.","The switch will forward the frame to all ports except port 4.","The switch will forward the frame to all ports.","The switch will forward the frame only to ports 1 and 3."],"answer":[2],"explanation":"Because the destination MAC is unknown, the switch floods the frame out all ports except the incoming port."},{"module":"Communicating Between Networks Exam","question":"Which two types of IPv6 messages are used in place of ARP for address resolution?","options":["anycast","broadcast","echo reply","echo request","neighbor solicitation","neighbor advertisement"],"answer":[4,5],"explanation":"IPv6 Neighbor Discovery uses Neighbor Solicitation and Neighbor Advertisement messages for address resolution."},{"module":"Communicating Between Networks Exam","question":"What is the aim of an ARP spoofing attack?","options":["to flood the network with ARP reply broadcasts","to fill switch MAC address tables with bogus addresses","to associate IP addresses to the wrong MAC address","to overwhelm network hosts with ARP requests"],"answer":[2],"explanation":"ARP spoofing associates an IP address with the attacker's MAC address or another incorrect MAC address."},{"module":"Communicating Between Networks Exam","question":"Refer to the exhibit. PC1 attempts to connect to File_server1 and sends an ARP request to obtain a destination MAC address. Which MAC address will PC1 receive in the ARP reply?","options":["the MAC address of S1","the MAC address of the G0/0 interface on R1","the MAC address of the G0/0 interface on R2","the MAC address of S2","the MAC address of File_server1"],"answer":[1],"explanation":"For a remote destination, PC1 resolves the MAC address of its default gateway, the G0/0 interface on R1."},{"module":"Communicating Between Networks Exam","question":"Where are IPv4 address to Layer 2 Ethernet address mappings maintained on a host computer?","options":["neighbor table","ARP cache","routing table","MAC address table"],"answer":[1],"explanation":"A host stores IPv4-to-MAC mappings in its ARP cache."},{"module":"Communicating Between Networks Exam","question":"What important information is examined in the Ethernet frame header by a Layer 2 device in order to forward the data onward?","options":["source MAC address","source IP address","destination MAC address","Ethernet type","destination IP address"],"answer":[2],"explanation":"A Layer 2 switch forwards frames based on the destination MAC address."},{"module":"Communicating Between Networks Exam","question":"A new network administrator has been asked to enter a banner message on a Cisco device. What is the fastest way a network administrator could test whether the banner is properly configured?","options":["Reboot the device.","Enter CTRL-Z at the privileged mode prompt.","Exit global configuration mode.","Power cycle the device.","Exit privileged EXEC mode and press Enter."],"answer":[4],"explanation":"Exiting privileged EXEC mode and pressing Enter displays the login banner without rebooting."},{"module":"Communicating Between Networks Exam","question":"What are two functions of NVRAM? (Choose two.)","options":["to store the routing table","to retain contents when power is removed","to store the startup configuration file","to contain the running configuration file","to store the ARP table"],"answer":[1,2],"explanation":"NVRAM is nonvolatile and stores the startup configuration file."},{"module":"Communicating Between Networks Exam","question":"A router boots and enters setup mode. What is the reason for this?","options":["The IOS image is corrupt.","Cisco IOS is missing from flash memory.","The configuration file is missing from NVRAM.","The POST process has detected hardware failure."],"answer":[2],"explanation":"A router enters setup mode when it cannot locate a startup configuration file in NVRAM."},{"module":"Communicating Between Networks Exam","question":"The global configuration command ip default-gateway 172.16.100.1 is applied to a switch. What is the effect of this command?","options":["The switch will have a management interface with the address 172.16.100.1.","The switch can be remotely managed from a host on another network.","The switch can communicate with other hosts on the 172.16.100.0 network.","The switch is limited to sending and receiving frames to and from the gateway 172.16.100.1."],"answer":[1],"explanation":"A switch default gateway allows management traffic from the switch to reach remote networks."},{"module":"Communicating Between Networks Exam","question":"What happens when the transport input ssh command is entered on the switch vty lines?","options":["The SSH client on the switch is enabled.","Communication between the switch and remote users is encrypted.","The switch requires a username/password combination for remote access.","The switch requires remote connections via a proprietary client software."],"answer":[1],"explanation":"Configuring transport input ssh restricts VTY access to
