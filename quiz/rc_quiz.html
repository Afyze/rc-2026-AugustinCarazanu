onger necessary?","options":["The virtually unlimited availability of IPv6 addresses","The use of CSMA/CA","The use of full-duplex capable Layer 2 switches","The development of half-duplex switch operation","The use of Gigabit Ethernet speeds"],"answer":[2],"explanation":"Full-duplex switched Ethernet eliminates collisions, so CSMA/CD is no longer needed."},{"module":"Ethernet Switching","question":"Which two characteristics describe Ethernet technology? (Choose two.)","options":["It is supported by IEEE 802.3 standards.","It is supported by IEEE 802.5 standards.","It typically uses an average of 16 Mbps for data transfer rates.","It uses unique MAC addresses to ensure that data is sent to the appropriate destination.","It uses a ring topology."],"answer":[0,3],"explanation":"Ethernet is defined by IEEE 802.3 and uses unique MAC addresses for Layer 2 delivery."},{"module":"Ethernet Switching","question":"What statement describes a characteristic of MAC addresses?","options":["They must be globally unique.","They are only routable within the private network.","They are added as part of a Layer 3 PDU.","They have a 32-bit binary value."],"answer":[0],"explanation":"MAC addresses are intended to be globally unique identifiers assigned to network interfaces."},{"module":"Ethernet Switching","question":"What is the special value assigned to the first 24 bits of a multicast MAC address transporting an IPv4 packet?","options":["01-5E-00","FF-00-5E","FF-FF-FF","01-00-5E"],"answer":[3],"explanation":"IPv4 multicast MAC addresses begin with the 24-bit prefix 01-00-5E."},{"module":"Ethernet Switching","question":"What will a host on an Ethernet network do if it receives a frame with a unicast destination MAC address that does not match its own MAC address?","options":["It will discard the frame.","It will forward the frame to the next host.","It will remove the frame from the media.","It will strip off the data-link frame to check the destination IP address."],"answer":[0],"explanation":"A host discards unicast Ethernet frames that are not addressed to its MAC address."},{"module":"Ethernet Switching","question":"Which network device makes forwarding decisions based on the destination MAC address that is contained in the frame?","options":["Repeater","Hub","Switch","Router"],"answer":[2],"explanation":"A switch forwards frames based on destination MAC addresses."},{"module":"Ethernet Switching","question":"Which network device has the primary function to send data to a specific destination based on the information found in the MAC address table?","options":["Hub","Router","Switch","Modem"],"answer":[2],"explanation":"A switch uses its MAC address table to send frames toward a specific destination port."},{"module":"Ethernet Switching","question":"Which function or operation is performed by the LLC sublayer?","options":["It performs data encapsulation.","It communicates with upper protocol layers.","It is responsible for media access control.","It adds a header and trailer to a packet to form an OSI Layer 2 PDU."],"answer":[1],"explanation":"The LLC sublayer communicates with upper protocol layers and identifies the encapsulated protocol."},{"module":"Ethernet Switching","question":"What happens to runt frames received by a Cisco Ethernet switch?","options":["The frame is dropped.","The frame is returned to the originating network device.","The frame is broadcast to all other devices on the same network.","The frame is sent to the default gateway."],"answer":[0],"explanation":"Runt frames are smaller than the minimum Ethernet frame size and are dropped."},{"module":"Ethernet Switching","question":"What addressing information is recorded by a switch to build its MAC address table?","options":["The destination Layer 3 address of incoming packets","The destination Layer 2 address of outgoing frames","The source Layer 3 address of outgoing packets","The source Layer 2 address of incoming frames"],"answer":[3],"explanation":"Switches learn MAC address table entries from the source Layer 2 address of incoming frames."},{"module":"Ethernet Switching","question":"What is auto-MDIX?","options":["A type of Cisco switch","An Ethernet connector type","A feature to automatically determine speed and duplex","A feature that detects Ethernet cable type"],"answer":[3],"explanation":"Auto-MDIX detects whether a straight-through or crossover Ethernet cable is needed."},{"module":"Ethernet Switching","question":"What type of address is 01-00-5E-0A-00-02?","options":["An address that reaches every host inside a local subnet","An address that reaches one specific host","An address that reaches every host in the network","An address that reaches a specific group of hosts"],"answer":[3],"explanation":"01-00-5E identifies an IPv4 multicast MAC address, which reaches a specific group of hosts."},{"module":"Ethernet Switching","question":"Which statement is true about MAC addresses?","options":["MAC addresses are implemented by software.","A NIC only needs a MAC address if connected to a WAN.","The first three bytes are used by the vendor assigned OUI.","The ISO is responsible for MAC addresses regulations."],"answer":[2],"explanation":"The first three bytes of a MAC address are the vendor OUI assigned by IEEE."},{"module":"Ethernet Switching","question":"What are the two sizes (minimum and expected maximum) of an Ethernet frame? (Choose two.)","options":["56 bytes","64 bytes","128 bytes","1024 bytes","1518 bytes"],"answer":[1,4],"explanation":"The minimum Ethernet frame size is 64 bytes and the standard maximum is 1518 bytes."},{"module":"Ethernet Switching","question":"Which two functions or operations are performed by the MAC sublayer? (Choose two.)","options":["It is responsible for Media Access Control.","It performs the function of NIC driver software.","It adds a header and trailer to form an OSI Layer 2 PDU.","It handles communication between upper and lower layers.","It adds control information to network protocol layer data."],"answer":[0,2],"explanation":"The MAC sublayer controls media access and adds the Ethernet header and trailer to create the Layer 2 frame."},{"module":"Network Layer","question":"Which command can be used on a Windows host to display the routing table?","options":["netstat -s","show ip route","netstat -r","tracert"],"answer":[2],"explanation":"On Windows, netstat -r displays the routing table."},{"module":"Network Layer","question":"What information is added during encapsulation at OSI Layer 3?","options":["Source and destination MAC","Source and destination application protocol","Source and destination port number","Source and destination IP address"],"answer":[3],"explanation":"Layer 3 encapsulation adds source and destination IP addresses."},{"module":"Network Layer","question":"How does the network layer use the MTU value?","options":["The network layer depends on the higher level layers to determine the MTU.","The network layer depends on the data link layer to set the MTU, and adjusts the speed of transmission to accommodate it.","The MTU is passed to the network layer by the data link layer.","To increase speed of delivery, the network layer ignores the MTU."],"answer":[2],"explanation":"The data link layer provides the MTU to the network layer so packet size can be handled appropriately."},{"module":"Network Layer","question":"Which characteristic describes an IPv6 enhancement over IPv4?","options":["IPv6 addresses are based on 128-bit flat addressing as opposed to IPv4 which is based on 32-bit hierarchical addressing.","The IPv6 header is simpler than the IPv4 header is, which improves packet handling.","Both IPv4 and IPv6 support authentication, but only IPv6 supports privacy capabilities.","The IPv6 address space is four times bigger than the IPv4 address space."],"answer":[1],"explanation":"IPv6 has a simpler header than IPv4, which improves packet handling."},{"module":"Network Layer","question":"Which statement accurately describes a characteristic of IPv4?","options":["All IPv4 addresses are assignable to hosts.","IPv4 has a 32-bit address space.","An IPv4 header has fewer fields than an IPv6 header has.","IPv4 natively supports IPsec."],"answer":[1],"explanation":"IPv4 uses a 32-bit address space."},{"module":"Network Layer","question":"When a router receives a packet, what information must be examined in order for the packet to be forwarded to a remote destination?","options":["Destination MAC address","Source IP address","Destination IP address","Source MAC address"],"answer":[2],"explanation":"Routers examine the destination IP address to forward packets."},{"module":"Network Layer","question":"A computer has to send a packet to a destination host in the same LAN. How will the packet be sent?","options":["The packet will be sent to the default gateway first, and then, depending on the response from the gateway, it may be sent to the destination host.","The packet will be sent directly to the destination host.","The packet will first be sent to the default gateway, and then from the default gateway it will be sent directly to the destination host.","The packet will be sent only to the default gateway."],"answer":[1],"explanation":"A packet destined for a host on the same LAN is sent directly to that host."},{"module":"Network Layer","question":"Which IPv4 address can a host use to ping the loopback interface?","options":["126.0.0.1","127.0.0.0","126.0.0.0","127.0.0.1"],"answer":[3],"explanation":"127.0.0.1 is the commonly used IPv4 loopback address."},{"module":"Network Layer","question":"When a connectionless protocol is in use at a lower layer of the OSI model, how is missing data detected and retransmitted if necessary?","options":["Connectionless acknowledgements are used to request retransmission.","Upper-layer connection-oriented protocols keep track of the data received and can request retransmission from the upper-level protocols on the sending host.","Network layer IP protocols manage the communication sessions if connection-oriented transport services are not available.","The best-effort delivery process guarantees that all packets that are sent are received."],"answer":[1],"explanation":"Reliability for a lower-layer connectionless protocol is provided by upper-layer connection-oriented protocols such as TCP."},{"module":"Network Layer","question":"What was the reason for the creation and implementation of IPv6?","options":["To make reading a 32-bit address easier","To relieve IPv4 address depletion","To provide more address space in the Internet Names Registry","To allow NAT support for private addressing"],"answer":[1],"explanation":"IPv6 was created to relieve IPv4 address depletion."},{"module":"Network Layer","question":"Which information is used by routers to forward a data packet toward its destination?","options":["Source IP address","Destination IP address","Source data-link address","Destination data-link address"],"answer":[1],"explanation":"Routers use the destination IP address to forward packets."},{"module":"Network Layer","question":"Which field in an IPv4 packet header will typically stay the same during its transmission?","options":["Flag","Time-to-Live","Packet Length","Destination Address"],"answer":[3],"explanation":"The destination IP address normally remains unchanged during packet transmission."},{"module":"Network Layer","question":"Which field in an IPv6 packet is used by the router to determine if a packet has expired and should be dropped?","options":["TTL","Hop Limit","Address Unreachable","No Route to Destination"],"answer":[1],"explanation":"IPv6 uses the Hop Limit field to prevent packets from circulating indefinitely."},{"module":"Address Resolution","question":"Which router component holds the routing table, ARP cache, and running configuration file?","options":["RAM","Flash","NVRAM","ROM"],"answer":[0],"explanation":"RAM stores the routing table, ARP cache, and running configuration."},{"module":"Address Resolution","question":"What type of information is contained in an ARP table?","options":["Switch ports associated with destination MAC addresses","Domain name to IPv4 address mappings","Routes to reach destination networks","IPv4 address to MAC address mappings"],"answer":[3],"explanation":"An ARP table maps IPv4 addresses to MAC addresses."},{"module":"Address Resolution","question":"A PC is configured to obtain an IPv4 address automatically from network 192.168.1.0/24. The network administrator issues the arp -a command and notices an entry of 192.168.1.255 ff-ff-ff-ff-ff-ff. Which statement describes this entry?","options":["This is a static map entry.","This is a dynamic map entry.","This entry refers to the PC itself.","This entry maps to the default gateway."],"answer":[0],"explanation":"The subnet broadcast IPv4 address maps to the broadcast MAC address as a static entry."},{"module":"Address Resolution","question":"A cybersecurity analyst believes an attacker is spoofing the MAC address of the default gateway to perform a man-in-the-middle attack. Which command should the analyst use to view the MAC address a host is using to reach the default gateway?","options":["ipconfig /all","route print","netstat -r","arp -a"],"answer":[3],"explanation":"The arp -a command displays IP-to-MAC mappings in the ARP table."},{"module":"Address Resolution","question":"What will a Layer 2 switch do when the destination MAC address of a received frame is not in the MAC table?","options":["It initiates an ARP request.","It broadcasts the frame out of all ports on the switch.","It notifies the sending host that the frame cannot be delivered.","It forwards the frame out of all ports except for the port at which the frame was received."],"answer":[3],"explanation":"A switch floods unknown unicast frames out all ports except the receiving port."},{"module":"Address Resolution","question":"Which two ICMPv6 messages are used during the Ethernet MAC address resolution process? (Choose two.)","options":["Router solicitation","Router advertisement","Neighbor solicitation","Neighbor advertisement","Echo request"],"answer":[2,3],"explanation":"IPv6 Neighbor Discovery uses Neighbor Solicitation and Neighbor Advertisement for MAC address resolution."},{"module":"Address Resolution","question":"How does the ARP process use an IPv4 address?","options":["To determine the MAC address of the remote destination host","To determine the MAC address of a device on the same network","To determine the amount of time a packet takes when traveling from source to destination","To determine the network number based on the number of bits in the IPv4 address"],"answer":[1],"explanation":"ARP uses a known IPv4 address to determine the MAC address of a device on the same network."},{"module":"Address Resolution","question":"What is one function of the ARP protocol?","options":["Obtaining an IPv4 address automatically","Mapping a domain name to its IP address","Resolving an IPv4 address to a MAC address","Maintaining a table of domain names with their resolved IP addresses"],"answer":[2],"explanation":"ARP resolves IPv4 addresses to MAC addresses."},{"module":"Address Resolution","question":"Which action is taken by a Layer 2 switch when it receives a Layer 2 broadcast frame?","options":["It drops the frame.","It sends the frame to all ports except the port on which it received the frame.","It sends the frame to all ports that are registered to forward broadcasts.","It sends the frame to all ports."],"answer":[1],"explanation":"A Layer 2 switch floods a broadcast frame out all ports except the port on which it was received."},{"module":"Address Resolution","question":"What addresses are mapped by ARP?","options":["IPv4 address to a destination MAC address","Destination IPv4 address to the source MAC address","Destination IPv4 address to the destination host name","Destination MAC address to the source IPv4 address"],"answer":[0],"explanation":"ARP maps an IPv4 address to the corresponding destination MAC address."},{"module":"Address Resolution","question":"When an IPv4 packet is sent to a host on a remote network, what information is provided by ARP?","options":["The IPv4 address of the destination host","The IPv4 address of the default gateway","The MAC address of the router interface closest to the sending host","The MAC address of the switch port that connects to the sending host"],"answer":[2],"explanation":"For remote destinations, ARP resolves the MAC address of the local router interface."},{"module":"Address Resolution","question":"The ARP table in a switch maps which two types of address together?","options":["Layer 3 address to a Layer 2 address","Layer 3 address to a Layer 4 address","Layer 4 address to a Layer 2 address","Layer 2 address to a Layer 4 address"],"answer":[0],"explanation":"ARP maps Layer 3 IPv4 addresses to Layer 2 MAC addresses."},{"module":"Address Resolution","question":"What is the purpose of ARP in an IPv4 network?","options":["To forward data onward based on the destination IP address","To obtain a specific MAC address when an IP address is known","To forward data onward based on the destination MAC address.","To build the MAC address table in a switch from the information that is gathered"],"answer":[1],"explanation":"ARP obtains a MAC address when the IPv4 address is known."},{"module":"Address Resolution","question":"Which destination address is used in an ARP request frame?","options":["0.0.0.0","255.255.255.255","FFFF.FFFF.FFFF","127.0.0.1","01-00-5E-00-AA-23"],"answer":[2],"explanation":"ARP requests use the Ethernet broadcast destination MAC address FFFF.FFFF.FFFF."},{"module":"Basic Router Configuration","question":"A router boots and enters setup mode. What is the reason for this?","options":["The IOS image is corrupt.","Cisco IOS is missing from flash memory.","The configuration file is missing from NVRAM.","The POST process has detected hardware failure."],"answer":[2],"explanation":"A router enters setup mode when no valid startup configuration is found in NVRAM."},{"module":"Basic Router Configuration","question":"Which command is used to encrypt all passwords in a router configuration file?","options":["Router_A (config) # enable secret <password>","Router_A (config) # service password-encryption","Router_A (config) # enable password <password>","Router_A (config) # encrypt password"],"answer":[1],"explanation":"The service password-encryption command encrypts plain-text passwords in the configuration."},{"module":"Basic Router Configuration","question":"Company policy requires using the most secure method to safeguard access to the privileged exec and configuration mode on the routers. The privileged exec password is trustknow1. Which of the following router commands achieves the goal of providing the highest level of security?","options":["secret password trustknow1","enable password trustknow1","service password-encryption","enable secret trustknow1"],"answer":[3],"explanation":"The enable secret command stores the privileged EXEC password using a stronger hash than enable password."},{"module":"Basic Router Configuration","question":"What will be the response from the router after the command, \"router(config)# hostname portsmouth\" is entered?","options":["portsmouth#","portsmouth(config)#","invalid input detected","router(config-host)#","hostname = portsmouth","portsmouth#","? command not recognized","router(config)#"],"answer":[1],"explanation":"After setting the hostname in global configuration mode, the prompt changes to portsmouth(config)#."},{"module":"Basic Router Configuration","question":"An administrator is configuring a new router to permit out-of-band management access. Which set of commands will allow the required login using a password of cisco?","options":["Router(config)# line vty 0 4\nRouter(config-line)# password manage\nRouter(config-line)# exit\nRouter(config)# enable password cisco","Router(config)# line vty 0 4\nRouter(config-line)# password cisco\nRouter(config-line)# login","Router(config)# line console 0\nRouter(config-line)# password cisco\nRouter(config-line)# login","Router(config)# line console 0\nRouter(config-line)# password cisco\nRouter(config-line)# exit\nRouter(config)# service password-encryption"],"answer":[2],"explanation":"Out-of-band management uses the console line, so line console 0, password cisco, and login are required."},{"module":"Basic Router Configuration","question":"Which command can be used on a Cisco router to display all interfaces, the IPv4 address assigned, and the current status?","options":["show ip interface brief","ping","show ip route","show interface fa0/1"],"answer":[0],"explanation":"show ip interface brief displays all interfaces, IP addresses, and interface status."},{"module":"Basic Router Configuration","question":"Which CLI mode allows users to access all device commands, such as those used for configuration, management, and troubleshooting?","options":["User EXEC mode","Privileged EXEC mode","Global configuration mode","Interface configuration mode"],"answer":[1],"explanation":"Privileged EXEC mode provides access to all device commands and configuration modes."},{"module":"Basic Router Configuration","question":"What is the purpose of the startup configuration file on a Cisco router?","options":["To facilitate the basic operation of the hardware components of a device","To contain the commands that are used to initially configure a router on startup","To contain the configuration commands that the router IOS is currently using","To provide a limited backup version of the IOS, in case the router cannot load the full featured IOS"],"answer":[1],"explanation":"The startup configuration in NVRAM contains the saved commands loaded when the router starts."},{"module":"Basic Router Configuration","question":"Which characteristic describes the default gateway of a host computer?","options":["The logical address of the router interface on the same network as the host computer","The physical address of the switch interface connected to the host computer","The physical address of the router interface on the same network as the host computer","The logical address assigned to the switch interface connected to the router"],"answer":[0],"explanation":"The default gateway is the IP address of the router interface on the same network as the host."},{"module":"Basic Router Configuration","question":"What is the purpose of the banner motd command?","options":["It configures a message that will identify printed documents to LAN users.","It is a way that routers communicate the status of their links with one another.","It provides an easy way of communicating with any user attached to a router's LANs.","It provides a way to make announcements to those who log in to a router."],"answer":[3],"explanation":"banner motd displays a message to users who connect to the router."},{"module":"Basic Router Configuration","question":"A technician is configuring a router to allow for all forms of management access. As part of each different type of access, the technician is trying to type the command login. Which configuration mode should be entered to do this task?","options":["User executive mode","Global configuration mode","Any line configuration mode","Privileged EXEC mode"],"answer":[2],"explanation":"The login command is entered under line configuration modes such as console, vty, or aux."},{"module":"Basic Router Configuration","question":"What is stored in the NVRAM of a Cisco router?","options":["The Cisco IOS","The running configuration","The bootup instructions","The startup configuration"],"answer":[3],"explanation":"NVRAM stores the startup configuration."},{"module":"Basic Router Configuration","question":"Which statement regarding the service password-encryption command is true?","options":["It is configured in privileged EXEC mode.","It encrypts only line mode passwords.","As soon as the service password-encryption command is entered, all currently set passwords formerly displayed in plain text are encrypted.","To see the passwords encrypted by the service password-encryption command in plain text, issue the no service password-encryption command."],"answer":[2],"explanation":"service password-encryption immediately encrypts existing plain-text passwords in the configuration."},{"module":"IPv4 Addressing","question":"What is the prefix length notation for the subnet mask 255.255.255.224?","options":["/25","/26","/27","/28"],"answer":[2],"explanation":"255.255.255.224 has 27 binary 1 bits, so the prefix length is /27."},{"module":"IPv4 Addressing","question":"How many valid host addresses are available on an IPv4 subnet that is configured with a /26 mask?","options":["254","190","192","62","64"],"answer":[3],"explanation":"A /26 leaves 6 host bits, giving 64 total addresses and 62 usable host addresses."},{"module":"IPv4 Addressing","question":"Which subnet mask would be used if 5 host bits are available?","options":["255.255.255.0","255.255.255.128","255.255.255.224","255.255.255.240"],"answer":[2],"explanation":"Five host bits means a /27 prefix, which is 255.255.255.224."},{"module":"IPv4 Addressing","question":"A network administrator subnets the 192.168.10.0/24 network into subnets with /26 masks. How many equal-sized subnets are created?","options":["1","2","4","8","16","64"],"answer":[2],"explanation":"Changing /24 to /26 borrows 2 bits, creating 2^2 = 4 subnets."},{"module":"IPv4 Addressing","question":"What subnet mask is represented by the slash notation /20?","options":["255.255.255.248","255.255.224.0","255.255.240.0","255.255.255.0","255.255.255.192"],"answer":[2],"explanation":"A /20 prefix corresponds to 255.255.240.0."},{"module":"IPv4 Addressing","question":"Which statement is true about variable-length subnet masking?","options":["Each subnet is the same size.","The size of each subnet may be different, depending on requirements.","Subnets may only be subnetted one additional time.","Bits are returned, rather than borrowed, to create additional subnets."],"answer":[1],"explanation":"VLSM allows subnets of different sizes based on requirements."},{"module":"IPv4 Addressing","question":"Why does a Layer 3 device perform the ANDing process on a destination IP address and subnet mask?","options":["To identify the broadcast address of the destination network","To identify the host address of the destination host","To identify faulty frames","To identify the network address of the destination network"],"answer":[3],"explanation":"ANDing an IP address with a subnet mask identifies the network address."},{"module":"IPv4 Addressing","question":"How many usable IP addresses are available on the 192.168.1.0/27 network?","options":["256","254","62","30","16","32"],"answer":[3],"explanation":"A /27 subnet has 32 total addresses and 30 usable host addresses."},{"module":"IPv4 Addressing","question":"Which subnet mask would be used if exactly 4 host bits are available?","options":["255.255.255.224","255.255.255.128","255.255.255.240","255.255.255.248"],"answer":[2],"explanation":"Four host bits means a /28 prefix, which is 255.255.255.240."},{"module":"IPv4 Addressing","question":"Which two parts are components of an IPv4 address? (Choose two.)","options":["Subnet portion","Network portion","Logical portion","Host portion","Physical portion","Broadcast portion"],"answer":[1,3],"explanation":"An IPv4 address has a network portion and a host portion."},{"module":"IPv4 Addressing","question":"If a network device has a mask of /26, how many IP addresses are available for hosts on this network?","options":["64","30","62","32","16","14"],"answer":[2],"explanation":"A /26 leaves 6 host bits, giving 62 usable host addresses."},{"module":"IPv4 Addressing","question":"What does the IP address 172.17.4.250/24 represent?","options":["Network address","Multicast address","Host address","Broadcast address"],"answer":[2],"explanation":"172.17.4.250 is within the usable host range of 172.17.4.0/24."},{"module":"IPv4 Addressing","question":"If a network device has a mask of /28, how many IP addresses are available for hosts on this network?","options":["256","254","62","32","16","14"],"answer":[5],"explanation":"A /28 leaves 4 host bits, giving 16 total addresses and 14 usable host addresses."},{"module":"IPv4 Addressing","question":"What is the purpose of the subnet mask in conjunction with an IP address?","options":["To uniquely identify a host on a network","To identify whether the address is public or private","To determine the subnet to which the host belongs","To mask the IP address to outsiders"],"answer":[2],"explanation":"The subnet mask determines which subnet an IP address belongs to."},{"module":"IPv4 Addressing","question":"A network administrator is variably subnetting a network. The smallest subnet has a mask of 255.255.255.224. How many usable host addresses will this subnet provide?","options":["2","6","14","30","62"],"answer":[3],"explanation":"255.255.255.224 is /27, which provides 30 usable host addresses."},{"module":"IPv6 Addressing","question":"What is the valid most compressed format possible of the IPv6 address 2001:0DB8:0000:AB00:0000:0000:0000:1234?","options":["2001:DB8:0:AB00::1234","2001:DB8:0:AB::1234","2001:DB8::AB00::1234","2001:DB8:0:AB:0:1234"],"answer":[0],"explanation":"The address compresses to 2001:DB8:0:AB00::1234 by removing leading zeros and compressing the longest zero run."},{"module":"IPv6 Addressing","question":"What is the prefix associated with the IPv6 address 2001:DB8:D15:EA:CC44::1/64?","options":["2001::/64","2001:DB8::/64","2001:DB8:D15:EA::/64","2001:DB8:D15:EA:CC44::/64"],"answer":[2],"explanation":"With a /64 prefix, the first four hextets are the network prefix: 2001:DB8:D15:EA::/64."},{"module":"IPv6 Addressing","question":"What type of address is automatically assigned to an interface when IPv6 is enabled on that interface?","options":["Global unicast","Link-local","Loopback","Unique local"],"answer":[1],"explanation":"An IPv6-enabled interface automatically has a link-local address."},{"module":"IPv6 Addressing","question":"Which IPv6 network prefix is only intended for local links and can not be routed?","options":["2001::/3","FC00::/7","FE80::/10","FF00::/12"],"answer":[2],"explanation":"FE80::/10 is reserved for IPv6 link-local addresses."},{"module":"IPv6 Addressing","question":"What is the purpose of the command ping ::1?","options":["It tests the internal configuration of an IPv6 host.","It tests the broadcast capability of all hosts on the subnet.","It tests the multicast connectivity to all hosts on the subnet.","It tests the reachability of the default gateway for the network."],"answer":[0],"explanation":"ping ::1 tests the local IPv6 stack using the IPv6 loopback address."},{"module":"IPv6 Addressing","question":"What is the interface ID of the IPv6 address 2001:DB8::1000:A9CD:47FF:FE57:FE94/64?","options":["FE94","FE57:FE94","47FF:FE57:FE94","A9CD:47FF:FE57:FE94","1000:A9CD:47FF:FE57:FE94"],"answer":[3],"explanation":"With a /64 prefix, the interface ID is the last 64 bits: A9CD:47FF:FE57:FE94."},{"module":"IPv6 Addressing","question":"What is the network address for the IPv6 address 2001:DB8:AA04:B5::1/64?","options":["2001::/64","2001:DB8::/64","2001:DB8:AA04::/64","2001:DB8:AA04:B5::/64"],"answer":[3],"explanation":"With a /64 prefix, the first four hextets define the network: 2001:DB8:AA04:B5::/64."},{"module":"IPv6 Addressing","question":"Which address type is not supported in IPv6?","options":["Private","Multicast","Unicast","Broadcast"],"answer":[3],"explanation":"IPv6 does not use broadcast addresses."},{"module":"IPv6 Addressing","question":"What is indicated by a successful ping to the ::1 IPv6 address?","options":["The host is cabled properly.","The default gateway address is correctly configured.","All hosts on the local link are available.","The link-local address is correctly configured.","IP is properly installed on the host."],"answer":[4],"explanation":"A successful ping to ::1 confirms the local IPv6 stack is installed and functioning."},{"module":"IPv6 Addressing","question":"What is the most compressed representation of the IPv6 address 2001:0db8:0000:abcd:0000:0000:0000:0001?","options":["2001:0db8:abcd::1","2001:db8:0:abcd::1","2001:0db8:abcd::0001","2001:0db8:0000:abcd::1","2001:db8::abcd:0:1"],"answer":[1],"explanation":"The most compressed form is 2001:db8:0:abcd::1."},{"module":"IPv6 Addressing","question":"What is the minimum configuration for a router interface that is enabled for IPv6?","options":["To have a link-local IPv6 address","To have both an IPv4 and an IPv6 address","To have a self-generated loopback address","To have both a link-local and a global unicast IPv6 address"],"answer":[0],"explanation":"An IPv6-enabled router interface must at least have a link-local IPv6 address."},{"module":"IPv6 Addressing","question":"At a minimum, which address is required on IPv6-enabled interfaces?","options":["Link-local","Unique local","Site local","Global unicast"],"answer":[0],"explanation":"Every IPv6-enabled interface requires a link-local address."},{"module":"IPv6 Addressing","question":"What are three parts of an IPv6 global unicast address? (Choose three.)","options":["An interface ID that is used to identify the local network for a particular host","A global routing prefix that is used to identify the network portion of the address that has been provided by an ISP","A subnet ID that is used to identify networks inside of the local enterprise site","A global routing prefix that is used to identify the portion of the network address provided by a local administrator","An interface ID that is used to identify the local host on the network"],"answer":[1,2,4],"explanation":"An IPv6 global unicast address includes a global routing prefix, subnet ID, and interface ID."},{"module":"IPv6 Addressing","question":"Your organization is issued the IPv6 prefix of 2001:db8:130f::/48 by your service provider. With this prefix, how many bits are available for your organization to create /64 subnetworks if interface ID bits are not borrowed?","options":["8","16","80","128"],"answer":[1],"explanation":"A /48 prefix leaves 16 bits available before the standard /64 subnet boundary."},{"module":"IPv6 Addressing","question":"Which type of IPv6 address is not routable and used only for communication on a single subnet?","options":["Global unicast address","Link-local address","Loopback address","Unique local address","Unspecified address"],"answer":[1],"explanation":"Link-local IPv6 addresses are not routed and are used only on a single local link."},{"module":"ICMP","question":"A technician is troubleshooting a network where it is suspected that a defective node in the network path is causing packets to be dropped. The technician only has the IP address of the end point device and does not have any details of the intermediate devices. What command can the technician use to identify the faulty node?","options":["tracert","ping","ipconfig /flushdns","ipconfig /displaydns"],"answer":[0],"explanation":"tracert identifies the routers along the path and can help locate where packets are dropped."},{"module":"ICMP","question":"A user who is unable to connect to the file server contacts the help desk. The helpdesk technician asks the user to ping the IP address of the default gateway that is configured on the workstation. What is the purpose for this ping command?","options":["To obtain a dynamic IP address from the server","To request that gateway forward the connection request to the file server","To test that the host has the capability to reach hosts on other networks","To resolve the domain name of the file server to its IP address"],"answer":[2],"explanation":"Pinging the default gateway tests whether the host can reach its first-hop router for remote networks."},{"module":"ICMP","question":"What is a function of the tracert command that differs from the ping command when they are used on a workstation?","options":["The tracert command reaches the destination faster.","The tracert command shows the information of routers in the path.","The tracert command sends one ICMP message to each hop in the path.","The tracert command is used to test the connectivity between two devices."],"answer":[1],"explanation":"tracert shows the routers along the path to the destination."},{"module":"ICMP","question":"Which ICMP message is used by the traceroute utility during the process of finding the path between two end hosts?","options":["Redirect","Ping","Time exceeded","Destination unreachable"],"answer":[2],"explanation":"Traceroute relies on ICMP Time Exceeded messages from intermediate routers."},{"module":"ICMP","question":"Which utility uses the Internet Control Messaging Protocol (ICMP)?","options":["RIP","DNS","Ping","NTP"],"answer":[2],"explanation":"Ping uses ICMP echo request and echo reply messages."},{"module":"ICMP","question":"Which protocol is used by IPv4 and IPv6 to provide error messaging?","options":["ICMP","NDP","ARP","DHCP"],"answer":[0],"explanation":"ICMP provides error messaging for both IPv4 and IPv6."},{"module":"ICMP","question":"A network administrator is testing network connectivity by issuing the ping command on a router. Which symbol will be displayed to indicate that a time expired during the wait for an ICMP echo reply message?","options":["!",".","U","$"],"answer":[1],"explanation":"In Cisco IOS ping output, a dot indicates that the request timed out."},{"module":"ICMP","question":"Which two things can be determined by using the ping command? (Choose two.)","options":["The number of routers between the source and destination device","The IP address of the router nearest the destination device","The average time it takes a packet to reach the destination and for the response to return to the source","The destination device is reachable through the network","The average time it takes each router in the path between source and destination to respond"],"answer":[2,3],"explanation":"Ping shows whether the destination is reachable and the round-trip time."},{"module":"ICMP","question":"A user calls to report that a PC cannot access the internet. The network technician asks the user to issue the command ping 127.0.0.1 in a command prompt window. The user reports that the result is four positive replies. What conclusion can be drawn based on this connectivity test?","options":["The PC can access the network. The problem exists beyond the local network.","The IP address obtained from the DHCP server is correct.","The PC can access the Internet. However, the web browser may not work.","The TCP/IP implementation is functional."],"answer":[3],"explanation":"A successful ping to 127.0.0.1 verifies the local TCP/IP implementation."},{"module":"ICMP","question":"Which command can be used to test connectivity between two devices using echo request and echo reply messages?","options":["netstat","ipconfig","ICMP","ping"],"answer":[3],"explanation":"ping tests connectivity with ICMP echo request and echo reply messages."},{"module":"ICMP","question":"What field content is used by ICMPv6 to determine that a packet has expired?","options":["TTL field","CRC field","Hop Limit field","Time Exceeded field"],"answer":[2],"explanation":"ICMPv6 uses the IPv6 Hop Limit field to determine when a packet has expired."},{"module":"ICMP","question":"Which protocol provides feedback from the destination host to the source host about errors in packet delivery?","options":["ARP","BOOTP","DNS","ICMP"],"answer":[3],"explanation":"ICMP provides packet delivery error feedback."},{"module":"ICMP","question":"A network administrator can successfully ping the server at www.cisco.com, but cannot ping the company web server located at an ISP in another city. Which tool or command would help identify the specific router where the packet was lost or delayed?","options":["ipconfig","netstat","telnet","traceroute"],"answer":[3],"explanation":"traceroute identifies each router along a path and can reveal where packets are lost or delayed."},{"module":"ICMP","question":"What message is sent by a host to check the uniqueness of an IPv6 address before using that address?","options":["Neighbor solicitation","ARP request","Echo request","Router solicitation"],"answer":[0],"explanation":"IPv6 Duplicate Address Detection uses a Neighbor Solicitation message."},{"module":"Transport Layer","question":"Which transport layer feature is used to establish a connection-oriented session?","options":["UDP ACK flag","TCP 3-way handshake","UDP sequence number","TCP port number"],"answer":[1],"explanation":"TCP uses a three-way handshake to establish a connection-oriented session."},{"module":"Transport Layer","question":"What is the complete range of TCP and UDP well-known ports?","options":["0 to 255","0 to 1023","256 - 1023","1024 - 49151"],"answer":[1],"explanation":"Well-known TCP and UDP ports range from 0 through 1023."},{"module":"Transport Layer","question":"What is a socket?","options":["The combination of the source and destination IP address and source and destination Ethernet address","The combination of a source IP address and port number or a destination IP address and port number","The combination of the source and destination sequence and acknowledgment numbers","The combination of the source and destination sequence numbers and port numbers"],"answer":[1],"explanation":"A socket is an IP address and port number combination."},{"module":"Transport Layer","question":"How does a networked server manage requests from multiple clients for different services?","options":["The server sends all requests through a default gateway.","Each request has a combination of source and destination port numbers, coming from a unique IP address.","The server uses IP addresses to identify different services.","Each request is tracked through the physical address of the client."],"answer":[1],"explanation":"Servers track requests by IP addresses and source/destination port numbers."},{"module":"Transport Layer","question":"What happens if part of an FTP message is not delivered to the destination?","options":["The message is lost because FTP does not use a reliable delivery method.","The FTP source host sends a query to the destination host.","The part of the FTP message that was lost is re-sent.","The entire FTP message is re-sent."],"answer":[2],"explanation":"FTP uses TCP, so lost segments are retransmitted."},{"module":"Transport Layer","question":"What type of applications are best suited for using UDP?","options":["Applications that are sensitive to delay","Applications that need reliable delivery","Applications that require retransmission of lost segments","Applications that are sensitive to packet loss"],"answer":[0],"explanation":"UDP is suited for delay-sensitive applications that can tolerate some loss."},{"module":"Transport Layer","question":"Network congestion has resulted in the source learning of the loss of TCP segments that were sent to the destination. What is one way that the TCP protocol addresses this?","options":["The source decreases the amount of data that it transmits before it receives an acknowledgement from the destination.","The source decreases the window size to decrease the rate of transmission from the destination.","The destination decreases the window size.","The destination sends fewer acknowledgement messages in order to conserve bandwidth."],"answer":[0],"explanation":"TCP congestion control reduces the amount of unacknowledged data sent before receiving acknowledgments."},{"module":"Transport Layer","question":"Which two operations are provided by TCP but not by UDP? (Choose two.)","options":["Identifying the applications","Acknowledging received data","Identifying individual conversations","Retransmitting any unacknowledged data","Reconstructing data in the order received"],"answer":[1,3],"explanation":"TCP provides acknowledgments and retransmits unacknowledged data."},{"module":"Transport Layer","question":"What is the purpose of using a source port number in a TCP communication?","options":["To notify the remote device that the conversation is over","To assemble the segments that arrived out of order","To keep track of multiple conversations between devices","To inquire for a nonreceived segment"],"answer":[2],"explanation":"Source port numbers help track multiple simultaneous conversations."},{"module":"Transport Layer","question":"Which two flags in the TCP header are used in a TCP three-way handshake to establish connectivity between two network devices? (Choose two.)","options":["ACK","FIN","PSH","RST","SYN","URG"],"answer":[0,4],"explanation":"The TCP three-way handshake uses SYN and ACK flags."},{"module":"Transport Layer","question":"What TCP mechanism is used to enhance performance by allowing a device to continuously send a steady stream of segments as long as the device is also receiving necessary acknowledgements?","options":["Three-way handshake","Socket pair","Two-way handshake","Sliding window"],"answer":[3],"explanation":"TCP sliding window allows continuous transmission as acknowledgments are received."},{"module":"Transport Layer","question":"Which action is performed by a client when establishing communication with a server via the use of UDP at the transport layer?","options":["The client sets the window size for the session.","The client sends an ISN to the server to start the 3-way handshake.","The client randomly selects a source port number.","The client sends a synchronization segment to begin the session."],"answer":[2],"explanation":"UDP does not establish a session; the client selects a source port and sends data."},{"module":"Transport Layer","question":"Which two services or protocols use the preferred UDP protocol for fast transmission and low overhead? (Choose two)","options":["FTP","DNS","HTTP","POP3","VoIP"],"answer":[1,4],"explanation":"DNS and VoIP commonly use UDP for low overhead and fast transmission."},{"module":"Transport Layer","question":"Which number or set of numbers represents a socket?","options":["01-23-45-67-89-AB","21","192.168.1.1:80","10.1.1.15"],"answer":[2],"explanation":"A socket is represented by an IP address and port number, such as 192.168.1.1:80."},{"module":"Transport Layer","question":"What is a responsibility of transport layer protocols?","options":["Providing network access","Tracking individual conversations","Determining the best path to forward a packet","Translating private IP addresses to public IP addresses"],"answer":[1],"explanation":"Transport layer protocols track individual conversations between applications."},{"module":"Application Layer","question":"On a home network, which device is most likely to provide dynamic IPv4 addressing to clients on the home network?","options":["A dedicated file server","A home router","An ISP DHCP server","A DNS server"],"answer":[1],"explanation":"A home router usually acts as the DHCP server for clients on a home network."},{"module":"Application Layer","question":"What part of the URL, http://www.cisco.com/index.html, represents the top-level DNS domain?","options":[".com","Www","Http","Index"],"answer":[0],"explanation":".com is the top-level domain in the URL."},{"module":"Application Layer","question":"What are two characteristics of the application layer of the TCP/IP model? (Choose two.)","options":["Responsibility for logical addressing","Responsibility for physical addressing","The creation and maintenance of dialogue between source and destination applications","Closest to the end user"],"answer":[2,3],"explanation":"The application layer is closest to the end user and supports dialogue between applications."},{"module":"Application Layer","question":"What message type is used by an HTTP client to request data from a web server?","options":["GET","POST","PUT","ACK"],"answer":[0],"explanation":"HTTP clients use GET to request data from web servers."},{"module":"Application Layer","question":"Which protocol can be used to transfer messages from an email server to an email client?","options":["SMTP","POP3","SNMP","HTTP"],"answer":[1],"explanation":"POP3 retrieves email messages from a mail server to an email client."},{"module":"Application Layer","question":"Which application layer protocol is used to provide file-sharing and print services to Microsoft applications?","options":["HTTP","SMTP","DHCP","SMB"],"answer":[3],"explanation":"SMB provides file and print sharing services for Microsoft applications."},{"module":"Application Layer","question":"Which three protocols or standards are used at the application layer of the TCP/IP model? (Choose three.)","options":["TCP","HTTP","MPEG","GIF","IP","UDP"],"answer":[1,2,3],"explanation":"HTTP, MPEG, and GIF are application layer protocols or standards."},{"module":"Application Layer","question":"Why is DHCP for IPv4 preferred for use on large networks?","options":["Large networks send more requests for domain to IP address resolution than do smaller networks.","DHCP uses a reliable transport layer protocol.","It prevents sharing of files that are copyrighted.","It is a more efficient way to manage IPv4 addresses than static address assignment is.","Hosts on large networks require more IPv4 addressing configuration settings than do hosts on small networks."],"answer":[3],"explanation":"DHCP is more efficient than manual static assignment for managing IPv4 addresses on large networks."},{"module":"Application Layer","question":"An author is uploading one chapter document from a personal computer to a file server of a book publisher. What role is the personal computer assuming in this network model?","options":["Client","Master","Server","Slave","Transient"],"answer":[0],"explanation":"The personal computer is acting as the client because it is requesting a service from the file server."},{"module":"Application Layer","question":"Which statement is true about FTP?","options":["The client can choose if FTP is going to establish one or two connections with the server.","The client can download data from or upload data to the server.","FTP is a peer-to-peer application.","FTP does not provide reliability during data transmission."],"answer":[1],"explanation":"FTP clients can upload data to or download data from a server."},{"module":"Application Layer","question":"A wireless host needs to request an IPv4 address. What protocol would be used to process the request?","options":["FTP","HTTP","DHCP","ICMP","SNMP"],"answer":[2],"explanation":"DHCP processes requests for dynamic IPv4 addressing."},{"module":"Application Layer","question":"Which TCP/IP model layer is closest to the end user?","options":["Application","Internet","Network access","Transport"],"answer":[0],"explanation":"The application layer is closest to the end user."},{"module":"Application Layer","question":"When retrieving email messages, which protocol allows for easy, centralized storage and backup of emails that would be desirable for a small- to medium-sized business?","options":["IMAP","POP","SMTP","HTTPS"],"answer":[0],"explanation":"IMAP keeps email on a centralized server and supports synchronization across clients."},{"module":"Application Layer","question":"Which protocol uses encryption?","options":["DHCP","DNS","FTP","HTTPS"],"answer":[3],"explanation":"HTTPS uses encryption to secure web communication."},{"module":"Application Layer","question":"Which two tasks can be performed by a local DNS server? (Choose two.)","options":["Providing IP addresses to local hosts","Allowing data transfer between two network devices","Mapping name-to-IP addresses for internal hosts","Forwarding name resolution requests between servers","Retrieving email messages"],"answer":[2,3],"explanation":"A local DNS server maps names to IP addresses and can forward unresolved name queries to other DNS servers."},{"module":"Network Security Fundamentals","question":"Which component is designed to protect against unauthorized communications to and from a computer?","options":["Security center","Port scanner","Antimalware","Antivirus","Firewall"],"answer":[4],"explanation":"A firewall filters unauthorized communication to and from a computer or network."},{"module":"Network Security Fundamentals","question":"Which command will block login attempts on RouterA for a period of 30 seconds if there are 2 failed login attempts within 10 seconds?","options":["RouterA(config)# login block-for 10 attempts 2 within 30","RouterA(config)# login block-for 30 attempts 2 within 10","RouterA(config)# login block-for 2 attempts 30 within 10","RouterA(config)# login block-for 30 attempts 10 within 2"],"answer":[1],"explanation":"The syntax is login block-for seconds attempts number within seconds."},{"module":"Network Security Fundamentals","question":"What is the purpose of the network security accounting function?","options":["To require users to prove who they are","To determine which resources a user can access","To keep track of the actions of a user","To provide challenge and response questions"],"answer":[2],"explanation":"Accounting tracks user activity for auditing and reporting."},{"module":"Network Security Fundamentals","question":"What type of attack may involve the use of tools such as nslookup and fping?","options":["Access attack","Reconnaissance attack","Denial of service attack","Worm attack"],"answer":[1],"explanation":"Reconnaissance attacks use tools to gather information about a target network."},{"module":"Network Security Fundamentals","question":"Which benefit does SSH offer over Telnet for remotely managing a router?","options":["Encryption","TCP usage","Authorization","Connections via multiple VTY lines"],"answer":[0],"explanation":"SSH encrypts remote management sessions, unlike Telnet."},{"module":"Network Security Fundamentals","question":"What is one of the most effective security tools available for protecting users from external threats?","options":["Firewalls","Router that run AAA services","Patch servers","Password encryption techniques"],"answer":[0],"explanation":"Firewalls protect users by filtering traffic from external threats."},{"module":"Network Security Fundamentals","question":"Which type of network threat is intended to prevent authorized users from accessing resources?","options":["DoS attacks","Access attacks","Reconnaissance attacks","Trust exploitation"],"answer":[0],"explanation":"DoS attacks attempt to make services unavailable to authorized users."},{"module":"Network Security Fundamentals","question":"Which three services are provided by the AAA framework? (Choose three.)","options":["Accounting","Automation","Authorization","Authentication","Autobalancing","Autoconfiguration"],"answer":[0,2,3],"explanation":"AAA stands for Authentication, Authorization, and Accounting."},{"module":"Network Security Fundamentals","question":"Which malicious code attack is self-contained and tries to exploit a specific vulnerability in a system being attacked?","options":["Virus","Worm","Trojan horse","Social engineering"],"answer":[1],"explanation":"A worm is self-contained and can exploit vulnerabilities without user interaction."},{"module":"Network Security Fundamentals","question":"Some routers and switches in a wiring closet malfunctioned after an air conditioning unit failed. What type of threat does this situation describe?","options":["Configuration","Environmental","Electrical","Maintenance"],"answer":[1],"explanation":"Cooling failure is an environmental threat."},{"module":"Network Security Fundamentals","question":"What does the term vulnerability mean?","options":["A weakness that makes a target susceptible to an attack","A computer that contains sensitive information","A method of attack to exploit a target","A known target or victim machine","A potential threat that a hacker creates"],"answer":[0],"explanation":"A vulnerability is a weakness that can be exploited by an attack."},{"module":"Network Security Fundamentals","question":"What three configuration steps must be performed to implement SSH access to a router? (Choose three.)","options":["A password on the console line","An IP domain name","A user account","An enable mode password","A unique hostname","An encrypted password"],"answer":[1,2,4],"explanation":"SSH requires a unique hostname, an IP domain name, and a local user account before RSA keys can be generated."},{"module":"Network Security Fundamentals","question":"What is the objective of a network reconnaissance attack?","options":["Discovery and mapping of systems","Unauthorized manipulation of data","Disabling network systems or services","Denying access to resources by legitimate users"],"answer":[0],"explanation":"Reconnaissance attacks discover and map systems to prepare for later attacks."},{"module":"Network Security Fundamentals","question":"For security reasons a network administrator needs to ensure that local computers cannot ping each other. Which settings can accomplish this task?","options":["Smartcard settings","Firewall settings","MAC address settings","File system settings"],"answer":[1],"explanation":"Firewall settings can block ICMP echo traffic used by ping."},{"module":"Network Security Fundamentals","question":"A network administrator establishes a connection to a switch via SSH. What characteristic uniquely describes the SSH connection?","options":["Out-of-band access to a switch through the use of a virtual terminal with password authentication","Remote access to the switch through the use of a telephone dialup connection","On-site access to a switch through the use of a directly connected PC and a console cable","Remote access to a switch where data is encrypted during the session","Direct access to the switch through the use of a terminal emulation program"],"answer":[3],"explanation":"SSH provides encrypted remote access to a network device."},{"module":"Build a Small Network","question":"Which network design consideration would be more important to a large corporation than to a small business?","options":["Internet router","Firewall","Low port density switch","Redundancy"],"answer":[3],"explanation":"Large corporations usually need redundancy to maintain high availability."},{"module":"Build a Small Network","question":"A newly hired network technician is given the task of ordering new hardware for a small business with a large growth forecast. Which primary factor should the technician be concerned with when choosing the new devices?","options":["Devices with a fixed number and type of interfaces","Devices that have support for network monitoring","Redundant devices","Devices with support for modularity"],"answer":[3],"explanation":"Modularity supports future growth by allowing device expansion."},{"module":"Build a Small Network","question":"What type of traffic would most likely have the highest priority through the network?","options":["FTP","Instant messaging","Voice","SNMP"],"answer":[2],"explanation":"Voice traffic is delay-sensitive and usually receives the highest priority."},{"module":"Build a Small Network","question":"A network technician is investigating network connectivity from a PC to a remote host with the address 10.1.1.5. Which command, when issued on a Windows PC, will display the path to the remote host?","options":["trace 10.1.1.5","traceroute 10.1.1.5","tracert 10.1.1.5","ping 10.1.1.5"],"answer":[2],"explanation":"On Windows, tracert displays the path to a remote host."},{"module":"Build a Small Network","question":"A user is unable to reach the website when typing http://www.cisco.com in a web browser, but can reach the same site by typing http://72.163.4.161. What is the issue?","options":["Default gateway","DHCP","DNS","TCP/IP protocol stack"],"answer":[2],"explanation":"Reaching a site by IP address but not by name indicates a DNS problem."},{"module":"Build a Small Network","question":"Where are Cisco IOS debug output messages sent by default?","options":["Memory buffers","Vty lines","Syslog server","Console line"],"answer":[3],"explanation":"Cisco IOS debug messages are sent to the console line by default."},{"module":"Build a Small Network","question":"Which element of scaling a network involves identifying the physical and logical topologies?","options":["Traffic analysis","Network documentation","Device inventory","Cost analysis"],"answer":[1],"explanation":"Network documentation includes physical and logical topology information."},{"module":"Build a Small Network","question":"What mechanism can be implemented in a small network to help minimize network latency for real-time streaming applications?","options":["QoS","PoE","AAA","ICMP"],"answer":[0],"explanation":"QoS can prioritize real-time traffic to reduce latency."},{"module":"Build a Small Network","question":"Which process failed if a computer cannot access the internet and received an IP address of 169.254.142.5?","options":["IP","DNS","DHCP","HTTP"],"answer":[2],"explanation":"A 169.254.x.x APIPA address indicates DHCP failed."},{"module":"Build a Small Network","question":"A small company has only one router as the exit point to its ISP. Which solution could be adopted to maintain connectivity if the router itself, or its connection to the ISP, fails?","options":["Activate another router interface that is connected to the ISP, so the traffic can flow through it.","Have a second router that is connected to another ISP.","Purchase a second least-cost link from another ISP to connect to this router.","Add more interfaces to the router that is connected to the internal network."],"answer":[1],"explanation":"A second router connected to another ISP provides redundancy if the router or ISP link fails."},{"module":"Build a Small Network","question":"When should an administrator establish a network baseline?","options":["When the traffic is at peak in the network","When there is a sudden drop in traffic","At the lowest point of traffic in the network","At regular intervals over a period of time"],"answer":[3],"explanation":"A useful baseline is gathered at regular intervals over time."},{"module":"Build a Small Network","question":"Which two traffic types require delay sensitive delivery? (Choose two.)","options":["Email","Web","FTP","Voice","Video"],"answer":[3,4],"explanation":"Voice and video traffic are delay-sensitive."},{"module":"Build a Small Network","question":"A network technician suspects that a particular network connection between two Cisco switches is having a duplex mismatch. Which command would the technician use to see the Layer 1 and Layer 2 details of a switch port?","options":["show interfaces","show running-config","show ip interface brief","show mac-address-table"],"answer":[0],"explanation":"show interfaces displays speed, duplex, errors, and other Layer 1 and Layer 2 details."},{"module":"Build a Small Network","question":"Which statement is true about CDP on a Cisco device?","options":["The show cdp neighbor detail command will reveal the IP address of a neighbor only if there is Layer 3 connectivity.","To disable CDP globally, the no cdp enable command in interface configuration mode must be used.","CDP can be disabled globally or on a specific interface.","Because it runs at the data link layer, the CDP protocol can only be implemented in switches."],"answer":[2],"explanation":"CDP can be disabled globally with no cdp run or per interface with no cdp enable."},{"module":"Build a Small Network","question":"What factor should be considered in the design of a small network when devices are being chosen?","options":["Cost of devices","Redundancy","Traffic analysis","ISP"],"answer":[0],"explanation":"Cost is a major design factor when choosing devices for a small network."},{"module":"Check Your Understanding - Network Components","question":"Which two devices are intermediary devices? (Choose two)","options":["hosts","routers","servers","switches"],"answer":[1,3],"explanation":"Routers and switches are intermediary devices."},{"module":"Check Your Understanding - Network Representations and Topologies","question":"Which connection physically connects the end device to the network?","options":["Port","NIC","Interface"],"answer":[1],"explanation":"A NIC physically connects an end device to the network."},{"module":"Check Your Understanding - Network Representations and Topologies","question":"Which connections are specialized ports on a networking device that connect to individual networks?","options":["Port","NIC","Interface"],"answer":[2],"explanation":"Interfaces are specialized ports on networking devices that connect to individual networks."},{"module":"Check Your Understanding - Network Representations and Topologies","question":"Which type of network topology lets you see which end devices are connected to which intermediary devices and what media is being used?","options":["Physical topology","Logical topology"],"answer":[0],"explanation":"A physical topology shows device connections and the media used."},{"module":"Check Your Understanding - Network Representations and Topologies","question":"Which type of network topology lets you see the actual location of intermediary devices and cable installation?","options":["Physical topology","Logical topology"],"answer":[0],"explanation":"A physical topology shows actual device locations and cable installation."},{"module":"Check Your Understanding - Common Types of Networks","question":"Which network infrastructure provides access to users and end devices in a small geographical area, which is typically a network in a department in an enterprise, a home, or small business?","options":["Extranet","Intranet","LAN","WAN"],"answer":[2],"explanation":"A LAN provides network access in a small geographical area."},{"module":"Check Your Understanding - Common Types of Networks","question":"Which network infrastructure might an organization use to provide secure and safe access to individuals who work for a different organization but require access to the organization's data?","options":["Extranet","Intranet","LAN","WAN"],"answer":[0],"explanation":"An extranet provides secure access to selected resources for outside organizations."},{"module":"Check Your Understanding - Common Types of Networks","question":"Which network infrastructure provides access to other networks over a large geographical area, which is often owned and managed by a telecommunications service provider?","options":["Extranet","Intranet","LAN","WAN"],"answer":[3],"explanation":"A WAN provides access over a large geographical area."},{"module":"Check Your Understanding - Reliable Networks","question":"When designers follow accepted standards and protocols, which of the four basic characteristics of network architecture is achieved?","options":["fault tolerance","Scalability","QoS","Security"],"answer":[1],"explanation":"Following accepted standards and protocols supports scalability."},{"module":"Check Your Understanding - Reliable Networks","question":"Confidentiality, integrity, and availability are requirements of which of the four basic characteristics of network architecture?","options":["fault tolerance","Scalability","QoS","Security"],"answer":[3],"explanation":"Confidentiality, integrity, and availability are security requirements."},{"module":"Check Your Understanding - Reliable Networks","question":"With which type of policy, a router can manage the flow of data and voice traffic, giving priority to voice communications if the network experiences congestion?","options":["fault tolerance","Scalability","QoS","Security"],"answer":[2],"explanation":"QoS can prioritize voice traffic during congestion."},{"module":"Check Your Understanding - Reliable Networks","question":"Having multiple paths to a destination is known as redundancy. This is an example of which characteristic of network architecture?","options":["fault tolerance","Scalability","QoS","Security"],"answer":[0],"explanation":"Redundancy is part of fault-tolerant network design."},{"module":"Check Your Understanding - Network Trends","question":"Which feature is a good conferencing tool to use with others who are located elsewhere in your city, or even in another country?","options":["BYOD","Video communications","Cloud computing"],"answer":[1],"explanation":"Video communications supports conferencing with people in other locations."},{"module":"Check Your Understanding - Network Trends","question":"Which feature describes using personal tools to access information and communicate across a business or campus network?","options":["BYOD","Video communications","Cloud computing"],"answer":[0],"explanation":"BYOD describes using personal devices to access business or campus network resources."},{"module":"Check Your Understanding - Network Trends","question":"Which feature contains options such as Public, Private, Custom and Hybrid?","options":["BYOD","Video communications","Cloud computing"],"answer":[2],"explanation":"Cloud computing includes public, private, custom, and hybrid deployment options."},{"module":"Check Your Understanding - Network Trends","question":"Which feature is being used when connecting a device to the network using an electrical outlet?","options":["Smart home technology","Powerline","Wireless broadband"],"answer":[1],"explanation":"Powerline networking uses electrical wiring to connect devices."},{"module":"Check Your Understanding - Network Trends","question":"Which feature uses the same cellular technology as a smart phone?","options":["Smart home technology","Powerline","Wireless broadband"],"answer":[2],"explanation":"Wireless broadband uses cellular technology."},{"module":"Check Your Understanding - Network Security","question":"Which attack slows down or crashes equipment and programs?","options":["Firewall","Virus, worm, or Trojan horse","Zero-day or Zero-hour","Virtual Private Network (VPN)","Denial of Service (DoS)"],"answer":[4],"explanation":"A DoS attack slows or crashes equipment and programs."},{"module":"Check Your Understanding - Network Security","question":"Which option creates a secure connection for remote workers?","options":["Firewall","Virus, worm, or Trojan horse","Zero-day or Zero-hour","Virtual Private Network (VPN)","Denial of Service (DoS)"],"answer":[3],"explanation":"A VPN creates a secure connection for remote workers."},{"module":"Check Your Understanding - Network Security","question":"Which option blocks unauthorized access to your network?","options":["Firewall","Virus, worm, or Trojan horse","Zero-day or Zero-hour","Virtual Private Network (VPN)","Denial of Service (DoS)"],"answer":[0],"explanation":"A firewall blocks unauthorized access."},{"module":"Check Your Understanding - Network Security","question":"Which option describes a network attack that occurs on the first day that a vulnerability becomes known?","options":["Firewall","Virus, worm, or Trojan horse","Zero-day or Zero-hour","Virtual Private Network (VPN)","Denial of Service (DoS)"],"answer":[2],"explanation":"A zero-day or zero-hour attack occurs when a vulnerability first becomes known."},{"module":"Check Your Understanding - Network Security","question":"Which option describes malicious code running on user devices?","options":["Firewall","Virus, worm, or Trojan horse","Zero-day or Zero-hour","Virtual Private Network (VPN)","Denial of Service (DoS)"],"answer":[1],"explanation":"Viruses, worms, and Trojan horses are malicious code running on user devices."},{"module":"Check Your Understanding - Cisco IOS Access","question":"Which access method would be most appropriate if you were in the equipment room with a new switch that needs to be configured?","options":["Console","Telnet/SSH","Aux"],"answer":[0],"explanation":"A new switch without initial configuration must be configured through the console port."},{"module":"Check Your Understanding - Cisco IOS Access","question":"Which access method would be most appropriate if your manager gave you a special cable and told you to use it to configure the switch?","options":["Console","Telnet/SSH","Aux"],"answer":[0],"explanation":"A special console cable is used for console access."},{"module":"Check Your Understanding - Cisco IOS Access","question":"Which access method would be the most appropriate in-band access to the IOS over a network connection?","options":["Console","Telnet/SSH","Aux"],"answer":[1],"explanation":"Telnet and SSH are in-band access methods over an active network connection."},{"module":"Check Your Understanding - Cisco IOS Access","question":"Which access method would be the most appropriate if you call your manager to tell him you cannot access your router in another city over the internet and he provides you with the information to access the router through a telephone connection?","options":["Console","Telnet/SSH","Aux"],"answer":[2],"explanation":"The AUX port provides out-of-band access over a telephone connection."},{"module":"Check Your Understanding - IOS Navigation","question":"Which IOS mode allows access to all commands and features?","options":["global configuration mode","interface subconfiguration mode","line console subconfiguration mode","privileged EXEC mode","user EXEC mode"],"answer":[3],"explanation":"Privileged EXEC mode allows access to all commands and features."},{"module":"Check Your Understanding - IOS Navigation","question":"Which IOS mode are you in if the Switch(config)# prompt is displayed?","options":["global configuration mode","interface subconfiguration mode","line console subconfiguration mode","privileged EXEC mode","user EXEC mode"],"answer":[0],"explanation":"The (config)# prompt identifies global configuration mode."},{"module":"Check Your Understanding - IOS Navigation","question":"Which IOS mode are you in if the Switch> prompt is displayed?","options":["global configuration mode","interface subconfiguration mode","line console subconfiguration mode","privileged EXEC mode","user EXEC mode"],"answer":[4],"explanation":"The > prompt identifies user EXEC mode."},{"module":"Check Your Understanding - IOS Navigation","question":"Which two commands would return you to the privileged EXEC prompt regardless of the configuration mode you are in? (Choose two.)","options":["CTRL+Z","disable","enable","end","exit"],"answer":[0,3],"explanation":"CTRL+Z and end return directly to privileged EXEC mode."},{"module":"Check Your Understanding - Basic Device Configuration","question":"What is the command to assign the name \"Sw-Floor-2\" to a switch?","options":["hostname Sw-Floor-2","host name Sw-Floor-2","name Sw-Floor-2"],"answer":[0],"explanation":"The hostname command assigns a device name."},{"module":"Check Your Understanding - Basic Device Configuration","question":"How is the privileged EXEC mode access secured on a switch?","options":["enable class","secret class","enable secret class","service password-encryption"],"answer":[2],"explanation":"The enable secret command secures privileged EXEC access."},{"module":"Check Your Understanding - Basic Device Configuration","question":"Which command enables password authentication for user EXEC mode access on a switch?","options":["enable secret","login","secret","service password-encryption"],"answer":[1],"explanation":"The login command enables password checking on a line."},{"module":"Check Your Understanding - Basic Device Configuration","question":"Which command encrypts all plaintext passwords access on a switch?","options":["enable secret","login","secret","service password-encryption"],"answer":[3],"explanation":"service password-encryption encrypts plaintext passwords in the configuration."},{"module":"Check Your Understanding - Basic Device Configuration","question":"Which is the command to configure a banner to be displayed when connecting to a switch?","options":["banner $ Keep out $","banner motd $ Keep out $","display $ Keep out $","login banner $ Keep out $"],"answer":[1],"explanation":"The banner motd command configures a login banner message."},{"module":"Check Your Understanding - Ports and Addresses","question":"What is the structure of an IPv4 address called?","options":["dotted-binary format","dotted-decimal format","dotted-hexadecimal format"],"answer":[1],"explanation":"IPv4 addresses are written in dotted-decimal format."},{"module":"Check Your Understanding - Ports and Addresses","question":"How is an IPv4 address represented?","options":["four binary numbers between 0 and 1 separated by colons.","four decimal numbers between 0 and 255 separated by periods.","thirty-two hexadecimal numbers separated by colons.","thirty-two hexadecimal numbers separated by periods."],"answer":[1],"explanation":"IPv4 addresses are four decimal numbers from 0 to 255 separated by periods."},{"module":"Check Your Understanding - Ports and Addresses","question":"What type of interface has no physical port associated with it?","options":["console","Ethernet","serial","switch virtual interface (SVI)"],"answer":[3],"explanation":"A switch virtual interface is virtual and has no physical port."},{"module":"Check Your Understanding - The Rules","question":"What is the process of converting information into the proper form for transmission?","options":["Formatting","Encoding","Encapsulation"],"answer":[1],"explanation":"Encoding converts information into a form suitable for transmission."},{"module":"Check Your Understanding - The Rules","question":"Which step of the communication process is concerned with properly identifying the address of the sender and receiver?","options":["Formatting","Encoding","Encapsulation"],"answer":[0],"explanation":"Formatting includes identifying the source and destination addresses."},{"module":"Check Your Understanding - The Rules","question":"Which three are components of message timing? (Choose three.)","options":["Flow control","Sequence numbers","Access method","Retransmit time","Response timeout"],"answer":[0,2,4],"explanation":"Message timing includes flow control, access method, and response timeout."},{"module":"Check Your Understanding - The Rules","question":"Which delivery method is used to transmit information to one or more end devices, but not all devices on the network?","options":["Unicast","Multicast","Broadcast"],"answer":[1],"explanation":"Multicast sends information to one or more selected devices, but not all devices."},{"module":"Check Your Understanding - Protocols","question":"BGP and OSPF are examples of which type of protocol?","options":["network communication","network security","routing","service discovery"],"answer":[2],"explanation":"BGP and OSPF are routing protocols."},{"module":"Check Your Understanding - Protocols","question":"Which two protocols are service discovery protocols? (Choose two.)","options":["DNS","TCP","SSH","DHCP"],"answer":[0,3],"explanation":"DNS and DHCP provide service discovery functions."},{"module":"Check Your Understanding - Protocols","question":"What is the purpose of the sequencing function in network communication?","options":["to uniquely label transmitted segments of data for proper reassembly by the receiver","to determine if data is corrupted during transmission","to ensure data flows at an efficient rate between sender and receiver","to guarantee delivery of data"],"answer":[0],"explanation":"Sequencing labels transmitted segments so the receiver can reassemble them in the proper order."},{"module":"Check Your Understanding - Protocols","question":"This protocol is responsible for guaranteeing the reliable delivery of information.","options":["TCP","IP","HTTP","Ethernet"],"answer":[0],"explanation":"TCP provides reliable delivery."},{"module":"Check Your Understanding - Protocol Suites","question":"UDP and TCP belong to which layer of the TCP/IP protocol?","options":["application","transport","internet","network access"],"answer":[1],"explanation":"TCP
